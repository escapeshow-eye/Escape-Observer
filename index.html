<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Sprach-Test</title>

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

button {
  padding: 15px 25px;
  background: #000;
  color: #fff;
  border: 1px solid #fff;
  border-radius: 6px;
  font-size: 18px;
}

#status {
  margin-top: 25px;
  width: 85%;
  min-height: 30px;
}

</style>
</head>

<body>

<button id="start">
  TEST STARTEN
</button>

<div id="status">
  Noch nicht gestartet
</div>

<script>

const startButton =
  document.getElementById("start");

const status =
  document.getElementById("status");


let recognition = null;

let microphoneStream = null;

let speaking = false;


/* =========================================
   STIMME LADEN
========================================= */

let germanVoice = null;


function loadVoice() {

  if (!("speechSynthesis" in window)) {
    return;
  }

  const voices =
    window.speechSynthesis.getVoices();

  if (!voices.length) {
    return;
  }

  germanVoice =
    voices.find(
      voice =>
        voice.lang === "de-DE"
    )
    ||
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("de")
    )
    ||
    voices[0];

}

loadVoice();


if ("speechSynthesis" in window) {

  window.speechSynthesis.onvoiceschanged =
    loadVoice;

}


/* =========================================
   SPRECHEN
========================================= */

function speak(text) {

  if (!("speechSynthesis" in window)) {

    status.textContent =
      "Sprachausgabe wird nicht unterstützt.";

    return;

  }


  speaking = true;


  status.textContent =
    "Observer spricht: " + text;


  loadVoice();


  const utterance =
    new SpeechSynthesisUtterance(text);


  utterance.lang =
    "de-DE";

  utterance.rate =
    0.9;

  utterance.pitch =
    0.85;

  utterance.volume =
    1;


  if (germanVoice) {

    utterance.voice =
      germanVoice;

  }


  utterance.onend =
    () => {

      speaking = false;

      status.textContent =
        "Ich höre wieder zu.";

    };


  utterance.onerror =
    event => {

      speaking = false;

      status.textContent =
        "Sprachfehler: " +
        event.error;

    };


  /*
    Genau wie beim vorherigen
    funktionierenden TTS-Test.
  */

  window.speechSynthesis.resume();

  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================================
   SPRACHERKENNUNG
========================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  status.textContent =
    "Dieser Browser stellt keine Spracherkennung bereit.";

}
else {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "de-DE";

  recognition.continuous =
    true;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    3;


  recognition.onstart =
    () => {

      status.textContent =
        "🎙️ Ich höre zu. Sag: Hallo";

    };


  recognition.onresult =
    event => {

      /*
        Während der Observer spricht,
        werden neue Worte ignoriert.
      */

      if (speaking) {
        return;
      }


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const result =
          event.results[i];


        if (!result.isFinal) {
          continue;
        }


        for (
          let j = 0;
          j < result.length;
          j++
        ) {

          const heard =
            result[j]
              .transcript
              .toLowerCase()
              .trim();


          console.log(
            "Gehört:",
            heard
          );


          if (
            heard.includes("hallo")
          ) {

            speak(
              "Hallo."
            );

            return;

          }


          status.textContent =
            "Ich habe gehört: " +
            heard;

        }

      }

    };


  recognition.onerror =
    event => {

      console.log(
        "Recognition:",
        event.error
      );


      status.textContent =
        "Erkennungsfehler: " +
        event.error;

    };


  recognition.onend =
    () => {

      /*
        Für diesen Test noch kein
        aggressiver automatischer Neustart.
      */

      console.log(
        "Erkennung beendet."
      );

    };

}


/* =========================================
   START
========================================= */

startButton.addEventListener(
  "click",
  async () => {

    /*
      1. Mikrofon erlauben
    */

    try {

      microphoneStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });

    }

    catch (error) {

      status.textContent =
        "Mikrofon konnte nicht freigegeben werden.";

      console.log(
        "Mikrofonfehler:",
        error
      );

      return;

    }


    /*
      2. Sprache direkt aus dem
         Benutzerklick heraus vorbereiten
    */

    if (
      "speechSynthesis" in window
    ) {

      loadVoice();

      window.speechSynthesis.resume();

    }


    /*
      3. Button verschwinden lassen
    */

    startButton.style.display =
      "none";


    /*
      4. Spracherkennung starten
    */

    if (recognition) {

      try {

        recognition.start();

      }

      catch (error) {

        status.textContent =
          "Spracherkennung konnte nicht gestartet werden.";

        console.log(
          "Startfehler:",
          error
        );

      }

    }

  }
);

</script>

</body>
</html>
