<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>OBSERVER</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* =========================
   AUGE
========================= */

.eye {
  width: 180px;
  height: 110px;

  border: 4px solid white;
  border-radius: 50% / 60%;

  display: flex;
  align-items: center;
  justify-content: center;

  transition:
    height 0.12s ease,
    transform 0.12s ease;
}

.pupil {
  width: 55px;
  height: 55px;

  background: white;
  border-radius: 50%;

  transition:
    transform 0.12s ease;
}

/* Blinzeln */

.eye.blink {
  height: 7px;
}

.eye.blink .pupil {
  transform: scaleY(0);
}


/* =========================
   SPRECHERTEXT
========================= */

.response {
  width: 85%;
  max-width: 850px;

  margin-top: 35px;

  text-align: center;

  font-size: 17px;
  line-height: 1.5;

  letter-spacing: 1px;

  min-height: 30px;
}


/* =========================
   AUDIOWELLE
========================= */

.wave {
  height: 45px;

  margin-top: 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 4px;

  opacity: 0;

  transition: opacity 0.2s;
}

.wave.active {
  opacity: 1;
}

.bar {
  width: 4px;
  height: 8px;

  background: white;

  border-radius: 3px;

  animation:
    audioWave 0.8s ease-in-out infinite;

  animation-play-state: paused;
}

.wave.active .bar {
  animation-play-state: running;
}

.bar:nth-child(1) {
  animation-delay: 0s;
}

.bar:nth-child(2) {
  animation-delay: .1s;
}

.bar:nth-child(3) {
  animation-delay: .2s;
}

.bar:nth-child(4) {
  animation-delay: .3s;
}

.bar:nth-child(5) {
  animation-delay: .2s;
}

.bar:nth-child(6) {
  animation-delay: .1s;
}

.bar:nth-child(7) {
  animation-delay: 0s;
}

@keyframes audioWave {

  0%,
  100% {
    height: 8px;
  }

  50% {
    height: 38px;
  }

}


/* =========================
   AKTIVIERUNG
========================= */

#activate {

  margin-top: 25px;

  padding: 13px 24px;

  background: #000;
  color: white;

  border: 1px solid white;

  font-size: 13px;

  letter-spacing: 2px;

  cursor: pointer;

  touch-action: manipulation;
}

#activate.hidden {
  display: none;
}


/* =========================
   VERDECKTE KAMERA
========================= */

#cameraContainer {

  position: fixed;

  width: 180px;
  height: 135px;

  bottom: 10px;
  right: 10px;

  opacity: 0.01;

  pointer-events: none;
}

#camera {

  width: 100%;
  height: 100%;

  object-fit: cover;
}

#cameraCanvas {
  display: none;
}

</style>
</head>


<body>


<!-- =========================
     OBSERVER AUGE
========================= -->

<div
  class="eye"
  id="eye"
>

  <div
    class="pupil"
  ></div>

</div>


<!-- =========================
     SPRECHERTEXT
========================= -->

<div
  class="response"
  id="response"
></div>


<!-- =========================
     AUDIOWELLE
========================= -->

<div
  class="wave"
  id="wave"
>

  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>

</div>


<!-- =========================
     EINMALIGE AKTIVIERUNG
========================= -->

<button
  id="activate"
>
  OBSERVER AKTIVIEREN
</button>


<!-- =========================
     KAMERA
========================= -->

<div
  id="cameraContainer"
>

  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>

  <canvas
    id="cameraCanvas"
  ></canvas>

</div>


<!-- =========================
     MAILBOX
========================= -->

<audio
  id="mailboxAudio"
  preload="auto"
  src="audio/Stromausfall%20Escape%20Room.m4a"
></audio>


<script>


/* ==================================================
   ELEMENTE
================================================== */

const eye =
  document.getElementById("eye");

const response =
  document.getElementById("response");

const wave =
  document.getElementById("wave");

const activateButton =
  document.getElementById("activate");

const mailboxAudio =
  document.getElementById("mailboxAudio");

const camera =
  document.getElementById("camera");

const canvas =
  document.getElementById("cameraCanvas");

const ctx =
  canvas.getContext("2d");


/* ==================================================
   SYSTEMZUSTAND
================================================== */

let observerActivated = false;

let mailboxPlaying = false;

let emergencyMode = false;

let emergencyPause = false;

let waitingForEmergencyNumber = false;

let recognition = null;

let recognitionAvailable = false;

let cameraReady = false;

let cameraCooldown = false;

let lastCameraState = "unknown";


/* ==================================================
   NORMALES BLINZELN
================================================== */

function blink() {

  eye.classList.add("blink");

  setTimeout(() => {

    eye.classList.remove("blink");

  }, 180);

}


/*
   Alle 10 Sekunden blinzeln.
*/

setInterval(() => {

  if (
    observerActivated &&
    !emergencyPause
  ) {

    blink();

  }

}, 10000);


/* ==================================================
   MORSE-BLINZELN
================================================== */

/*
   . = kurzer Blink
   - = langer Blink

   Beispiel:

   blinkMorse(".");
   blinkMorse("-");
*/

function blinkMorse(symbol) {

  if (!observerActivated) {
    return;
  }

  eye.classList.add("blink");

  const duration =
    symbol === "."
      ? 180
      : 500;

  setTimeout(() => {

    eye.classList.remove("blink");

  }, duration);

}


/* ==================================================
   OBSERVER SPRICHT
================================================== */

function observerSpeak(
  text,
  finished = null
) {

  if (!observerActivated) {
    return;
  }


  response.textContent =
    text;

  wave.classList.add(
    "active"
  );


  /*
     Alte Sprachausgabe stoppen.
  */

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }


  /*
     Falls der Browser keine
     Sprachausgabe unterstützt.
  */

  if (
    !("speechSynthesis" in window)
  ) {

    wave.classList.remove(
      "active"
    );

    if (finished) {
      finished();
    }

    return;
  }


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "de-DE";

  utterance.rate =
    0.85;

  utterance.pitch =
    0.8;

  utterance.volume =
    1;


  utterance.onend =
    () => {

      wave.classList.remove(
        "active"
      );

      response.textContent =
        "";

      if (finished) {
        finished();
      }

    };


  utterance.onerror =
    () => {

      wave.classList.remove(
        "active"
      );

      if (finished) {
        finished();
      }

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==================================================
   MAILBOX
================================================== */

function playMailbox() {

  if (
    mailboxPlaying ||
    emergencyPause
  ) {
    return;
  }


  mailboxPlaying =
    true;


  response.textContent =
    "Ich spiele die Mailbox ab.";


  wave.classList.add(
    "active"
  );


  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }


  const intro =
    new SpeechSynthesisUtterance(
      "Ich spiele die Mailbox ab."
    );


  intro.lang =
    "de-DE";

  intro.rate =
    0.85;

  intro.pitch =
    0.8;

  intro.volume =
    1;


  intro.onend =
    () => {

      response.textContent =
        "";

      mailboxAudio.currentTime =
        0;


      mailboxAudio
        .play()
        .catch(() => {

          finishMailbox();

        });

    };


  intro.onerror =
    () => {

      mailboxAudio.currentTime =
        0;

      mailboxAudio
        .play()
        .catch(() => {

          finishMailbox();

        });

    };


  window.speechSynthesis.speak(
    intro
  );

}


/*
   Mailbox komplett fertig.
*/

mailboxAudio.addEventListener(
  "ended",
  finishMailbox
);


function finishMailbox() {

  mailboxPlaying =
    false;

  wave.classList.remove(
    "active"
  );

  response.textContent =
    "";

}


/* ==================================================
   NOTFALL
================================================== */

function startEmergency() {

  if (emergencyMode) {
    return;
  }


  emergencyMode =
    true;

  emergencyPause =
    true;

  waitingForEmergencyNumber =
    false;


  observerSpeak(
    "Notfall erkannt, Maßnahmen werden eingeleitet.",
    () => {

      /*
        Nicht unterbrechbare Pause.
      */

      setTimeout(() => {

        emergencyAnnouncement();

      }, 5000);

    }
  );

}


function emergencyAnnouncement() {

  const text =
    "Es befinden sich lediglich drei Personen in der Umgebung. Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel in einem Notfall-Ordner.";


  response.textContent =
    text;


  wave.classList.add(
    "active"
  );


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "de-DE";

  utterance.rate =
    0.82;

  utterance.pitch =
    0.8;

  utterance.volume =
    1;


  utterance.onend =
    finishEmergency;


  utterance.onerror =
    finishEmergency;


  window.speechSynthesis.speak(
    utterance
  );

}


function finishEmergency() {

  wave.classList.remove(
    "active"
  );

  response.textContent =
    "";

  emergencyPause =
    false;

}


/* ==================================================
   SPRACHERKENNUNG
================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognitionAvailable =
    true;


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "de-DE";

  recognition.continuous =
    true;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onresult =
    handleSpeech;


  /*
     Safari/iPad kann die Erkennung
     gelegentlich beenden.

     Dann wird sie neu gestartet.
  */

  recognition.onend =
    () => {

      if (
        observerActivated &&
        !mailboxPlaying
      ) {

        setTimeout(
          startRecognition,
          500
        );

      }

    };


  recognition.onerror =
    event => {

      console.log(
        "SpeechRecognition:",
        event.error
      );

    };

}


function startRecognition() {

  if (
    !recognitionAvailable ||
    !observerActivated
  ) {
    return;
  }


  try {

    recognition.start();

  } catch (error) {

    /*
       Erkennung läuft eventuell
       bereits.
    */

  }

}


/* ==================================================
   BEFEHLE
================================================== */

function handleSpeech(event) {

  if (
    !event.results.length
  ) {
    return;
  }


  const result =
    event.results[
      event.results.length - 1
    ];


  if (
    !result.isFinal
  ) {
    return;
  }


  let command =
    result[0].transcript
      .toLowerCase()
      .trim();


  command =
    command.replace(
      /[.,!?;:]/g,
      ""
    );


  console.log(
    "Observer erkannt:",
    command
  );


  /*
     Während Mailbox:
     keine Befehle.
  */

  if (
    mailboxPlaying
  ) {
    return;
  }


  /*
     Während Notfallpause:
     keine Befehle.
  */

  if (
    emergencyPause
  ) {
    return;
  }


  /* ==========================
     NOTFALLNUMMERN
  ========================== */

  if (
    command.includes(
      "notfallnummern"
    )
  ) {

    waitingForEmergencyNumber =
      true;


    observerSpeak(
      "Nennen Sie jetzt die Notfallnummer."
    );


    return;
  }


  /* ==========================
     NOTFALL 03
  ========================== */

  if (
    waitingForEmergencyNumber
  ) {

    const is03 =
      command === "03" ||
      command === "0 3" ||
      command === "null drei" ||
      command === "drei";


    if (is03) {

      startEmergency();

      return;
    }

  }


  /* ==========================
     MAILBOX
  ========================== */

  if (
    command.includes(
      "spiele die mailbox ab"
    ) ||
    command.includes(
      "spiel die mailbox ab"
    ) ||
    command.includes(
      "spiele mailbox ab"
    ) ||
    command.includes(
      "spiel mailbox ab"
    ) ||
    command.includes(
      "mailbox abspielen"
    )
  ) {

    playMailbox();

    return;
  }


  /* ==========================
     HALLO
  ========================== */

  if (
    command === "hallo"
  ) {

    observerSpeak(
      "Hallo."
    );

    return;
  }


  /* ==========================
     WAS
  ========================== */

  if (
    command === "was"
  ) {

    observerSpeak(
      "Was?"
    );

    return;
  }


  /* ==========================
     WER BIST DU
  ========================== */

  if (
    command.includes(
      "wer bist du"
    )
  ) {

    observerSpeak(
      "Observer Typ 0.4"
    );

    return;
  }


  /* ==========================
     WO SIND WIR
  ========================== */

  if (
    command.includes(
      "wo sind wir"
    )
  ) {

    observerSpeak(
      "Ihr wurdet von zwei Männern hier reingebracht, sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, der eine hatte einen Zettel darin versteckt."
    );

    return;
  }


  /* ==========================
     HILFE
  ========================== */

  if (
    command.includes(
      "hilfe"
    )
  ) {

    observerSpeak(
      "Ich bin nicht fürs Helfen da."
    );

    return;
  }


  /* ==========================
     WASCHMASCHINE
  ========================== */

  /*
     Funktioniert auch innerhalb
     eines längeren Satzes.

     Beispiel:

     "Was hast du gegen die Waschmaschine?"

     → Observer reagiert.
  */

  if (
    command.includes(
      "waschmaschine"
    )
  ) {

    observerSpeak(
      "Ich bin nicht für eine Wäsche gemacht."
    );

    return;
  }


  /* ==========================
     WIE KOMMEN WIR RAUS
  ========================== */

  if (
    command.includes(
      "wie kommen wir raus"
    ) ||
    command.includes(
      "wie kommen wir hier raus"
    ) ||
    command.includes(
      "wie kommen wir heraus"
    ) ||
    command.includes(
      "wie kommen wir hier heraus"
    ) ||
    command.includes(
      "wie kommen wir wieder raus"
    ) ||
    (
      command.includes("wie")
      &&
      command.includes("raus")
    )
  ) {

    observerSpeak(
      "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
    );

    return;
  }


  /*
     UNBEKANNTE SÄTZE:

     KEINE REAKTION.
  */

}


/* ==================================================
   KAMERA
================================================== */

async function startCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    console.log(
      "Kamera nicht unterstützt."
    );

    return;
  }


  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: "user"
          },

          audio: false

        });


    camera.srcObject =
      stream;


    cameraReady =
      true;


    setInterval(
      detectCameraPattern,
      1000
    );


  } catch (error) {

    console.log(
      "Kamera:",
      error
    );

  }

}


/* ==================================================
   KAMERA-MUSTER
================================================== */

/*
   Aktuell:

   sehr helles Bild
   →
   "Muster erkannt."

   Das ist nur die Basis.

   Später können wir echte Formen
   erkennen lassen.
*/

function detectCameraPattern() {

  if (
    !observerActivated ||
    !cameraReady ||
    cameraCooldown ||
    mailboxPlaying ||
    emergencyPause
  ) {
    return;
  }


  if (
    camera.videoWidth === 0
  ) {
    return;
  }


  canvas.width = 80;
  canvas.height = 60;


  ctx.drawImage(
    camera,
    0,
    0,
    80,
    60
  );


  const image =
    ctx.getImageData(
      0,
      0,
      80,
      60
    );


  let brightness = 0;


  const pixels =
    image.data.length / 4;


  for (
    let i = 0;
    i < image.data.length;
    i += 4
  ) {

    brightness +=
      (
        image.data[i] +
        image.data[i + 1] +
        image.data[i + 2]
      ) / 3;

  }


  brightness /=
    pixels;


  let state;


  if (
    brightness > 220
  ) {

    state =
      "white";

  } else if (
    brightness < 35
  ) {

    state =
      "black";

  } else {

    state =
      "neutral";

  }


  if (
    state === lastCameraState
  ) {
    return;
  }


  lastCameraState =
    state;


  if (
    state === "white"
  ) {

    cameraCooldown =
      true;


    observerSpeak(
      "Muster erkannt."
    );


    setTimeout(() => {

      cameraCooldown =
        false;

    }, 5000);

  }

}


/* ==================================================
   OBSERVER AKTIVIEREN
================================================== */

activateButton.addEventListener(
  "click",
  async () => {

    observerActivated =
      true;


    activateButton.classList.add(
      "hidden"
    );


    /*
       iPad/Safari Audio freischalten.
    */

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.cancel();


      const unlock =
        new SpeechSynthesisUtterance("");


      unlock.lang =
        "de-DE";

      unlock.volume =
        0;


      window.speechSynthesis.speak(
        unlock
      );

    }


    /*
       Mikrofon starten
    */

    startRecognition();


    /*
       Kamera starten
    */

    await startCamera();

  }

);

</script>

</body>
</html>
