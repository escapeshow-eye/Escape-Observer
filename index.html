<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>OBSERVER</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
  color: #fff;

  font-family: Arial, sans-serif;

  -webkit-user-select: none;
  user-select: none;
}

body {

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;
}


/* =========================
   AUGE
========================= */

.eye {

  width: 180px;
  height: 110px;

  border: 4px solid white;

  border-radius: 50% / 60%;

  display: flex;

  align-items: center;
  justify-content: center;

  transition: height 0.12s ease;
}

.pupil {

  width: 55px;
  height: 55px;

  background: white;

  border-radius: 50%;

  transition: transform 0.12s ease;
}

.eye.blink {

  height: 7px;
}

.eye.blink .pupil {

  transform: scaleY(0);
}


/* =========================
   SPRECHERTEXT
========================= */

.response {

  width: 85%;
  max-width: 850px;

  margin-top: 35px;

  text-align: center;

  font-size: 17px;
  line-height: 1.5;

  letter-spacing: 1px;

  min-height: 30px;
}


/* =========================
   AUDIOWELLE
========================= */

.wave {

  height: 45px;

  margin-top: 15px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 4px;

  opacity: 0;

  transition: opacity 0.15s;
}

.wave.active {

  opacity: 1;
}

.bar {

  width: 4px;
  height: 8px;

  background: white;

  border-radius: 3px;

  animation: audioWave 0.8s ease-in-out infinite;

  animation-play-state: paused;
}

.wave.active .bar {

  animation-play-state: running;
}

.bar:nth-child(1) {
  animation-delay: 0s;
}

.bar:nth-child(2) {
  animation-delay: .1s;
}

.bar:nth-child(3) {
  animation-delay: .2s;
}

.bar:nth-child(4) {
  animation-delay: .3s;
}

.bar:nth-child(5) {
  animation-delay: .2s;
}

.bar:nth-child(6) {
  animation-delay: .1s;
}

.bar:nth-child(7) {
  animation-delay: 0s;
}

@keyframes audioWave {

  0%,
  100% {
    height: 8px;
  }

  50% {
    height: 38px;
  }

}


/* =========================
   AKTIVIERUNG
========================= */

#activate {

  margin-top: 25px;

  padding: 13px 24px;

  background: #000;

  color: white;

  border: 1px solid white;

  font-size: 13px;

  letter-spacing: 2px;

  cursor: pointer;

  touch-action: manipulation;
}

#activate.hidden {

  display: none;
}


/* =========================
   KAMERA
========================= */

#cameraContainer {

  position: fixed;

  width: 160px;
  height: 120px;

  right: 5px;
  bottom: 5px;

  opacity: 0.01;

  pointer-events: none;
}

#camera {

  width: 100%;
  height: 100%;

  object-fit: cover;
}

#cameraCanvas {

  display: none;
}

</style>

</head>


<body>


<!-- AUGE -->

<div
  class="eye"
  id="eye"
>

  <div
    class="pupil"
  ></div>

</div>


<!-- SPRECHERTEXT -->

<div
  class="response"
  id="response"
></div>


<!-- AUDIOWELLE -->

<div
  class="wave"
  id="wave"
>

  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>

</div>


<!-- EINMALIGE AKTIVIERUNG -->

<button
  id="activate"
>

  OBSERVER AKTIVIEREN

</button>


<!-- KAMERA -->

<div
  id="cameraContainer"
>

  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>

  <canvas
    id="cameraCanvas"
  ></canvas>

</div>


<script>


/* ==================================================
   ELEMENTE
================================================== */

const eye =
  document.getElementById("eye");

const response =
  document.getElementById("response");

const wave =
  document.getElementById("wave");

const activateButton =
  document.getElementById("activate");

const camera =
  document.getElementById("camera");

const canvas =
  document.getElementById("cameraCanvas");

const ctx =
  canvas.getContext("2d");


/* ==================================================
   SYSTEM
================================================== */

let active =
  false;

let emergencyRunning =
  false;

let waitingForEmergencyNumber =
  false;

let recognition =
  null;

let recognitionAvailable =
  false;

let recognitionRunning =
  false;

let restartPending =
  false;

let lastRecognitionActivity =
  Date.now();

let cameraStream =
  null;

let cameraReady =
  false;

let cameraTimer =
  null;

let cameraCooldown =
  false;

let lastCameraState =
  "unknown";


/* ==================================================
   BLINZELN
================================================== */

function blink() {

  if (!active) {
    return;
  }

  eye.classList.add("blink");

  setTimeout(() => {

    eye.classList.remove("blink");

  }, 180);

}


/*
   Alle 10 Sekunden.
*/

setInterval(() => {

  if (
    active &&
    !emergencyRunning
  ) {

    blink();

  }

}, 10000);


/* ==================================================
   SPRECHEN
================================================== */

let speechBusy =
  false;


function speak(
  text,
  callback = null
) {

  if (!active) {
    return;
  }

  speechBusy =
    true;

  response.textContent =
    text;

  wave.classList.add(
    "active"
  );


  /*
     Falls Speech Synthesis gerade
     hängt, wird sie vorher sauber
     zurückgesetzt.
  */

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }


  if (
    !("speechSynthesis" in window)
  ) {

    finishSpeech(callback);

    return;

  }


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "de-DE";

  utterance.rate =
    0.85;

  utterance.pitch =
    0.8;

  utterance.volume =
    1;


  let finished =
    false;


  function finish() {

    if (finished) {
      return;
    }

    finished =
      true;

    finishSpeech(callback);

  }


  utterance.onend =
    finish;

  utterance.onerror =
    finish;


  window.speechSynthesis.speak(
    utterance
  );


  /*
     Sicherheits-Timeout.

     Falls Safari die onend-Meldung
     nicht liefert, hängt der Observer
     nicht dauerhaft.
  */

  setTimeout(() => {

    finish();

  }, Math.max(
    8000,
    text.length * 120
  ));

}


function finishSpeech(
  callback
) {

  speechBusy =
    false;

  response.textContent =
    "";

  wave.classList.remove(
    "active"
  );


  if (callback) {

    callback();

  }

}


/* ==================================================
   SPRACHERKENNUNG
================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognitionAvailable =
    true;

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "de-DE";

  recognition.continuous =
    true;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    () => {

      recognitionRunning =
        true;

      restartPending =
        false;

      lastRecognitionActivity =
        Date.now();

    };


  recognition.onresult =
    event => {

      lastRecognitionActivity =
        Date.now();

      handleSpeech(event);

    };


  recognition.onerror =
    event => {

      recognitionRunning =
        false;

      console.log(
        "Speech:",
        event.error
      );

    };


  recognition.onend =
    () => {

      recognitionRunning =
        false;


      if (
        active &&
        !emergencyRunning &&
        !restartPending
      ) {

        restartRecognition();

      }

    };

}


/* ==================================================
   MIKROFON START
================================================== */

function startRecognition() {

  if (
    !recognitionAvailable ||
    !active ||
    emergencyRunning ||
    recognitionRunning
  ) {

    return;

  }


  try {

    recognition.start();

    lastRecognitionActivity =
      Date.now();

  }

  catch (error) {

    console.log(
      "Recognition start:",
      error
    );

  }

}


/* ==================================================
   MIKROFON STOP
================================================== */

function stopRecognition() {

  if (
    !recognition
  ) {

    return;

  }


  try {

    recognition.stop();

  }

  catch (error) {}

}


/* ==================================================
   SICHERER RESTART
================================================== */

function restartRecognition() {

  if (
    restartPending ||
    !active ||
    emergencyRunning
  ) {

    return;

  }


  restartPending =
    true;


  setTimeout(() => {

    restartPending =
      false;

    startRecognition();

  }, 700);

}


/* ==================================================
   WATCHDOG
================================================== */

/*
   Nicht einfach alle 5 Sekunden resetten.

   Stattdessen wird alle 5 Sekunden geprüft:

   "Ist die Spracherkennung wirklich
    noch aktiv?"

   Nur wenn sie hängt, wird sie
   neu gestartet.
*/

setInterval(() => {

  if (
    !active ||
    emergencyRunning
  ) {

    return;

  }


  const inactiveFor =
    Date.now() -
    lastRecognitionActivity;


  if (
    !recognitionRunning ||
    inactiveFor > 12000
  ) {

    restartRecognition();

  }

}, 5000);


/* ==================================================
   BEFEHL ERKENNEN
================================================== */

function handleSpeech(event) {

  /*
     Während einer Sperre wird
     absolut nichts verarbeitet.
  */

  if (
    emergencyRunning
  ) {

    return;

  }


  if (
    !event.results ||
    event.results.length === 0
  ) {

    return;

  }


  const result =
    event.results[
      event.results.length - 1
    ];


  if (
    !result.isFinal
  ) {

    return;

  }


  let command =
    result[0].transcript
      .toLowerCase()
      .trim();


  command =
    command.replace(
      /[.,!?;:]/g,
      ""
    );


  console.log(
    "Erkannt:",
    command
  );


  /* =========================================
     NOTFALLNUMMERN
  ========================================= */

  if (
    command.includes(
      "notfallnummern"
    )
  ) {

    waitingForEmergencyNumber =
      true;

    speak(
      "Nennen Sie jetzt die Notfallnummer."
    );

    return;

  }


  /* =========================================
     NOTFALL 03 / 3
  ========================================= */

  if (
    waitingForEmergencyNumber
  ) {

    if (
      command === "3" ||
      command === "03" ||
      command === "0 3" ||
      command === "drei" ||
      command === "null drei"
    ) {

      startEmergency();

      return;

    }

  }


  /* =========================================
     HALLO
  ========================================= */

  if (
    command === "hallo"
  ) {

    speak(
      "Hallo."
    );

    return;

  }


  /* =========================================
     WAS
  ========================================= */

  if (
    command === "was"
  ) {

    speak(
      "Was?"
    );

    return;

  }


  /* =========================================
     WER BIST DU
  ========================================= */

  if (
    command.includes(
      "wer bist du"
    )
  ) {

    speak(
      "Observer Typ 0.4"
    );

    return;

  }


  /* =========================================
     WO SIND WIR
  ========================================= */

  if (
    command.includes(
      "wo sind wir"
    )
  ) {

    speak(
      "Ihr wurdet von zwei Männern hier reingebracht, sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, der eine hatte einen Zettel darin versteckt."
    );

    return;

  }


  /* =========================================
     HILFE
  ========================================= */

  if (
    command.includes(
      "hilfe"
    )
  ) {

    speak(
      "Ich bin nicht fürs Helfen da."
    );

    return;

  }


  /* =========================================
     WASCHMASCHINE
  ========================================= */

  if (
    command.includes(
      "waschmaschine"
    )
  ) {

    speak(
      "Ich bin nicht für eine Wäsche gemacht."
    );

    return;

  }


  /* =========================================
     WIE KOMMEN WIR RAUS
  ========================================= */

  if (
    command.includes(
      "wie kommen wir raus"
    ) ||

    command.includes(
      "wie kommen wir hier raus"
    ) ||

    command.includes(
      "wie kommen wir heraus"
    ) ||

    command.includes(
      "wie kommen wir hier heraus"
    ) ||

    (
      command.includes("wie") &&
      command.includes("raus")
    )
  ) {

    speak(
      "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
    );

    return;

  }


  /*
     ALLES ANDERE:

     Keine Reaktion.
  */

}


/* ==================================================
   NOTFALL
================================================== */

function startEmergency() {

  if (
    emergencyRunning
  ) {

    return;

  }


  emergencyRunning =
    true;

  waitingForEmergencyNumber =
    false;


  /*
     Mikrofon und Kamera sofort
     deaktivieren.
  */

  stopRecognition();

  stopCamera();


  /*
     Sprache zurücksetzen.
  */

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }


  /*
     ERSTE ANSAGE
  */

  speak(
    "Notfall erkannt, Maßnahmen werden eingeleitet.",
    () => {

      /*
         NICHT UNTERBRECHBARE PAUSE

         Währenddessen:

         Mikrofon AUS
         Kamera AUS
         Befehle BLOCKIERT
      */

      setTimeout(() => {

        emergencySecondMessage();

      }, 5000);

    }
  );

}


/* ==================================================
   NOTFALL ZWEITER TEXT
================================================== */

function emergencySecondMessage() {

  const text =
    "Es befinden sich lediglich drei Personen in der Umgebung. Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel in einem Notfall-Ordner.";


  speak(
    text,
    () => {

      finishEmergency();

    }
  );

}


/* ==================================================
   NOTFALL ENDE
================================================== */

function finishEmergency() {

  emergencyRunning =
    false;


  waitingForEmergencyNumber =
    false;


  response.textContent =
    "";

  wave.classList.remove(
    "active"
  );


  /*
     Erst jetzt wieder freigeben.
  */

  startRecognition();

  startCamera();

}


/* ==================================================
   KAMERA
================================================== */

async function startCamera() {

  if (
    cameraReady
  ) {

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    return;

  }


  try {

    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: "user"
          },

          audio: false

        });


    camera.srcObject =
      cameraStream;


    cameraReady =
      true;


    if (
      !cameraTimer
    ) {

      cameraTimer =
        setInterval(
          detectCameraPattern,
          1000
        );

    }

  }

  catch (error) {

    console.log(
      "Kamera:",
      error
    );

  }

}


/* ==================================================
   KAMERA STOP
================================================== */

function stopCamera() {

  if (
    !cameraStream
  ) {

    return;

  }


  cameraStream
    .getTracks()
    .forEach(
      track => track.stop()
    );


  camera.srcObject =
    null;


  cameraStream =
    null;


  cameraReady =
    false;

}


/* ==================================================
   KAMERA-ERKENNUNG
================================================== */

function detectCameraPattern() {

  if (
    !active ||
    !cameraReady ||
    emergencyRunning ||
    cameraCooldown
  ) {

    return;

  }


  if (
    camera.videoWidth === 0
  ) {

    return;

  }


  canvas.width =
    80;

  canvas.height =
    60;


  ctx.drawImage(
    camera,
    0,
    0,
    80,
    60
  );


  const image =
    ctx.getImageData(
      0,
      0,
      80,
      60
    );


  let brightness =
    0;


  const pixels =
    image.data.length / 4;


  for (
    let i = 0;
    i < image.data.length;
    i += 4
  ) {

    brightness +=
      (
        image.data[i] +
        image.data[i + 1] +
        image.data[i + 2]
      ) / 3;

  }


  brightness /=
    pixels;


  let state =
    "neutral";


  if (
    brightness > 220
  ) {

    state =
      "white";

  }

  else if (
    brightness < 35
  ) {

    state =
      "black";

  }


  if (
    state === lastCameraState
  ) {

    return;

  }


  lastCameraState =
    state;


  /*
     Kamera-Testfunktion.

     Kann später durch echte
     Mustererkennung ersetzt werden.
  */

  if (
    state === "white"
  ) {

    cameraCooldown =
      true;


    speak(
      "Muster erkannt."
    );


    setTimeout(() => {

      cameraCooldown =
        false;

    }, 5000);

  }

}


/* ==================================================
   AKTIVIERUNG
================================================== */

activateButton.addEventListener(
  "click",
  async () => {

    if (active) {
      return;
    }


    active =
      true;


    activateButton.classList.add(
      "hidden"
    );


    /*
       Mikrofon
    */

    startRecognition();


    /*
       Kamera
    */

    await startCamera();

  }
);

</script>

</body>
</html>
