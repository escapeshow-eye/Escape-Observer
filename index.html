<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0,
           maximum-scale=1.0, user-scalable=no,
           viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"

>

<title>OBSERVER</title>

<style>

* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #000;
  color: #fff;

  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}


/* ==============================
   AUGE
============================== */

#eye {
  width: 180px;
  height: 110px;

  border: 4px solid #fff;
  border-radius: 50% / 60%;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: height 0.12s ease;
}

#pupil {
  width: 55px;
  height: 55px;

  background: #fff;
  border-radius: 50%;

  transition: transform 0.12s ease;
}

#eye.blink {
  height: 7px;
}

#eye.blink #pupil {
  transform: scaleY(0);
}


/* ==============================
   SPRECHTEXT
============================== */

#response {
  width: 88%;
  max-width: 850px;

  min-height: 30px;
  margin-top: 35px;

  text-align: center;

  font-size: 17px;
  line-height: 1.5;

  letter-spacing: 1px;
}


/* ==============================
   AUDIOWELLE
============================== */

#wave {
  height: 45px;
  margin-top: 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 4px;

  opacity: 0;

  transition: opacity 0.15s ease;
}

#wave.active {
  opacity: 1;
}

.bar {
  width: 4px;
  height: 8px;

  background: #fff;
  border-radius: 4px;

  animation: wave 0.8s ease-in-out infinite;
}

.bar:nth-child(1) { animation-delay: 0s; }
.bar:nth-child(2) { animation-delay: .1s; }
.bar:nth-child(3) { animation-delay: .2s; }
.bar:nth-child(4) { animation-delay: .3s; }
.bar:nth-child(5) { animation-delay: .2s; }
.bar:nth-child(6) { animation-delay: .1s; }
.bar:nth-child(7) { animation-delay: 0s; }

@keyframes wave {

  0%,
  100% {
    height: 8px;
  }

  50% {
    height: 38px;
  }

}


/* ==============================
   AKTIVIERUNG
============================== */

#activate {
  margin-top: 25px;

  padding: 13px 25px;

  background: #000;
  color: #fff;

  border: 1px solid #fff;
  border-radius: 5px;

  font-size: 13px;
  letter-spacing: 2px;

  cursor: pointer;
}

#activate.hidden {
  display: none;
}


/* ==============================
   KAMERA
============================== */

#camera {
  position: fixed;

  width: 1px;
  height: 1px;

  right: 0;
  bottom: 0;

  opacity: 0.01;

  pointer-events: none;
}

#canvas {
  display: none;
}

</style>
</head>


<body>


<!-- AUGE -->

<div id="eye">

  <div id="pupil"></div>

</div>


<!-- SPRECHTEXT -->

<div id="response"></div>


<!-- AUDIOWELLE -->

<div id="wave">

  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>

</div>


<!-- EINMALIGE AKTIVIERUNG -->

<button id="activate">
  OBSERVER AKTIVIEREN
</button>


<!-- VERDECKTE KAMERA -->

<video
  id="camera"
  autoplay
  playsinline
  muted
></video>

<canvas id="canvas"></canvas>


<script>

/* ==================================================
   ELEMENTE
================================================== */

const eye =
  document.getElementById("eye");

const response =
  document.getElementById("response");

const wave =
  document.getElementById("wave");

const activateButton =
  document.getElementById("activate");

const camera =
  document.getElementById("camera");


/* ==================================================
   SYSTEMZUSTAND
================================================== */

let active = false;

let speaking = false;

let emergency = false;

let waitingForEmergencyNumber = false;

let recognition = null;

let recognitionRunning = false;

let restartTimer = null;

let cameraStream = null;

let cameraRunning = false;

let lastCommand = "";

let lastCommandTime = 0;


/* ==================================================
   SPRACHSTIMME
================================================== */

let germanVoice = null;


function loadVoices() {

  if (!("speechSynthesis" in window)) {
    return;
  }

  const voices =
    window.speechSynthesis.getVoices();

  if (!voices.length) {
    return;
  }

  germanVoice =
    voices.find(
      voice =>
        voice.lang === "de-DE"
    )
    ||
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("de")
    )
    ||
    voices.find(
      voice => voice.default
    )
    ||
    voices[0];

}


loadVoices();


if ("speechSynthesis" in window) {

  window.speechSynthesis.onvoiceschanged =
    loadVoices;

}


/* ==================================================
   AUGE BLINKEN
================================================== */

function blink() {

  if (!active) {
    return;
  }

  eye.classList.add("blink");

  setTimeout(() => {

    eye.classList.remove("blink");

  }, 180);

}


/*
  Normales Blinzeln:
  ungefähr alle 10 Sekunden.
*/

setInterval(() => {

  if (
    active &&
    !emergency &&
    !speaking
  ) {

    blink();

  }

}, 10000);


/* ==================================================
   OBSERVER SPRICHT
================================================== */

function speak(text, callback = null) {

  if (!active) {
    return;
  }

  /*
    Keine zwei Antworten gleichzeitig.
  */

  if (speaking) {
    return;
  }

  speaking = true;

  response.textContent = text;

  wave.classList.add("active");


  /*
    Recognition bleibt technisch aktiv.

    Während speaking === true werden
    ALLE erkannten Sprachresultate
    ignoriert.

    Dadurch kann der Benutzer den
    Observer nicht unterbrechen.
  */


  if (!("speechSynthesis" in window)) {

    finishSpeech(callback);

    return;
  }


  loadVoices();


  try {
    window.speechSynthesis.resume();
  } catch (error) {}


  /*
    Alte Warteschlange entfernen,
    bevor der neue Satz startet.
  */

  try {
    window.speechSynthesis.cancel();
  } catch (error) {}


  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "de-DE";

  utterance.rate = 0.88;

  utterance.pitch = 0.82;

  utterance.volume = 1;


  if (germanVoice) {
    utterance.voice = germanVoice;
  }


  let completed = false;


  function complete() {

    if (completed) {
      return;
    }

    completed = true;

    finishSpeech(callback);

  }


  utterance.onend = complete;

  utterance.onerror = event => {

    console.log(
      "Sprachwiedergabe:",
      event.error
    );

    complete();

  };


  /*
    Fallback gegen minutenlang
    eingeblendeten Text.

    Die Obergrenze liegt bei 14 Sekunden.
  */

  const safetyTimer =
    setTimeout(() => {

      complete();

    }, Math.min(
      14000,
      Math.max(
        2200,
        text.length * 100
      )
    ));


  try {

    window.speechSynthesis.speak(
      utterance
    );

  }

  catch (error) {

    clearTimeout(safetyTimer);

    console.log(
      "Sprachstart:",
      error
    );

    complete();

  }

}


/* ==================================================
   SPRACHE BEENDET
================================================== */

function finishSpeech(callback) {

  speaking = false;

  response.textContent = "";

  wave.classList.remove("active");


  /*
    Das Mikrofon wird NICHT neu gestartet.

    Die laufende Recognition-Session
    bleibt bestehen.
  */


  if (callback) {
    callback();
  }

}


/* ==================================================
   SPEECH RECOGNITION
================================================== */

const RecognitionAPI =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (RecognitionAPI) {

  recognition =
    new RecognitionAPI();


  recognition.lang =
    "de-DE";


  recognition.continuous =
    true;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    3;


  recognition.onstart =
    () => {

      recognitionRunning = true;

    };


  recognition.onresult =
    event => {

      /*
        Während der Observer spricht:
        alles ignorieren.
      */

      if (
        speaking ||
        emergency
      ) {

        return;
      }


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const result =
          event.results[i];


        if (!result.isFinal) {
          continue;
        }


        /*
          Mehrere Erkennungsvorschläge
          prüfen.
        */

        for (
          let j = 0;
          j < result.length;
          j++
        ) {

          const command =
            normalize(
              result[j].transcript
            );


          if (
            handleCommand(command)
          ) {

            return;

          }

        }

      }

    };


  recognition.onerror =
    event => {

      recognitionRunning = false;

      console.log(
        "SpeechRecognition:",
        event.error
      );


      /*
        Nicht bei jedem kleinen Fehler
        sofort zehnmal neu starten.
      */

      scheduleRestart();

    };


  recognition.onend =
    () => {

      recognitionRunning = false;


      if (
        active &&
        !speaking &&
        !emergency
      ) {

        scheduleRestart();

      }

    };

}


/* ==================================================
   RECOGNITION START
================================================== */

function startRecognition() {

  if (
    !recognition ||
    !active ||
    speaking ||
    emergency ||
    recognitionRunning
  ) {

    return;
  }


  try {

    recognition.start();

  }

  catch (error) {

    scheduleRestart();

  }

}


/* ==================================================
   RECOGNITION RESTART
================================================== */

function scheduleRestart() {

  if (restartTimer) {
    return;
  }

  if (
    !active ||
    speaking ||
    emergency
  ) {

    return;
  }


  restartTimer =
    setTimeout(() => {

      restartTimer = null;

      if (
        active &&
        !speaking &&
        !emergency &&
        !recognitionRunning
      ) {

        startRecognition();

      }

    }, 1500);

}


/* ==================================================
   TEXT NORMALISIEREN
================================================== */

function normalize(text) {

  return text
    .toLowerCase()
    .trim()
    .replace(
      /[.,!?;:]/g,
      ""
    )
    .replace(
      /\s+/g,
      " "
    );

}


/* ==================================================
   DOPPELTE BEFEHLE FILTERN
================================================== */

function duplicate(command) {

  const now =
    Date.now();


  if (
    command === lastCommand &&
    now - lastCommandTime < 3000
  ) {

    return true;

  }


  lastCommand =
    command;

  lastCommandTime =
    now;


  return false;

}


/* ==================================================
   BEFEHLE
================================================== */

function handleCommand(command) {

  if (!command) {
    return false;
  }


  if (duplicate(command)) {
    return true;
  }


  /* ===============================================
     NOTFALLNUMMERN
  =============================================== */

  if (
    command.includes(
      "notfallnummern"
    )
  ) {

    waitingForEmergencyNumber =
      true;


    speak(
      "Nennen Sie jetzt die Notfallnummer."
    );


    return true;

  }


  /* ===============================================
     NOTFALL 03 / 3
  =============================================== */

  if (
    waitingForEmergencyNumber
  ) {

    if (
      command === "3" ||
      command === "03" ||
      command === "0 3" ||
      command === "drei" ||
      command === "null drei" ||
      command.includes("nummer drei")
    ) {

      startEmergency();

      return true;

    }

  }


  /* ===============================================
     HALLO
  =============================================== */

  if (
    command === "hallo" ||
    command.startsWith("hallo ")
  ) {

    speak(
      "Hallo."
    );

    return true;

  }


  /* ===============================================
     WAS
  =============================================== */

  if (
    command === "was"
  ) {

    speak(
      "Was?"
    );

    return true;

  }


  /* ===============================================
     WER BIST DU
  =============================================== */

  if (
    command.includes(
      "wer bist du"
    )
    ||
    (
      command.includes("wer") &&
      command.includes("bist") &&
      command.includes("du")
    )
  ) {

    speak(
      "Observer Typ 0.4."
    );

    return true;

  }


  /* ===============================================
     WO SIND WIR
  =============================================== */

  if (
    command.includes(
      "wo sind wir"
    )
    ||
    (
      command.includes("wo") &&
      command.includes("sind") &&
      command.includes("wir")
    )
  ) {

    speak(
      "Ihr wurdet von zwei Männern hier reingebracht, sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, der eine hatte einen Zettel darin versteckt."
    );

    return true;

  }


  /* ===============================================
     HILFE
  =============================================== */

  if (
    command.includes("hilfe")
  ) {

    speak(
      "Ich bin nicht fürs Helfen da."
    );

    return true;

  }


  /* ===============================================
     WASCHMASCHINE
  =============================================== */

  /*
    Funktioniert auch in einem
    längeren Satz.
  */

  if (
    command.includes(
      "waschmaschine"
    )
  ) {

    speak(
      "Ich bin nicht für eine Wäsche gemacht."
    );

    return true;

  }


  /* ===============================================
     WIE KOMMEN WIR RAUS
  =============================================== */

  const hasWie =
    command.includes("wie");

  const hasKommen =
    command.includes("kommen");

  const hasRaus =
    command.includes("raus") ||
    command.includes("heraus");


  if (
    (
      hasWie &&
      hasKommen &&
      hasRaus
    )
    ||
    command.includes(
      "wie kommen wir hier raus"
    )
    ||
    command.includes(
      "wie kommen wir hier heraus"
    )
  ) {

    speak(
      "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
    );

    return true;

  }


  /*
    Unbekannter Satz:
    keine Reaktion.
  */

  return false;

}


/* ==================================================
   NOTFALLSEQUENZ
================================================== */

function startEmergency() {

  if (emergency) {
    return;
  }


  emergency = true;

  waitingForEmergencyNumber = false;


  /*
    Recognition bleibt aktiv,
    aber onresult ignoriert während
    emergency === true alles.
  */


  speak(
    "Notfall erkannt, Maßnahmen werden eingeleitet.",
    () => {

      /*
        Feste Pause:
        keine Befehle.
      */

      setTimeout(() => {

        emergencySecondPart();

      }, 5000);

    }
  );

}


function emergencySecondPart() {

  speak(
    "Es befinden sich lediglich drei Personen in der Umgebung. Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel in einem Notfall-Ordner.",
    () => {

      emergency = false;

      waitingForEmergencyNumber = false;

    }
  );

}


/* ==================================================
   KAMERA
================================================== */

async function startCamera() {

  if (cameraRunning) {
    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    return;
  }


  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment"
        },
        audio: false
      });


    camera.srcObject =
      cameraStream;


    cameraRunning = true;


    /*
      Kamera ist bereit.
      Die eigentliche Mustererkennung
      kommt später.
    */

  }

  catch (error) {

    console.log(
      "Kamera:",
      error
    );

  }

}


/* ==================================================
   OBSERVER STARTEN
================================================== */

activateButton.addEventListener(
  "click",
  async () => {

    if (active) {
      return;
    }


    active = true;


    activateButton.classList.add(
      "hidden"
    );


    /*
      iPad-Speech direkt durch
      die Benutzeraktion vorbereiten.
    */

    if (
      "speechSynthesis" in window
    ) {

      try {

        loadVoices();

        window.speechSynthesis.resume();

      } catch (error) {}

    }


    /*
      Kamera einmalig freigeben.
    */

    await startCamera();


    /*
      Recognition starten.
    */

    setTimeout(() => {

      startRecognition();

    }, 300);

  }
);


/* ==================================================
   NOTFALL-WATCHDOG
================================================== */

setInterval(() => {

  /*
    Niemals während einer Antwort
    oder Notfallsequenz eingreifen.
  */

  if (
    !active ||
    speaking ||
    emergency
  ) {

    return;
  }


  /*
    Nur reparieren, wenn Recognition
    wirklich beendet wurde.
  */

  if (
    !recognitionRunning
  ) {

    scheduleRestart();

  }

}, 5000);

</script>

</body>
</html>
