<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mikrofon Test</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    button {
      padding: 15px 25px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 6px;
      font-size: 18px;
    }

    #status {
      margin-top: 25px;
      width: 85%;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <button id="start">
    MIKROFON STARTEN
  </button>

  <div id="status">
    Noch nicht gestartet
  </div>

<script>

const startButton =
  document.getElementById("start");

const status =
  document.getElementById("status");

let recognition = null;

let microphoneStream = null;


/* =========================================
   SPRACHERKENNUNG
========================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (!SpeechRecognition) {

  status.textContent =
    "Spracherkennung wird von diesem Browser nicht unterstützt.";

} else {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "de-DE";

  recognition.continuous =
    true;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    3;


  recognition.onstart = () => {

    status.textContent =
      "🎙️ Ich höre zu. Sag jetzt: Hallo";

  };


  recognition.onresult = (event) => {

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const result =
        event.results[i];

      if (!result.isFinal) {
        continue;
      }

      const heard =
        result[0]
          .transcript
          .toLowerCase()
          .trim();

      console.log(
        "Erkannt:",
        heard
      );


      if (
        heard.includes("hallo")
      ) {

        status.textContent =
          "✅ Hallo erkannt!";

      } else {

        status.textContent =
          "Gehört: " + heard;

      }

    }

  };


  recognition.onerror =
    (event) => {

      status.textContent =
        "Fehler: " + event.error;

      console.log(
        "SpeechRecognition Fehler:",
        event.error
      );

    };


  recognition.onend =
    () => {

      console.log(
        "Spracherkennung beendet."
      );

    };

}


/* =========================================
   START
========================================= */

startButton.addEventListener(
  "click",
  async () => {

    startButton.disabled = true;

    status.textContent =
      "Mikrofon wird angefordert...";


    /*
      Mikrofon ausdrücklich freigeben.

      Dadurch sollte auf dem iPad
      die Mikrofon-Abfrage erscheinen.
    */

    try {

      microphoneStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: false
        });

    }

    catch (error) {

      status.textContent =
        "Mikrofon wurde nicht freigegeben.";

      console.log(
        "Mikrofonfehler:",
        error
      );

      startButton.disabled = false;

      return;
    }


    /*
      Erst NACH erfolgreicher
      Mikrofonfreigabe starten.
    */

    if (recognition) {

      try {

        recognition.start();

      }

      catch (error) {

        status.textContent =
          "Spracherkennung konnte nicht gestartet werden.";

        console.log(
          "Startfehler:",
          error
        );

        startButton.disabled = false;

      }

    }

  }
);

</script>

</body>
</html>
