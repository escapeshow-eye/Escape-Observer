<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Observer KI</title>
  <style>
    body { font-family: sans-serif; background: #0d0d0d; color: #00ffcc; text-align: center; padding: 20px; }
    video { width: 320px; height: 240px; border: 2px solid #00ffcc; border-radius: 8px; margin-top: 15px; }
    #status { margin: 15px; font-weight: bold; font-size: 1.2em; }
  </style>
</head>
<body>

  <h1>Observer KI Interface</h1>
  <div id="status">Klicke einmal auf die Seite, um das System zu aktivieren.</div>
  <video id="webcam" autoplay playsinline muted></video>

  <script>
    // Feste Antworten für exakte Sätze
    const EXAKTE_BEFEHLE = {
      "hallo": "Hallo",
      "wo sind wir": "Sie befinden sich in einem überwachten Bereich",
      "wer bist du": "Ich bin ein Observer",
      "wie kommen wir raus": "Probiert es mal mit der Tür, ansonsten keine Ahnung"
    };

    let isSpeaking = false;

    // Sprachausgabe (TTS)
    function sprich(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.pitch = 0.9; // Leicht tieferer KI-Ton
        utterance.rate = 0.95;

        utterance.onstart = () => { isSpeaking = true; };
        utterance.onend = () => { isSpeaking = false; };
        utterance.onerror = () => { isSpeaking = false; };

        window.speechSynthesis.speak(utterance);
      }
    }

    // Spracherkennung (STT)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'de-DE';

      recognition.onresult = (event) => {
        if (isSpeaking) return; // Reagiert nicht und lässt sich nicht reinreden, während sie spricht

        const lastIndex = event.results.length - 1;
        // Satz bereinigen (Satzzeichen entfernen & Kleinschreibung)
        const gehoert = event.results[lastIndex][0].transcript.toLowerCase().replace(/[.,?!]/g, "").trim();
        console.log("Gehört:", gehoert);

        // 1. Flexibler Check: Enthält der Satz das Wort "waschmaschine"?
        if (gehoert.includes("waschmaschine")) {
          document.getElementById('status').innerText = "Auslöser erkannt: Waschmaschine";
          sprich("Ich bin nicht für eine Wäsche gemacht");
        } 
        // 2. Exakter Check für alle anderen Befehle
        else if (EXAKTE_BEFEHLE[gehoert]) {
          document.getElementById('status').innerText = "Befehl erkannt: " + gehoert;
          sprich(EXAKTE_BEFEHLE[gehoert]);
        }
      };

      recognition.onend = () => {
        recognition.start(); // Dauerhaftes Zuhören sicherstellen
      };

      recognition.onerror = (e) => {
        console.error("Fehler bei der Erkennung:", e.error);
      };

      document.body.addEventListener('click', () => {
        recognition.start();
        document.getElementById('status').innerText = "Observer bereit. Höre zu...";
      }, { once: true });

    } else {
      alert("Bitte Edge oder Chrome nutzen.");
    }

    // Kamera-Zugriff
    async function initKamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        document.getElementById('webcam').srcObject = stream;
      } catch (err) {
        console.error("Kamera-Fehler:", err);
      }
    }

    initKamera();
  </script>
</body>
</html>
