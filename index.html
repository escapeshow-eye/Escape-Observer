<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  background: #000;
  color: #fff;

  font-family: Arial, Helvetica, sans-serif;

  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}


/* =========================================
   OBSERVER-BEREICH
========================================= */

#observerArea {
  width: 100%;
  height: 150px;

  flex-shrink: 0;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: flex-start;

  padding-top: 18px;
}


/* =========================================
   AUGE
========================================= */

#eye {
  position: relative;

  width: 150px;
  height: 90px;

  flex-shrink: 0;

  border: 4px solid white;

  border-radius: 50% / 60%;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

#pupil {
  width: 46px;
  height: 46px;

  background: white;

  border-radius: 50%;
}


/* =========================================
   NORMALES BLINZELN
========================================= */

#eye.normalBlink #pupil {
  opacity: 0;
}

#eye.normalBlink::before,
#eye.normalBlink::after {

  content: "";

  position: absolute;

  left: -5px;

  width: calc(100% + 10px);

  height: 51%;

  background: #000;

  z-index: 2;

}

#eye.normalBlink::before {
  top: -5px;
}

#eye.normalBlink::after {
  bottom: -5px;
}


/* =========================================
   TITEL
========================================= */

#title {
  margin-top: 8px;

  font-size: 13px;

  letter-spacing: 5px;

  opacity: 0.7;
}


/* =========================================
   CHAT
========================================= */

#chat {

  width: 100%;

  flex: 1;

  overflow-y: auto;

  padding:
    18px
    14px
    20px;

  -webkit-overflow-scrolling: touch;
}


/* =========================================
   CHAT-NACHRICHT
========================================= */

.message {
  width: 100%;
  margin-bottom: 17px;
}

.messageLabel {
  margin-bottom: 5px;

  font-size: 10px;

  letter-spacing: 2px;

  opacity: 0.45;
}

.messageText {

  font-size: 16px;

  line-height: 1.5;

  word-break: break-word;

  white-space: pre-wrap;
}


/* =========================================
   EINGABE
========================================= */

#inputArea {

  width: 100%;

  display: flex;

  align-items: center;

  gap: 8px;

  padding:
    9px
    12px
    max(
      10px,
      env(safe-area-inset-bottom)
    );

  border-top:
    1px solid
    rgba(255,255,255,0.15);

  background: #000;

  flex-shrink: 0;
}


/* =========================================
   TEXTFELD
========================================= */

#input {

  flex: 1;

  min-width: 0;

  height: 48px;

  padding:
    0 15px;

  border:
    1px solid
    rgba(255,255,255,0.35);

  border-radius: 24px;

  background: #111;

  color: #fff;

  outline: none;

  font-size: 16px;

  -webkit-user-select: text;
  user-select: text;
}

#input::placeholder {
  color:
    rgba(255,255,255,0.4);
}


/* =========================================
   BUTTONS
========================================= */

.iconButton {

  width: 48px;
  height: 48px;

  padding: 0;

  border:
    1px solid
    rgba(255,255,255,0.4);

  border-radius: 50%;

  background: #000;

  color: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 20px;

  flex-shrink: 0;

  touch-action: manipulation;
}


/* =========================================
   MIKROFON
========================================= */

#micButton.active {

  background: #fff;

  color: #000;

  border-color: #fff;
}

.iconButton:disabled {

  opacity: 0.3;
}


/* =========================================
   MIKROFONSTATUS
========================================= */

#micStatus {

  position: fixed;

  left: 50%;

  bottom: 80px;

  transform:
    translateX(-50%);

  padding:
    5px 10px;

  font-size: 10px;

  letter-spacing: 2px;

  opacity: 0;

  pointer-events: none;

}

#micStatus.visible {
  opacity: 0.65;
}


/* =========================================
   KAMERA
========================================= */

/*
   Die Kamera bleibt aktiv,
   wird aber nicht sichtbar angezeigt.
*/

#scannerVideo {

  position: fixed;

  width: 2px;
  height: 2px;

  right: 0;
  bottom: 0;

  opacity: 0.01;

  pointer-events: none;
}

<script>

/* =================================================
   ELEMENTE
================================================= */

const eye =
  document.getElementById("eye");

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const micButton =
  document.getElementById("micButton");

const sendButton =
  document.getElementById("sendButton");

const micStatus =
  document.getElementById("micStatus");

const scannerVideo =
  document.getElementById("scannerVideo");


/* =================================================
   CHAT
================================================= */

function addMessage(
  sender,
  message
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message";


  const label =
    document.createElement("div");

  label.className =
    "messageLabel";

  label.textContent =
    sender;


  const text =
    document.createElement("div");

  text.className =
    "messageText";

  text.textContent =
    message;


  wrapper.appendChild(label);

  wrapper.appendChild(text);

  chat.appendChild(wrapper);


  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* =================================================
   AUGE
================================================= */

function blink() {

  eye.classList.add(
    "normalBlink"
  );


  setTimeout(() => {

    eye.classList.remove(
      "normalBlink"
    );

  }, 170);

}


function scheduleBlink() {

  const delay =
    5000 +
    Math.random() * 8500;


  setTimeout(() => {

    blink();

    scheduleBlink();

  }, delay);

}


scheduleBlink();


/* =================================================
   SPRACHEINGABE
================================================= */

let recognition = null;

let listening = false;

let sending = false;

let emergencyStep = false;

let lastSentCommand = "";

let lastSentTime = 0;


/* =================================================
   NORMALISIEREN
================================================= */

function normalize(
  value
) {

  return value
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[.,!?;:()[\]{}"'„“]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    );

}


/* =================================================
   BELEIDIGUNGEN
================================================= */

const insults = [

  "arsch",
  "arschloch",
  "idiot",
  "idiotin",
  "dummkopf",
  "depp",
  "trottel",
  "blödmann",
  "blodmann",
  "vollidiot",
  "hurensohn",
  "mistkerl",
  "miststück",
  "miststueck",
  "schlampe",
  "wichser",
  "penner",
  "spasti",
  "opfer"

];


function containsInsult(
  text
) {

  const words =
    text.split(" ");


  return insults.some(
    word =>
      words.includes(word)
  );

}


/* =================================================
   RELEVANTE THEMEN
================================================= */

const relevantWords = [

  "observer",
  "escape",
  "raum",
  "tür",
  "tur",
  "raus",
  "heraus",
  "hilfe",
  "waschmaschine",
  "notfall",
  "nummer",
  "drei",
  "03",
  "mann",
  "männer",
  "maenner",
  "hoodie",
  "jacke",
  "zettel",
  "betriebssystem",
  "überwachung",
  "ueberwachung",
  "beobachtung",
  "ordner",
  "show",
  "signal",
  "licht",
  "symbol",
  "barcode",
  "karton",
  "scan",
  "scannen"

];


function isRelevant(
  command
) {

  if (
    command === "hallo" ||
    command === "hi" ||
    command === "hey" ||
    command === "was"
  ) {

    return true;

  }


  for (
    const word of relevantWords
  ) {

    if (
      command.includes(word)
    ) {

      return true;

    }

  }


  return (
    command.includes("wer bist")
    ||
    command.includes("was bist")
    ||
    command.includes("wie heisst")
    ||
    command.includes("wie heißt")
    ||
    command.includes("was passiert")
    ||
    command.includes("was sollen wir")
  );

}


/* =================================================
   DOPPELTE SENDUNGEN
================================================= */

function isDuplicateSend(
  command
) {

  const now =
    Date.now();


  if (
    command === lastSentCommand &&
    now - lastSentTime < 2500
  ) {

    return true;

  }


  lastSentCommand =
    command;

  lastSentTime =
    now;


  return false;

}


/* =================================================
   NOTFALLNUMMERN
================================================= */

function getEmergencyNumber(
  command
) {

  if (
    command === "1" ||
    command === "01" ||
    command === "eins" ||
    command === "null eins" ||
    command.includes("nummer eins")
  ) {
    return "01";
  }


  if (
    command === "2" ||
    command === "02" ||
    command === "zwei" ||
    command === "null zwei" ||
    command.includes("nummer zwei")
  ) {
    return "02";
  }


  if (
    command === "3" ||
    command === "03" ||
    command === "drei" ||
    command === "null drei" ||
    command.includes("nummer drei")
  ) {
    return "03";
  }


  if (
    command === "4" ||
    command === "04" ||
    command === "vier" ||
    command === "null vier" ||
    command.includes("nummer vier")
  ) {
    return "04";
  }


  if (
    command === "5" ||
    command === "05" ||
    command === "fuenf" ||
    command === "fünf" ||
    command === "null fünf" ||
    command.includes("nummer fünf")
  ) {
    return "05";
  }


  if (
    command === "6" ||
    command === "06" ||
    command === "sechs" ||
    command === "null sechs" ||
    command.includes("nummer sechs")
  ) {
    return "06";
  }


  if (
    command === "7" ||
    command === "07" ||
    command === "sieben" ||
    command === "null sieben"
  ) {
    return "07";
  }


  if (
    command === "8" ||
    command === "08" ||
    command === "acht" ||
    command === "null acht"
  ) {
    return "08";
  }


  if (
    command === "9" ||
    command === "09" ||
    command === "neun" ||
    command === "null neun"
  ) {
    return "09";
  }


  return null;

}


/* =================================================
   FALSCHE NOTFALLNUMMERN
================================================= */

function emergencyNumberResponse(
  number
) {

  switch (number) {

    case "01":
      return "Notfallkanal 01. Akustische Auffälligkeit registriert. Kein weiterer Vorgang erforderlich.";

    case "02":
      return "Notfallkanal 02. Möglicher Fehlalarm. Überprüfen Sie die Umgebung.";

    case "04":
      return "Notfallkanal 04. Keine eindeutige Gefahrenlage festgestellt.";

    case "05":
      return "Notfallkanal 05. Dieser Kanal ist für den aktuellen Vorgang nicht verfügbar.";

    case "06":
      return "Notfallkanal 06. Falscher Notfallkanal.";

    case "07":
      return "Notfallkanal 07. Keine gültige Notfallmeldung vorhanden.";

    case "08":
      return "Notfallkanal 08. Dieser Kanal ist für den aktuellen Vorfall nicht vorgesehen.";

    case "09":
      return "Notfallkanal 09. Notfallcode nicht bestätigt.";

    default:
      return "Ungültiger Notfallkanal.";
  }

}


/* =================================================
   OBSERVER-ANTWORT
================================================= */

function getObserverAnswer(
  command
) {

  command =
    normalize(command);


  /* =====================================
     BELEIDIGUNGEN
  ===================================== */

  if (
    containsInsult(command)
  ) {

    return "Bitte unterlasse das, wir sind im öffentlich Rechtlichen Fernsehen zu sehen!";

  }


  /* =====================================
     NOTFALLNUMMERN
  ===================================== */

  if (
    command.includes("notfallnummern")
  ) {

    emergencyStep =
      true;


    return "Nennen Sie jetzt die Notfallnummer.";

  }


  /* =====================================
     NOTFALLNUMMER
  ===================================== */

  if (
    emergencyStep
  ) {

    const number =
      getEmergencyNumber(command);


    if (
      number
    ) {

      emergencyStep =
        false;


      if (
        number === "03"
      ) {

        return (
          "Notfall erkannt, Maßnahmen werden eingeleitet.\n\n" +
          "Es befinden sich lediglich drei Personen in der Umgebung. " +
          "Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. " +
          "Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel " +
          "in einem Notfall-Ordner."
        );

      }


      return emergencyNumberResponse(
        number
      );

    }

  }


  /* =====================================
     HALLO
  ===================================== */

  if (
    command === "hallo" ||
    command.startsWith("hallo ") ||
    command === "hi" ||
    command === "hey"
  ) {

    return "Hallo.";

  }


  /* =====================================
     WAS
  ===================================== */

  if (
    command === "was"
  ) {

    return "Was?";

  }


  /* =====================================
     WER BIST DU
  ===================================== */

  if (
    command.includes("wer bist du") ||
    command.includes("was bist du") ||
    command.includes("wie heißt du") ||
    command.includes("wie heisst du")
  ) {

    return "Observer Typ 0.4.";

  }


  /* =====================================
     WO SIND WIR
  ===================================== */

  if (
    command.includes("wo sind wir") ||
    (
      command.includes("wo") &&
      command.includes("sind") &&
      command.includes("wir")
    )
  ) {

    return (
      "Ihr wurdet von zwei Männern hier reingebracht, " +
      "sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, " +
      "der eine hatte einen Zettel darin versteckt."
    );

  }


  /* =====================================
     HILFE
  ===================================== */

  if (
    command.includes("hilfe") ||
    command.includes("hilf uns")
  ) {

    return "Ich bin nicht fürs Helfen da.";

  }


  /* =====================================
     WASCHMASCHINE
  ===================================== */

  if (
    command.includes("waschmaschine")
  ) {

    return "Ich bin nicht für eine Wäsche gemacht.";

  }


  /* =====================================
     WIE KOMMEN WIR RAUS
  ===================================== */

  const hasWie =
    command.includes("wie");

  const hasKommen =
    command.includes("kommen");

  const hasRaus =
    command.includes("raus") ||
    command.includes("heraus");


  if (
    (
      hasWie &&
      hasKommen &&
      hasRaus
    )
    ||
    command.includes(
      "wie kommen wir hier raus"
    )
    ||
    command.includes(
      "wie kommen wir hier heraus"
    )
  ) {

    return (
      "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
    );

  }


  /* =====================================
     OFF-TOPIC
  ===================================== */

  if (
    !isRelevant(command)
  ) {

    return (
      "Diese Frage gehört nicht zur Show, stelle eine andere!"
    );

  }


  return (
    "Ich habe das nicht verstanden. Stelle die Frage bitte noch einmal."
  );

}


/* =================================================
   CHAT SENDEN
================================================= */

function sendMessage() {

  if (
    sending
  ) {

    return;

  }


  const raw =
    input.value.trim();


  if (
    !raw
  ) {

    return;

  }


  const command =
    normalize(raw);


  if (
    isDuplicateSend(command)
  ) {

    input.value = "";

    return;

  }


  sending =
    true;


  sendButton.disabled =
    true;


  micButton.disabled =
    true;


  stopListening();


  addMessage(
    "DU",
    raw
  );


  input.value =
    "";


  setTimeout(() => {

    const answer =
      getObserverAnswer(
        command
      );


    addMessage(
      "OBSERVER",
      answer
    );


    sending =
      false;


    sendButton.disabled =
      false;


    micButton.disabled =
      false;

  }, 180);

}


sendButton.addEventListener(
  "click",
  sendMessage
);


/* =================================================
   ENTER
================================================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =================================================
   SPRACHERKENNUNG
================================================= */

const RecognitionAPI =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (
  RecognitionAPI
) {

  recognition =
    new RecognitionAPI();


  recognition.lang =
    "de-DE";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    3;


  recognition.onstart =
    () => {

      listening =
        true;


      micButton.classList.add(
        "active"
      );


      micStatus.classList.add(
        "visible"
      );


      micStatus.textContent =
        "ICH HÖRE ZU";

    };


  recognition.onresult =
    event => {

      let transcript =
        "";


      for (
        let i = 0;
        i < event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0]
            .transcript;

      }


      input.value =
        transcript.trim();


      const last =
        event.results[
          event.results.length - 1
        ];


      if (
        last.isFinal
      ) {

        micStatus.textContent =
          "SPRACHE ERKANNT";

      }

    };


  recognition.onerror =
    event => {

      listening =
        false;


      micButton.classList.remove(
        "active"
      );


      micStatus.classList.remove(
        "visible"
      );


      console.log(
        "SpeechRecognition:",
        event.error
      );

    };


  recognition.onend =
    () => {

      listening =
        false;


      micButton.classList.remove(
        "active"
      );


      micStatus.classList.remove(
        "visible"
      );

    };

}


/* =================================================
   MIKROFON
================================================= */

function startListening() {

  if (
    !recognition ||
    listening ||
    sending
  ) {

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    console.log(
      "Mikrofonstart:",
      error
    );

  }

}


function stopListening() {

  if (
    !recognition
  ) {

    return;

  }


  try {

    recognition.stop();

  }

  catch (error) {}


  listening =
    false;


  micButton.classList.remove(
    "active"
  );


  micStatus.classList.remove(
    "visible"
  );

}


micButton.addEventListener(
  "click",
  () => {

    if (
      sending
    ) {

      return;

    }


    if (
      listening
    ) {

      stopListening();

      return;

    }


    startListening();

  }
);


/* =================================================
   BARCODE-SCANNER
================================================= */

let barcodeReader = null;

let barcodeControls = null;

let lastDetectedValue = "";

let lastDetectedTime = 0;

let scannerStarted = false;


/*
   Genau dieser Wert soll reagieren.
*/

const TARGET_BARCODE =
  "000000";


/*
   Gewünschte Nachricht.
*/

const BARCODE_MESSAGE =
  "Ich habe den Inhalt in diesem Karton gescannt:\n\n" +
  "WARNUNG, es befinden sich zerbrechliche Gegenstände in diesem Karton. " +
  "Laut Scan enthält es eine Flüssigkeit.";


/* =================================================
   BARCODE AUSLÖSEN
================================================= */

function handleBarcode(
  value
) {

  if (!value) {
    return;
  }


  const cleanValue =
    String(value)
      .trim();


  /*
     NUR 000000.

     Jeder andere Barcode:
     nichts tun.
  */

  if (
    cleanValue !== TARGET_BARCODE
  ) {

    return;

  }


  /*
     Verhindert, dass derselbe
     Barcode 30-mal pro Sekunde
     eine neue Nachricht erzeugt.
  */

  const now =
    Date.now();


  if (
    cleanValue === lastDetectedValue &&
    now - lastDetectedTime < 5000
  ) {

    return;

  }


  lastDetectedValue =
    cleanValue;


  lastDetectedTime =
    now;


  addMessage(
    "OBSERVER",
    BARCODE_MESSAGE
  );

}


/* =================================================
   KAMERA STARTEN
================================================= */

async function startBarcodeScanner() {

  /*
     Nicht zweimal starten.
  */

  if (
    scannerStarted
  ) {

    return;

  }


  if (
    !window.ZXingBrowser
  ) {

    console.log(
      "ZXing konnte nicht geladen werden."
    );

    return;

  }


  try {

    scannerStarted =
      true;


    /*
       MultiFormatReader erkennt
       verschiedene Barcode-Typen,
       einschließlich QR-Codes.

       Wir prüfen danach aber trotzdem
       ausschließlich auf 000000.
    */

    barcodeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    /*
       Kamera-Geräte suchen.
    */

    const devices =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      console.log(
        "Keine Kamera gefunden."
      );

      scannerStarted =
        false;

      return;

    }


    /*
       Zuerst nach Rückkamera suchen.

       Auf iPad heißt sie häufig
       "back", "rear" oder ähnlich.
    */

    let selectedDevice =
      devices.find(
        device =>
          /back|rear|environment|rück|hinten/i
            .test(
              device.label || ""
            )
      );


    /*
       Falls der Name nicht eindeutig
       ist, letzte Kamera verwenden.
    */

    if (
      !selectedDevice
    ) {

      selectedDevice =
        devices[devices.length - 1];

    }


    /*
       Dauerhaft aus der Kamera
       lesen.

       ZXing übernimmt die wiederholten
       Scanversuche.
    */

    barcodeControls =
      await barcodeReader
        .decodeFromVideoDevice(
          selectedDevice.deviceId,
          scannerVideo,
          (
            result,
            error
          ) => {

            /*
               Kein Ergebnis:
               völlig normal beim
               normalen Kamerabetrieb.
            */

            if (
              !result
            ) {

              return;

            }


            const value =
              result.getText();


            handleBarcode(
              value
            );

          }
        );


  }

  catch (error) {

    console.log(
      "Barcode-Kamera:",
      error
    );


    /*
       Scanner darf später erneut
       versucht werden.
    */

    scannerStarted =
      false;

  }

}


/* =================================================
   KAMERA BEIM LADEN STARTEN
================================================= */

/*
   Einen kleinen Moment warten,
   damit die Seite vollständig
   geladen ist.
*/

window.addEventListener(
  "load",
  () => {

    setTimeout(
      startBarcodeScanner,
      500
    );

  }
);

</script>
