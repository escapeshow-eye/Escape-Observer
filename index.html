<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSERVER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       AUGE
    ========================= */

    .eye {
      width: 180px;
      height: 110px;

      border: 4px solid white;
      border-radius: 50% / 60%;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        height 0.12s ease-in-out,
        transform 0.3s ease;
    }

    .pupil {
      width: 55px;
      height: 55px;

      background: white;
      border-radius: 50%;

      transition:
        transform 0.12s ease-in-out;
    }

    /* Blinzeln */

    .eye.blink {
      height: 6px;
    }

    .eye.blink .pupil {
      transform: scaleY(0);
    }


    /* =========================
       TEXT
    ========================= */

    .title {
      margin-top: 35px;

      font-size: 22px;
      letter-spacing: 8px;
    }

    .status {
      margin-top: 15px;

      font-size: 13px;
      letter-spacing: 3px;

      opacity: 0.7;
    }

    .speech {
      margin-top: 20px;

      width: 80%;
      max-width: 600px;

      min-height: 25px;

      text-align: center;

      font-size: 15px;
      letter-spacing: 1px;

      opacity: 0.8;
    }

    .response {
      margin-top: 15px;

      min-height: 25px;

      font-size: 17px;
      letter-spacing: 2px;

      text-align: center;
    }


    /* =========================
       AUDIOWELLE
    ========================= */

    .wave {
      margin-top: 25px;

      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 4px;

      opacity: 0;

      transition: opacity 0.3s ease;
    }

    .wave.active {
      opacity: 1;
    }

    .bar {
      width: 4px;
      height: 10px;

      background: white;

      border-radius: 3px;

      animation: wave 0.8s ease-in-out infinite;
      animation-play-state: paused;
    }

    .wave.active .bar {
      animation-play-state: running;
    }

    .bar:nth-child(1) {
      animation-delay: 0s;
    }

    .bar:nth-child(2) {
      animation-delay: 0.1s;
    }

    .bar:nth-child(3) {
      animation-delay: 0.2s;
    }

    .bar:nth-child(4) {
      animation-delay: 0.3s;
    }

    .bar:nth-child(5) {
      animation-delay: 0.2s;
    }

    .bar:nth-child(6) {
      animation-delay: 0.1s;
    }

    .bar:nth-child(7) {
      animation-delay: 0s;
    }

    @keyframes wave {

      0%, 100% {
        height: 8px;
      }

      50% {
        height: 38px;
      }

    }

  </style>
</head>


<body>

  <div class="eye" id="eye">
    <div class="pupil"></div>
  </div>

  <div class="title">
    OBSERVER
  </div>

  <div class="status" id="status">
    BEOBACHTUNG AKTIV
  </div>

  <div class="wave" id="wave">

    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>

  </div>

  <div class="speech" id="speech">
    Mikrofon wird aktiviert...
  </div>

  <div class="response" id="response"></div>


  <script>

    /* =========================
       ELEMENTE
    ========================= */

    const eye = document.getElementById("eye");
    const speech = document.getElementById("speech");
    const response = document.getElementById("response");
    const status = document.getElementById("status");
    const wave = document.getElementById("wave");


    /* =========================
       BLINZELN
    ========================= */

    function blink() {

      eye.classList.add("blink");

      setTimeout(() => {

        eye.classList.remove("blink");

      }, 180);

    }

    // Alle 10 Sekunden blinzeln
    setInterval(blink, 10000);


    /* =========================
       SPRACHERKENNUNG
    ========================= */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let recognition = null;


    if (SpeechRecognition) {

      recognition = new SpeechRecognition();

      recognition.lang = "de-DE";

      // Möglichst dauerhaft zuhören
      recognition.continuous = true;

      // Zwischenergebnisse anzeigen
      recognition.interimResults = true;


      /* =========================
         MIKROFON STARTEN
      ========================= */

      function startListening() {

        try {

          recognition.start();

          status.textContent =
            "BEOBACHTUNG AKTIV";

        } catch (error) {

          // Browser versucht eventuell bereits zuzuhören
          console.log("Mikrofon läuft bereits.");

        }

      }


      /* =========================
         SPRACHE ERKANNT
      ========================= */

      recognition.onresult = (event) => {

        let finalText = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const result = event.results[i];

          const text =
            result[0].transcript;

          // Das Gesagte anzeigen
          speech.textContent =
            '"' + text + '"';

          if (result.isFinal) {

            finalText += text;

          }

        }


        if (!finalText) {
          return;
        }


        const command =
          finalText
            .toLowerCase()
            .trim();


        /* =========================
           BEFEHLE
        ========================= */

        if (
          command.includes("hallo")
        ) {

          respond(
            "ICH HABE EUCH BEREITS ERKANNT."
          );

        }

        else if (
          command.includes("observer")
        ) {

          respond(
            "ICH BIN DA."
          );

        }

        else if (
          command.includes("bist du da")
        ) {

          respond(
            "ICH BIN DA."
          );

        }

        else if (
          command.includes("wer bist du")
        ) {

          respond(
            "ICH BIN DER OBSERVER."
          );

        }

        else if (
          command.includes("öffne dich") ||
          command === "öffne"
        ) {

          respond(
            "ZUGRIFF VERWEIGERT."
          );

        }

        else if (
          command.includes("hilfe")
        ) {

          respond(
            "BEOBACHTE DEINE UMGEBUNG."
          );

        }

        /*
          WICHTIG:

          Wenn kein Befehl erkannt wird,
          passiert ABSOLUT NICHTS.

          Kein Fehler.
          Keine Antwort.
          Keine zusätzliche Meldung.
        */

      };


      /* =========================
         OBSERVER SPRICHT
      ========================= */

      function respond(text) {

        // Antwort anzeigen
        response.textContent = text;

        // Audiowelle einschalten
        wave.classList.add("active");

        // Status ändern
        status.textContent =
          "OBSERVER SPRICHT";


        // Browser-Sprachausgabe
        if ("speechSynthesis" in window) {

          window.speechSynthesis.cancel();

          const utterance =
            new SpeechSynthesisUtterance(text);

          utterance.lang = "de-DE";

          utterance.rate = 0.85;

          utterance.pitch = 0.8;

          utterance.volume = 1;


          utterance.onstart = () => {

            wave.classList.add("active");

          };


          utterance.onend = () => {

            wave.classList.remove("active");

            status.textContent =
              "BEOBACHTUNG AKTIV";

          };


          window.speechSynthesis.speak(
            utterance
          );

        }

        else {

          // Falls Sprachausgabe nicht verfügbar ist
          setTimeout(() => {

            wave.classList.remove("active");

            status.textContent =
              "BEOBACHTUNG AKTIV";

          }, 2500);

        }

      }


      /* =========================
         MIKROFON ENDET
      ========================= */

      recognition.onend = () => {

        /*
          Viele Browser beenden continuous
          recognition irgendwann.

          Deshalb starten wir sie automatisch
          erneut.
        */

        setTimeout(() => {

          startListening();

        }, 300);

      };


      /* =========================
         FEHLER
      ========================= */

      recognition.onerror = (event) => {

        console.log(
          "Spracherkennung:",
          event.error
        );

        /*
          Bei normalen temporären Fehlern
          versuchen wir es erneut.
        */

        if (
          event.error !== "not-allowed" &&
          event.error !== "service-not-allowed"
        ) {

          setTimeout(() => {

            startListening();

          }, 1000);

        }

      };


      /* =========================
         START
      ========================= */

      startListening();

    }

    else {

      status.textContent =
        "SPRACHERKENNUNG NICHT VERFÜGBAR";

      speech.textContent =
        "Bitte einen kompatiblen Browser verwenden.";

    }

  </script>

</body>
</html>
