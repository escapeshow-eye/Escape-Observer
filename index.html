<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>OBSERVER</title>


<style>

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;

  color: #fff;

  font-family: Arial, sans-serif;

  -webkit-user-select: none;
  user-select: none;
}


body {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;
}


/* =========================================
   AUGE
========================================= */

.eye {

  width: 180px;
  height: 110px;

  border: 4px solid white;

  border-radius: 50% / 60%;

  display: flex;

  align-items: center;
  justify-content: center;

  transition:
    height 0.12s ease;
}


.pupil {

  width: 55px;
  height: 55px;

  background: white;

  border-radius: 50%;

  transition:
    transform 0.12s ease;
}


.eye.blink {

  height: 7px;
}


.eye.blink .pupil {

  transform: scaleY(0);
}


/* =========================================
   SPRECHERTEXT
========================================= */

.response {

  width: 85%;

  max-width: 850px;

  margin-top: 35px;

  text-align: center;

  font-size: 17px;

  line-height: 1.5;

  letter-spacing: 1px;

  min-height: 30px;
}


/* =========================================
   AUDIOWELLE
========================================= */

.wave {

  height: 45px;

  margin-top: 15px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 4px;

  opacity: 0;

  transition: opacity 0.2s;
}


.wave.active {

  opacity: 1;
}


.bar {

  width: 4px;

  height: 8px;

  background: white;

  border-radius: 3px;

  animation:
    audioWave 0.8s ease-in-out infinite;

  animation-play-state: paused;
}


.wave.active .bar {

  animation-play-state: running;
}


.bar:nth-child(1) {
  animation-delay: 0s;
}

.bar:nth-child(2) {
  animation-delay: .1s;
}

.bar:nth-child(3) {
  animation-delay: .2s;
}

.bar:nth-child(4) {
  animation-delay: .3s;
}

.bar:nth-child(5) {
  animation-delay: .2s;
}

.bar:nth-child(6) {
  animation-delay: .1s;
}

.bar:nth-child(7) {
  animation-delay: 0s;
}


@keyframes audioWave {

  0%,
  100% {
    height: 8px;
  }

  50% {
    height: 38px;
  }

}


/* =========================================
   AKTIVIERUNG
========================================= */

#activate {

  margin-top: 25px;

  padding: 13px 24px;

  background: #000;

  color: white;

  border: 1px solid white;

  font-size: 13px;

  letter-spacing: 2px;

  cursor: pointer;

  touch-action: manipulation;
}


#activate.hidden {

  display: none;
}


/* =========================================
   VERDECKTE KAMERA
========================================= */

#cameraContainer {

  position: fixed;

  width: 180px;
  height: 135px;

  bottom: 10px;
  right: 10px;

  opacity: 0.01;

  pointer-events: none;
}


#camera {

  width: 100%;
  height: 100%;

  object-fit: cover;
}


#cameraCanvas {

  display: none;
}

</style>

</head>


<body>


<!-- =========================================
     AUGE
========================================= -->

<div
  class="eye"
  id="eye"
>

  <div
    class="pupil"
  ></div>

</div>


<!-- =========================================
     SPRECHERTEXT
========================================= -->

<div
  class="response"
  id="response"
></div>


<!-- =========================================
     AUDIOWELLE
========================================= -->

<div
  class="wave"
  id="wave"
>

  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>

</div>


<!-- =========================================
     EINMALIGE AKTIVIERUNG
========================================= -->

<button
  id="activate"
>
  OBSERVER AKTIVIEREN
</button>


<!-- =========================================
     KAMERA
========================================= -->

<div
  id="cameraContainer"
>

  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>

  <canvas
    id="cameraCanvas"
  ></canvas>

</div>


<!-- =========================================
     MAILBOX
=========================================

     Datei muss hier liegen:

     audio/
     Stromausfall Escape Room.m4a

========================================= -->

<audio
  id="mailboxAudio"
  preload="auto"
  playsinline
  src="audio/Stromausfall%20Escape%20Room.m4a"
></audio>


<script>


/* =========================================
   ELEMENTE
========================================= */

const eye =
  document.getElementById("eye");


const response =
  document.getElementById("response");


const wave =
  document.getElementById("wave");


const activateButton =
  document.getElementById("activate");


const mailboxAudio =
  document.getElementById("mailboxAudio");


const camera =
  document.getElementById("camera");


const canvas =
  document.getElementById("cameraCanvas");


const ctx =
  canvas.getContext("2d");


/* =========================================
   SYSTEMZUSTAND
========================================= */

let observerActivated = false;

let mailboxPlaying = false;

let emergencyRunning = false;

let waitingForEmergencyNumber = false;

let recognition = null;

let recognitionAvailable = false;

let recognitionRunning = false;

let cameraStream = null;

let cameraReady = false;

let cameraInterval = null;

let cameraCooldown = false;

let lastCameraState = "unknown";

let audioUnlocked = false;


/* =========================================
   BLINZELN
========================================= */

function blink() {

  eye.classList.add("blink");


  setTimeout(() => {

    eye.classList.remove("blink");

  }, 180);

}


/*
   Normales Blinzeln:

   alle 10 Sekunden.
*/

setInterval(() => {

  if (
    observerActivated &&
    !emergencyRunning &&
    !mailboxPlaying
  ) {

    blink();

  }

}, 10000);


/* =========================================
   MORSE-BLINZELN
========================================= */

function blinkMorse(symbol) {

  if (!observerActivated) {
    return;
  }


  eye.classList.add("blink");


  const duration =
    symbol === "."
      ? 180
      : 500;


  setTimeout(() => {

    eye.classList.remove("blink");

  }, duration);

}


/* =========================================
   OBSERVER SPRICHT
========================================= */

function observerSpeak(
  text,
  finished = null
) {

  if (!observerActivated) {
    return;
  }


  response.textContent =
    text;


  wave.classList.add(
    "active"
  );


  if (
    !("speechSynthesis" in window)
  ) {

    wave.classList.remove(
      "active"
    );

    if (finished) {
      finished();
    }

    return;
  }


  /*
     Vorherige Sprache beenden.
  */

  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "de-DE";


  utterance.rate =
    0.85;


  utterance.pitch =
    0.8;


  utterance.volume =
    1;


  utterance.onend =
    () => {

      wave.classList.remove(
        "active"
      );


      response.textContent =
        "";


      if (finished) {
        finished();
      }

    };


  utterance.onerror =
    () => {

      wave.classList.remove(
        "active"
      );


      if (finished) {
        finished();
      }

    };


  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================================
   AUDIO UNLOCK FÜR IPAD
========================================= */

/*
   Safari/iPad kann Audio blockieren,
   wenn die erste Wiedergabe nicht aus
   einer Benutzeraktion heraus passiert.

   Deshalb wird beim Klick auf
   "OBSERVER AKTIVIEREN" die Mailbox
   einmal stumm freigeschaltet.
*/

async function unlockMailboxAudio() {

  try {

    mailboxAudio.muted = true;

    mailboxAudio.currentTime = 0;

    await mailboxAudio.play();

    mailboxAudio.pause();

    mailboxAudio.currentTime = 0;

    mailboxAudio.muted = false;

    audioUnlocked = true;

  }

  catch (error) {

    console.log(
      "Audio-Unlock fehlgeschlagen:",
      error
    );

    mailboxAudio.muted = false;

    audioUnlocked = false;

  }

}


/* =========================================
   MAILBOX
========================================= */

async function playMailbox() {

  if (
    mailboxPlaying ||
    emergencyRunning
  ) {

    return;

  }


  mailboxPlaying =
    true;


  /*
     Mikrofon während der Mailbox
     stoppen.

     Dadurch kann der Observer seine
     eigene Mailbox nicht als Befehl
     verstehen.
  */

  stopRecognition();


  response.textContent =
    "Ich spiele die Mailbox ab.";


  wave.classList.add(
    "active"
  );


  /*
     Sprachausgabe stoppen.
  */

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }


  const intro =
    new SpeechSynthesisUtterance(
      "Ich spiele die Mailbox ab."
    );


  intro.lang =
    "de-DE";


  intro.rate =
    0.85;


  intro.pitch =
    0.8;


  intro.volume =
    1;


  /*
     Wenn die Ansage fertig ist,
     startet SOFORT die M4A.
  */

  intro.onend =
    async () => {

      response.textContent =
        "";


      wave.classList.remove(
        "active"
      );


      mailboxAudio.currentTime =
        0;


      mailboxAudio.muted =
        false;


      try {

        await mailboxAudio.play();

      }

      catch (error) {

        console.log(
          "Mailbox konnte nicht gestartet werden:",
          error
        );


        finishMailbox();

      }

    };


  intro.onerror =
    async () => {

      response.textContent =
        "";


      wave.classList.remove(
        "active"
      );


      try {

        mailboxAudio.currentTime =
          0;

        mailboxAudio.muted =
          false;

        await mailboxAudio.play();

      }

      catch (error) {

        finishMailbox();

      }

    };


  window.speechSynthesis.speak(
    intro
  );

}


/* =========================================
   MAILBOX ENDE
========================================= */

mailboxAudio.addEventListener(
  "ended",
  finishMailbox
);


function finishMailbox() {

  mailboxPlaying =
    false;


  wave.classList.remove(
    "active"
  );


  response.textContent =
    "";


  /*
     Mikrofon wieder aktivieren.
  */

  if (
    observerActivated &&
    !emergencyRunning
  ) {

    startRecognition();

  }

}


/* =========================================
   NOTFALLNUMMERN
========================================= */

function askForEmergencyNumber() {

  waitingForEmergencyNumber =
    true;


  observerSpeak(
    "Nennen Sie jetzt die Notfallnummer."
  );

}


/* =========================================
   NOTFALL START
========================================= */

function startEmergency() {

  if (
    emergencyRunning
  ) {

    return;

  }


  emergencyRunning =
    true;


  waitingForEmergencyNumber =
    false;


  /*
     AB HIER IST ALLES BLOCKIERT.

     Mikrofon aus.
     Kamera aus.
     Spracherkennung aus.
  */

  stopRecognition();

  stopCamera();


  /*
     Eventuelle alte Sprache stoppen.
  */

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }


  /*
     Exakt die gewünschte erste Ansage.
  */

  const firstText =
    "Notfall erkannt, Maßnahmen werden eingeleitet.";


  response.textContent =
    firstText;


  wave.classList.add(
    "active"
  );


  const firstSpeech =
    new SpeechSynthesisUtterance(
      firstText
    );


  firstSpeech.lang =
    "de-DE";


  firstSpeech.rate =
    0.82;


  firstSpeech.pitch =
    0.8;


  firstSpeech.volume =
    1;


  firstSpeech.onend =
    () => {

      wave.classList.remove(
        "active"
      );


      /*
         NICHT UNTERBRECHBARE PAUSE.

         Während dieser fünf Sekunden
         bleiben Mikrofon und Kamera aus.
      */

      setTimeout(() => {

        emergencySecondAnnouncement();

      }, 5000);

    };


  firstSpeech.onerror =
    () => {

      wave.classList.remove(
        "active"
      );


      setTimeout(() => {

        emergencySecondAnnouncement();

      }, 5000);

    };


  window.speechSynthesis.speak(
    firstSpeech
  );

}


/* =========================================
   NOTFALL ZWEITE ANSAGE
========================================= */

function emergencySecondAnnouncement() {

  const text =
    "Es befinden sich lediglich drei Personen in der Umgebung. Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel in einem Notfall-Ordner.";


  response.textContent =
    text;


  wave.classList.add(
    "active"
  );


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    "de-DE";


  speech.rate =
    0.82;


  speech.pitch =
    0.8;


  speech.volume =
    1;


  /*
     Erst wenn diese komplette
     Ansage beendet ist, wird alles
     wieder freigeschaltet.
  */

  speech.onend =
    finishEmergency;


  speech.onerror =
    finishEmergency;


  window.speechSynthesis.speak(
    speech
  );

}


/* =========================================
   NOTFALL ENDE
========================================= */

function finishEmergency() {

  wave.classList.remove(
    "active"
  );


  response.textContent =
    "";


  emergencyRunning =
    false;


  /*
     WICHTIG:

     Mikrofon und Kamera werden jetzt
     wieder aktiviert.
  */

  startRecognition();

  startCamera();

}


/* =========================================
   SPRACHERKENNUNG
========================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognitionAvailable =
    true;


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "de-DE";


  recognition.continuous =
    true;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    3;


  recognition.onresult =
    handleSpeech;


  recognition.onstart =
    () => {

      recognitionRunning =
        true;

    };


  recognition.onend =
    () => {

      recognitionRunning =
        false;


      /*
         Nur neu starten, wenn gerade
         keine Sperrphase läuft.
      */

      if (
        observerActivated &&
        !mailboxPlaying &&
        !emergencyRunning
      ) {

        setTimeout(
          startRecognition,
          500
        );

      }

    };


  recognition.onerror =
    event => {

      recognitionRunning =
        false;


      console.log(
        "Spracherkennung:",
        event.error
      );

    };

}


/* =========================================
   MIKROFON STARTEN
========================================= */

function startRecognition() {

  if (
    !recognitionAvailable ||
    !observerActivated ||
    mailboxPlaying ||
    emergencyRunning
  ) {

    return;

  }


  if (
    recognitionRunning
  ) {

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    console.log(
      "Mikrofon konnte nicht gestartet werden:",
      error
    );

  }

}


/* =========================================
   MIKROFON STOPPEN
========================================= */

function stopRecognition() {

  if (!recognition) {
    return;
  }


  try {

    recognition.stop();

  }

  catch (error) {}

}


/* =========================================
   SPRACHBEFEHLE
========================================= */

function handleSpeech(event) {

  /*
     ABSOLUTE SICHERHEIT:

     Wenn eine Sperrphase aktiv ist,
     wird der erkannte Text sofort
     verworfen.
  */

  if (
    mailboxPlaying ||
    emergencyRunning
  ) {

    return;

  }


  if (
    !event.results.length
  ) {

    return;

  }


  const result =
    event.results[
      event.results.length - 1
    ];


  if (
    !result.isFinal
  ) {

    return;

  }


  let command =
    result[0].transcript
      .toLowerCase()
      .trim();


  command =
    command.replace(
      /[.,!?;:]/g,
      ""
    );


  console.log(
    "Observer:",
    command
  );


  /* =====================================
     NOTFALLNUMMERN
  ===================================== */

  if (
    command.includes(
      "notfallnummern"
    )
  ) {

    askForEmergencyNumber();

    return;

  }


  /* =====================================
     NOTFALLNUMMER 03 / 3
  ===================================== */

  if (
    waitingForEmergencyNumber
  ) {

    const numberThree =
      command === "03" ||
      command === "3" ||
      command === "0 3" ||
      command === "null drei" ||
      command === "null drei" ||
      command === "drei" ||
      command.includes("03") ||
      command.includes("3");


    if (
      numberThree
    ) {

      startEmergency();

      return;

    }

  }


  /* =====================================
     MAILBOX
  ===================================== */

  if (
    command.includes(
      "spiele die mailbox ab"
    ) ||
    command.includes(
      "spiel die mailbox ab"
    ) ||
    command.includes(
      "spiele mailbox ab"
    ) ||
    command.includes(
      "spiel mailbox ab"
    ) ||
    command.includes(
      "mailbox abspielen"
    )
  ) {

    playMailbox();

    return;

  }


  /* =====================================
     HALLO
  ===================================== */

  if (
    command === "hallo"
  ) {

    observerSpeak(
      "Hallo."
    );

    return;

  }


  /* =====================================
     WAS
  ===================================== */

  if (
    command === "was"
  ) {

    observerSpeak(
      "Was?"
    );

    return;

  }


  /* =====================================
     WER BIST DU
  ===================================== */

  if (
    command.includes(
      "wer bist du"
    )
  ) {

    observerSpeak(
      "Observer Typ 0.4"
    );

    return;

  }


  /* =====================================
     WO SIND WIR
  ===================================== */

  if (
    command.includes(
      "wo sind wir"
    )
  ) {

    observerSpeak(
      "Ihr wurdet von zwei Männern hier reingebracht, sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, der eine hatte einen Zettel darin versteckt."
    );

    return;

  }


  /* =====================================
     HILFE
  ===================================== */

  if (
    command.includes(
      "hilfe"
    )
  ) {

    observerSpeak(
      "Ich bin nicht fürs Helfen da."
    );

    return;

  }


  /* =====================================
     WASCHMASCHINE
  ===================================== */

  if (
    command.includes(
      "waschmaschine"
    )
  ) {

    observerSpeak(
      "Ich bin nicht für eine Wäsche gemacht."
    );

    return;

  }


  /* =====================================
     WIE KOMMEN WIR RAUS
  ===================================== */

  if (
    command.includes(
      "wie kommen wir raus"
    ) ||
    command.includes(
      "wie kommen wir hier raus"
    ) ||
    command.includes(
      "wie kommen wir heraus"
    ) ||
    command.includes(
      "wie kommen wir hier heraus"
    ) ||
    command.includes(
      "wie kommen wir wieder raus"
    ) ||
    (
      command.includes("wie") &&
      command.includes("raus")
    )
  ) {

    observerSpeak(
      "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
    );

    return;

  }


  /*
     ALLES ANDERE:

     KEINE REAKTION.
  */

}


/* =========================================
   KAMERA STARTEN
========================================= */

async function startCamera() {

  if (
    cameraReady &&
    cameraStream
  ) {

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    console.log(
      "Kamera wird nicht unterstützt."
    );

    return;

  }


  try {

    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: "user"
          },

          audio: false

        });


    camera.srcObject =
      cameraStream;


    cameraReady =
      true;


    if (!cameraInterval) {

      cameraInterval =
        setInterval(
          detectCameraPattern,
          1000
        );

    }

  }

  catch (error) {

    console.log(
      "Kamera:",
      error
    );

  }

}


/* =========================================
   KAMERA STOPPEN
========================================= */

function stopCamera() {

  if (!cameraStream) {
    return;
  }


  cameraStream
    .getTracks()
    .forEach(
      track => track.stop()
    );


  camera.srcObject =
    null;


  cameraStream =
    null;


  cameraReady =
    false;

}


/* =========================================
   KAMERA-MUSTER
========================================= */

function detectCameraPattern() {

  if (
    !observerActivated ||
    !cameraReady ||
    cameraCooldown ||
    mailboxPlaying ||
    emergencyRunning
  ) {

    return;

  }


  if (
    camera.videoWidth === 0
  ) {

    return;

  }


  canvas.width = 80;

  canvas.height = 60;


  ctx.drawImage(
    camera,
    0,
    0,
    80,
    60
  );


  const image =
    ctx.getImageData(
      0,
      0,
      80,
      60
    );


  let brightness = 0;


  const pixels =
    image.data.length / 4;


  for (
    let i = 0;
    i < image.data.length;
    i += 4
  ) {

    brightness +=
      (
        image.data[i] +
        image.data[i + 1] +
        image.data[i + 2]
      ) / 3;

  }


  brightness /=
    pixels;


  let state;


  if (
    brightness > 220
  ) {

    state =
      "white";

  }

  else if (
    brightness < 35
  ) {

    state =
      "black";

  }

  else {

    state =
      "neutral";

  }


  if (
    state === lastCameraState
  ) {

    return;

  }


  lastCameraState =
    state;


  /*
     Aktuelles Testmuster:
     sehr helles Bild.
  */

  if (
    state === "white"
  ) {

    cameraCooldown =
      true;


    observerSpeak(
      "Muster erkannt."
    );


    setTimeout(() => {

      cameraCooldown =
        false;

    }, 5000);

  }

}


/* =========================================
   OBSERVER AKTIVIEREN
========================================= */

activateButton.addEventListener(
  "click",
  async () => {

    observerActivated =
      true;


    activateButton.classList.add(
      "hidden"
    );


    /*
       iPad Audio freischalten.

       Das passiert direkt durch den
       Benutzerklick.
    */

    await unlockMailboxAudio();


    /*
       Sprache starten.
    */

    startRecognition();


    /*
       Kamera starten.
    */

    await startCamera();

  }
);

</script>

</body>
</html>
