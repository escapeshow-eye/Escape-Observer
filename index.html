<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<title>Observer Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#eye {
    width: 170px;
    height: 100px;
    border: 4px solid white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#pupil {
    width: 50px;
    height: 50px;
    background: white;
    border-radius: 50%;
}

#text {
    margin-top: 35px;
    width: 85%;
    text-align: center;
    font-size: 18px;
    min-height: 30px;
}

#start {
    margin-top: 25px;
    padding: 14px 24px;
    background: black;
    color: white;
    border: 1px solid white;
    border-radius: 5px;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="eye">
    <div id="pupil"></div>
</div>

<div id="text"></div>

<button id="start">
    OBSERVER STARTEN
</button>

<script>

const text =
    document.getElementById("text");

const start =
    document.getElementById("start");

let recognition = null;

let listening = false;

let speaking = false;


/* =========================================
   SPRACHERKENNUNG
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "de-DE";

    recognition.continuous =
        true;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart = () => {

        listening = true;

        console.log(
            "Mikrofon hört zu"
        );

    };


    recognition.onresult = event => {

        if (speaking) {
            return;
        }

        const result =
            event.results[
                event.results.length - 1
            ];

        if (!result.isFinal) {
            return;
        }

        const heard =
            result[0]
                .transcript
                .toLowerCase()
                .trim();

        console.log(
            "Gehört:",
            heard
        );


        if (
            heard.includes("hallo")
        ) {

            sayHello();

        }

    };


    recognition.onerror = event => {

        console.log(
            "Speech error:",
            event.error
        );

    };


    recognition.onend = () => {

        listening = false;

        /*
           NICHT sofort neu starten.
           Erst nach kurzer Pause.
        */

        if (
            !speaking
        ) {

            setTimeout(
                startListening,
                1000
            );

        }

    };

}


/* =========================================
   SPRECHEN
========================================= */

function sayHello() {

    if (speaking) {
        return;
    }

    speaking = true;


    /*
       Mikrofon während der Antwort
       vollständig stoppen.
    */

    stopListening();


    text.textContent =
        "Hallo.";


    if (
        !window.speechSynthesis
    ) {

        finishSpeaking();

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            "Hallo."
        );


    utterance.lang =
        "de-DE";

    utterance.rate =
        0.85;

    utterance.pitch =
        0.8;

    utterance.volume =
        1;


    utterance.onend = () => {

        finishSpeaking();

    };


    utterance.onerror = () => {

        finishSpeaking();

    };


    /*
       Safari/iPad:
       Audio direkt nach Benutzeraktion
       vorbereiten.
    */

    window.speechSynthesis.resume();


    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================================
   SPRECHEN FERTIG
========================================= */

function finishSpeaking() {

    speaking = false;


    /*
       Text SOFORT entfernen.
    */

    text.textContent =
        "";


    /*
       Erst danach wieder zuhören.
    */

    setTimeout(
        startListening,
        500
    );

}


/* =========================================
   ZUHÖREN STARTEN
========================================= */

function startListening() {

    if (
        !recognition ||
        speaking ||
        listening
    ) {

        return;

    }


    try {

        recognition.start();

    }

    catch (error) {

        console.log(
            "Start error:",
            error
        );

    }

}


/* =========================================
   ZUHÖREN STOPPEN
========================================= */

function stopListening() {

    if (!recognition) {
        return;
    }


    try {

        recognition.stop();

    }

    catch (error) {}

}


/* =========================================
   STARTBUTTON
========================================= */

start.addEventListener(
    "click",
    () => {

        /*
           Das ist wichtig:
           speechSynthesis wird direkt
           durch den iPad-Tap aktiviert.
        */

        if (
            window.speechSynthesis
        ) {

            window.speechSynthesis.cancel();

            window.speechSynthesis.resume();

        }


        start.classList.add(
            "hidden"
        );

        start.style.display =
            "none";


        startListening();

    }
);

</script>

</body>
</html>
