<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSERVER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .eye {
      width: 180px;
      height: 110px;
      border: 4px solid white;
      border-radius: 50% / 60%;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: height 0.12s ease-in-out;
    }

    .pupil {
      width: 55px;
      height: 55px;
      background: white;
      border-radius: 50%;

      transition: transform 0.12s ease-in-out;
    }

    .eye.blink {
      height: 6px;
    }

    .eye.blink .pupil {
      transform: scaleY(0);
    }

    .title {
      margin-top: 35px;
      font-size: 22px;
      letter-spacing: 8px;
    }

    .status {
      margin-top: 15px;
      font-size: 13px;
      letter-spacing: 3px;
      opacity: 0.7;
    }

    .response {
      margin-top: 25px;
      width: 80%;
      max-width: 700px;
      min-height: 25px;

      font-size: 17px;
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.5;
    }

    .wave {
      margin-top: 25px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 4px;
      opacity: 0;

      transition: opacity 0.3s ease;
    }

    .wave.active {
      opacity: 1;
    }

    .bar {
      width: 4px;
      height: 8px;
      background: white;
      border-radius: 3px;

      animation: wave 0.8s ease-in-out infinite;
      animation-play-state: paused;
    }

    .wave.active .bar {
      animation-play-state: running;
    }

    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.2s; }
    .bar:nth-child(6) { animation-delay: 0.1s; }
    .bar:nth-child(7) { animation-delay: 0s; }

    @keyframes wave {
      0%, 100% {
        height: 8px;
      }

      50% {
        height: 38px;
      }
    }
  </style>
</head>

<body>

  <div class="eye" id="eye">
    <div class="pupil"></div>
  </div>

  <div class="title">
    OBSERVER
  </div>

  <div class="status" id="status">
    BEOBACHTUNG AKTIV
  </div>

  <div class="wave" id="wave">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <div class="response" id="response"></div>

  <!-- DEINE AUDIO-DATEI -->
  <audio
    id="mailboxAudio"
    src="audio/Stromausfall%20Escape%20Room.m4a"
    preload="auto">
  </audio>


  <script>

    const eye = document.getElementById("eye");
    const response = document.getElementById("response");
    const status = document.getElementById("status");
    const wave = document.getElementById("wave");
    const mailboxAudio = document.getElementById("mailboxAudio");


    /* =========================
       BLINZELN
    ========================= */

    function blink() {

      eye.classList.add("blink");

      setTimeout(() => {
        eye.classList.remove("blink");
      }, 180);

    }

    setInterval(blink, 10000);


    /* =========================
       SPRACHERKENNUNG
    ========================= */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;


    if (SpeechRecognition) {

      recognition = new SpeechRecognition();

      recognition.lang = "de-DE";
      recognition.continuous = true;
      recognition.interimResults = false;


      function startListening() {

        try {
          recognition.start();
        } catch (error) {
          // Läuft bereits.
        }

      }


      /* =========================
         SPRACHE ERKANNT
      ========================= */

      recognition.onresult = (event) => {

        const result =
          event.results[event.results.length - 1];

        if (!result.isFinal) {
          return;
        }

        let command =
          result[0].transcript
            .toLowerCase()
            .trim();

        command = command
          .replace(/[.,!?;:]/g, "")
          .trim();

        console.log("Erkannt:", command);


        /* =========================
           HALLO
        ========================= */

        if (command === "hallo") {

          respond(
            "Hallo.",
            "hallo"
          );

          return;
        }


        /* =========================
           WAS
        ========================= */

        if (command === "was") {

          respond(
            "Was?",
            "was"
          );

          return;
        }


        /* =========================
           WER BIST DU
        ========================= */

        if (command.includes("wer bist du")) {

          respond(
            "Observer Typ 0.4",
            "wer"
          );

          return;
        }


        /* =========================
           WO SIND WIR
        ========================= */

        if (command.includes("wo sind wir")) {

          respond(
            "Ihr wurdet von zwei Männern hier reingebracht, " +
            "sie trugen einen schwarzen Hoodie und eine " +
            "schwarze Winterjacke, der eine hatte einen Zettel " +
            "darin versteckt",
            "wo"
          );

          return;
        }


        /* =========================
           HILFE
        ========================= */

        if (command.includes("hilfe")) {

          respond(
            "Ich bin nicht fürs Helfen da",
            "hilfe"
          );

          return;
        }


        /* =========================
           WASCHMASCHINE
        ========================= */

        if (command.includes("waschmaschine")) {

          respond(
            "Ich bin nicht für eine Wäsche gemacht",
            "waschmaschine"
          );

          return;
        }


        /* =========================
           WIE KOMMEN WIR RAUS
        ========================= */

        if (
          command.includes("wie kommen wir raus") ||
          command.includes("wie kommen wir hier raus") ||
          command.includes("wie kommen wir heraus") ||
          command.includes("wie kommen wir hier heraus") ||
          command.includes("wie kommen wir wieder raus")
        ) {

          respond(
            "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert",
            "raus"
          );

          return;
        }


        /* =========================
           WASSER IN DIE FLASCHE
        ========================= */

        if (
          command.includes("wasser") &&
          command.includes("flasche") &&
          (
            command.includes("füllen") ||
            command.includes("fuellen")
          )
        ) {

          respond(
            "Vorsichtsmaßnahme erkannt, stellt sicher das ich kein Wasser abbekomme und sonst zurück zu euer Frage, Ja!",
            "wasser"
          );

          return;
        }


        /* =========================
           MAILBOX ABSPIELEN
        ========================= */

        if (
          command.includes("spiele die mailbox ab") ||
          command.includes("spiele mailbox ab") ||
          command.includes("spiel die mailbox ab") ||
          command.includes("spiel mailbox ab") ||
          command.includes("mailbox abspielen")
        ) {

          playMailbox();

          return;
        }


        /*
          Alles andere wird ignoriert.
        */

      };


      /* =========================
         OBSERVER ANTWORT
      ========================= */

      function respond(text, type) {

        if (
          window.lastCommand === type &&
          window.speechSynthesis &&
          window.speechSynthesis.speaking
        ) {

          return;
        }

        window.lastCommand = type;

        response.textContent = text;

        status.textContent =
          "OBSERVER SPRICHT";

        wave.classList.add("active");


        if ("speechSynthesis" in window) {

          window.speechSynthesis.cancel();

          const utterance =
            new SpeechSynthesisUtterance(text);

          utterance.lang = "de-DE";
          utterance.rate = 0.85;
          utterance.pitch = 0.8;
          utterance.volume = 1;


          utterance.onend = () => {

            wave.classList.remove("active");

            response.textContent = "";

            status.textContent =
              "BEOBACHTUNG AKTIV";

          };


          window.speechSynthesis.speak(
            utterance
          );

        }

      }


      /* =========================
         MAILBOX
      ========================= */

      function playMailbox() {

        // Text anzeigen
        response.textContent =
          "Ich spiele die Mailbox ab.";

        status.textContent =
          "MAILBOX WIRD ABGESPIELT";

        wave.classList.add("active");


        /*
          Falls gerade eine andere OBSERVER-Stimme
          läuft, wird sie beendet.
        */

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }


        const intro =
          new SpeechSynthesisUtterance(
            "Ich spiele die Mailbox ab."
          );

        intro.lang = "de-DE";
        intro.rate = 0.85;
        intro.pitch = 0.8;
        intro.volume = 1;


        intro.onend = () => {

          wave.classList.remove("active");

          response.textContent = "";

          status.textContent =
            "MAILBOX";


          /*
            Audio starten
          */

          mailboxAudio.currentTime = 0;

          mailboxAudio.play()
            .then(() => {

              console.log(
                "Mailbox wird abgespielt."
              );

            })
            .catch((error) => {

              console.error(
                "Audio konnte nicht gestartet werden:",
                error
              );

              response.textContent =
                "AUDIO NICHT VERFÜGBAR";

              status.textContent =
                "FEHLER";

            });

        };


        window.speechSynthesis.speak(intro);


        /*
          Wenn die Mailbox fertig ist
        */

        mailboxAudio.onended = () => {

          response.textContent = "";

          status.textContent =
            "BEOBACHTUNG AKTIV";

        };

      }


      /* =========================
         ERKENNUNG ENDET
      ========================= */

      recognition.onend = () => {

        setTimeout(() => {

          startListening();

        }, 500);

      };


      /* =========================
         FEHLER
      ========================= */

      recognition.onerror = (event) => {

        console.log(
          "Spracherkennung:",
          event.error
        );

        if (
          event.error !== "not-allowed" &&
          event.error !== "service-not-allowed"
        ) {

          setTimeout(() => {

            startListening();

          }, 1000);

        }

      };


      /* =========================
         START
      ========================= */

      startListening();

    }

    else {

      status.textContent =
        "SPRACHERKENNUNG NICHT VERFÜGBAR";

    }

  </script>

</body>
</html>
