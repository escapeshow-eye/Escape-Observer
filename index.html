<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black">

<title>OBSERVER</title>


<style>

* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
}

html,
body {

  margin: 0;
  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
  color: #fff;

  font-family: Arial, sans-serif;
}


body {

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

}


/* =========================
   AUGE
========================= */

#eye {

  width: 170px;
  height: 100px;

  border: 4px solid white;

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  transition:
    height 0.16s ease;

}


#pupil {

  width: 50px;
  height: 50px;

  background: white;

  border-radius: 50%;

  transition:
    transform 0.16s ease;

}


#eye.blink {

  height: 7px;

}


#eye.blink #pupil {

  transform:
    scaleY(0);

}


/* =========================
   SPRECHTEXT
========================= */

#response {

  width: 85%;

  margin-top: 35px;

  min-height: 30px;

  text-align: center;

  font-size: 18px;

  line-height: 1.5;

}


/* =========================
   AUDIOWELLE
========================= */

#wave {

  height: 45px;

  margin-top: 15px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 4px;

  opacity: 0;

}


#wave.active {

  opacity: 1;

}


.bar {

  width: 4px;
  height: 8px;

  background: white;

  border-radius: 4px;

  animation:
    wave 0.8s ease-in-out infinite;

}


.bar:nth-child(1) {
  animation-delay: 0s;
}

.bar:nth-child(2) {
  animation-delay: 0.1s;
}

.bar:nth-child(3) {
  animation-delay: 0.2s;
}

.bar:nth-child(4) {
  animation-delay: 0.3s;
}

.bar:nth-child(5) {
  animation-delay: 0.2s;
}

.bar:nth-child(6) {
  animation-delay: 0.1s;
}

.bar:nth-child(7) {
  animation-delay: 0s;
}


@keyframes wave {

  0%,
  100% {

    height: 8px;

  }

  50% {

    height: 38px;

  }

}


/* =========================
   START
========================= */

#start {

  margin-top: 25px;

  padding: 15px 25px;

  background: #000;

  color: white;

  border: 1px solid white;

  border-radius: 5px;

  font-size: 14px;

  letter-spacing: 2px;

}


#start.hidden {

  display: none;

}


/* =========================
   KAMERA
========================= */

#camera {

  position: fixed;

  width: 1px;
  height: 1px;

  right: 0;
  bottom: 0;

  opacity: 0.01;

}

</style>

</head>


<body>


<!-- =========================
     AUGE
========================= -->

<div id="eye">

  <div id="pupil"></div>

</div>


<!-- =========================
     SPRECHTEXT
========================= -->

<div id="response"></div>


<!-- =========================
     AUDIOWELLE
========================= -->

<div id="wave">

  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>

</div>


<!-- =========================
     START
========================= -->

<button id="start">

  OBSERVER STARTEN

</button>


<!-- =========================
     KAMERA
========================= -->

<video
  id="camera"
  autoplay
  playsinline
  muted
></video>


<script>


/* ==================================================
   ELEMENTE
================================================== */

const eye =
  document.getElementById("eye");

const response =
  document.getElementById("response");

const wave =
  document.getElementById("wave");

const startButton =
  document.getElementById("start");

const camera =
  document.getElementById("camera");


/* ==================================================
   SYSTEM
================================================== */

let observerActive =
  false;

let observerSpeaking =
  false;

let emergencyRunning =
  false;

let waitingForNumber =
  false;

let recognition =
  null;

let recognitionRunning =
  false;

let restartTimer =
  null;

let cameraStream =
  null;

let lastCommand =
  "";

let lastCommandTime =
  0;


/* ==================================================
   SPRACHSTIMME
================================================== */

let germanVoice =
  null;


function loadGermanVoice() {

  if (
    !window.speechSynthesis
  ) {

    return;

  }


  const voices =
    window.speechSynthesis
      .getVoices();


  if (
    !voices.length
  ) {

    return;

  }


  germanVoice =
    voices.find(
      voice =>
        voice.lang === "de-DE"
    )
    ||
    voices.find(
      voice =>
        voice.lang &&
        voice.lang
          .toLowerCase()
          .startsWith("de")
    )
    ||
    voices[0];

}


loadGermanVoice();


if (
  window.speechSynthesis
) {

  window.speechSynthesis
    .onvoiceschanged =
      loadGermanVoice;

}


/* ==================================================
   AUGE
================================================== */

function blink() {

  if (
    !observerActive ||
    emergencyRunning
  ) {

    return;

  }


  eye.classList.add(
    "blink"
  );


  setTimeout(() => {

    eye.classList.remove(
      "blink"
    );

  }, 180);

}


setInterval(() => {

  if (
    observerActive &&
    !observerSpeaking &&
    !emergencyRunning
  ) {

    blink();

  }

}, 10000);


/* ==================================================
   DIE FUNKTIONIERENDE TTS-METHODE
================================================== */

function observerSpeak(
  text,
  callback = null
) {

  if (
    !observerActive ||
    observerSpeaking
  ) {

    return;

  }


  observerSpeaking =
    true;


  response.textContent =
    text;


  wave.classList.add(
    "active"
  );


  /*
     Genau wie beim funktionierenden
     TTS-Test:

     speechSynthesis.resume()
     und danach direkt speak().

     KEIN cancel().
  */

  if (
    !window.speechSynthesis
  ) {

    finishSpeaking(
      callback
    );

    return;

  }


  window.speechSynthesis.resume();


  loadGermanVoice();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "de-DE";


  utterance.rate =
    0.9;


  utterance.pitch =
    0.85;


  utterance.volume =
    1;


  if (
    germanVoice
  ) {

    utterance.voice =
      germanVoice;

  }


  /*
     Text verschwindet, wenn die Stimme
     tatsächlich fertig ist.

     Zusätzlich gibt es einen großzügigen
     Fallback, damit Safari niemals
     minutenlang Text stehen lässt.
  */

  let finished =
    false;


  const fallback =
    setTimeout(() => {

      finish();

    }, 12000);


  function finish() {

    if (
      finished
    ) {

      return;

    }


    finished =
      true;


    clearTimeout(
      fallback
    );


    finishSpeaking(
      callback
    );

  }


  utterance.onend =
    finish;


  utterance.onerror =
    finish;


  /*
     Noch einmal exakt die
     funktionierende Reihenfolge.
  */

  window.speechSynthesis.resume();


  window.speechSynthesis.speak(
    utterance
  );

}


/* ==================================================
   SPRACHE FERTIG
================================================== */

function finishSpeaking(
  callback
) {

  observerSpeaking =
    false;


  response.textContent =
    "";


  wave.classList.remove(
    "active"
  );


  if (
    callback
  ) {

    callback();

  }

}


/* ==================================================
   SPEECH RECOGNITION
================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (
  SpeechRecognition
) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "de-DE";


  recognition.continuous =
    true;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    3;


  recognition.onstart =
    () => {

      recognitionRunning =
        true;

    };


  recognition.onresult =
    event => {

      /*
         Während der Observer spricht:

         ALLES IGNORIEREN.

         Dadurch kann niemand
         hineinreden.
      */

      if (
        observerSpeaking ||
        emergencyRunning
      ) {

        return;

      }


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const result =
          event.results[i];


        if (
          !result.isFinal
        ) {

          continue;

        }


        /*
           Mehrere Alternativen testen.
        */

        for (
          let j = 0;
          j < result.length;
          j++
        ) {

          const command =
            normalize(
              result[j].transcript
            );


          if (
            handleCommand(
              command
            )
          ) {

            return;

          }

        }

      }

    };


  recognition.onerror =
    event => {

      recognitionRunning =
        false;


      console.log(
        "Recognition:",
        event.error
      );


      restartRecognition();

    };


  recognition.onend =
    () => {

      recognitionRunning =
        false;


      if (
        observerActive &&
        !observerSpeaking &&
        !emergencyRunning
      ) {

        restartRecognition();

      }

    };

}


/* ==================================================
   MIKROFON
================================================== */

function startRecognition() {

  if (
    !recognition ||
    !observerActive ||
    observerSpeaking ||
    emergencyRunning ||
    recognitionRunning
  ) {

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    restartRecognition();

  }

}


function restartRecognition() {

  if (
    restartTimer ||
    !observerActive ||
    observerSpeaking ||
    emergencyRunning
  ) {

    return;

  }


  restartTimer =
    setTimeout(() => {

      restartTimer =
        null;


      startRecognition();

    }, 1000);

}


/* ==================================================
   WATCHDOG
================================================== */

setInterval(() => {

  if (
    observerActive &&
    !observerSpeaking &&
    !emergencyRunning &&
    !recognitionRunning
  ) {

    restartRecognition();

  }

}, 5000);


/* ==================================================
   TEXT
================================================== */

function normalize(
  text
) {

  return text
    .toLowerCase()
    .trim()
    .replace(
      /[.,!?;:]/g,
      ""
    )
    .replace(
      /\s+/g,
      " "
    );

}


/* ==================================================
   DOPPELTE BEFEHLE
================================================== */

function duplicate(
  command
) {

  const now =
    Date.now();


  if (
    command === lastCommand &&
    now - lastCommandTime < 3000
  ) {

    return true;

  }


  lastCommand =
    command;


  lastCommandTime =
    now;


  return false;

}


/* ==================================================
   BEFEHLE
================================================== */

function handleCommand(
  command
) {

  if (
    !command
  ) {

    return false;

  }


  if (
    duplicate(command)
  ) {

    return true;

  }


  /* ==========================
     NOTFALLNUMMERN
  ========================== */

  if (
    command.includes(
      "notfallnummern"
    )
  ) {

    waitingForNumber =
      true;


    observerSpeak(
      "Nennen Sie jetzt die Notfallnummer."
    );


    return true;

  }


  /* ==========================
     03 / 3
  ========================== */

  if (
    waitingForNumber
  ) {

    if (
      command === "3" ||
      command === "03" ||
      command === "0 3" ||
      command === "drei" ||
      command === "null drei" ||
      command.includes(
        "nummer drei"
      )
    ) {

      startEmergency();


      return true;

    }

  }


  /* ==========================
     HALLO
  ========================== */

  if (
    command === "hallo" ||
    command.startsWith(
      "hallo "
    )
  ) {

    observerSpeak(
      "Hallo."
    );


    return true;

  }


  /* ==========================
     WAS
  ========================== */

  if (
    command === "was"
  ) {

    observerSpeak(
      "Was?"
    );


    return true;

  }


  /* ==========================
     WER BIST DU
  ========================== */

  if (
    command.includes(
      "wer bist du"
    )
    ||
    (
      command.includes("wer") &&
      command.includes("bist") &&
      command.includes("du")
    )
  ) {

    observerSpeak(
      "Observer Typ 0.4"
    );


    return true;

  }


  /* ==========================
     WO SIND WIR
  ========================== */

  if (
    command.includes(
      "wo sind wir"
    )
    ||
    (
      command.includes("wo") &&
      command.includes("sind") &&
      command.includes("wir")
    )
  ) {

    observerSpeak(
      "Ihr wurdet von zwei Männern hier reingebracht, sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, der eine hatte einen Zettel darin versteckt."
    );


    return true;

  }


  /* ==========================
     HILFE
  ========================== */

  if (
    command.includes(
      "hilfe"
    )
  ) {

    observerSpeak(
      "Ich bin nicht fürs Helfen da."
    );


    return true;

  }


  /* ==========================
     WASCHMASCHINE
  ========================== */

  if (
    command.includes(
      "waschmaschine"
    )
  ) {

    observerSpeak(
      "Ich bin nicht für eine Wäsche gemacht."
    );


    return true;

  }


  /* ==========================
     WIE KOMMEN WIR RAUS
  ========================== */

  const hasHow =
    command.includes(
      "wie"
    );


  const hasCome =
    command.includes(
      "kommen"
    );


  const hasOut =
    command.includes(
      "raus"
    )
    ||
    command.includes(
      "heraus"
    );


  if (
    (
      hasHow &&
      hasCome &&
      hasOut
    )
    ||
    command.includes(
      "wie kommen wir hier raus"
    )
  ) {

    observerSpeak(
      "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
    );


    return true;

  }


  /*
     ALLES ANDERE:

     Ignorieren.
  */

  return false;

}


/* ==================================================
   NOTFALL
================================================== */

function startEmergency() {

  if (
    emergencyRunning
  ) {

    return;

  }


  emergencyRunning =
    true;


  waitingForNumber =
    false;


  observerSpeak(
    "Notfall erkannt, Maßnahmen werden eingeleitet.",
    () => {

      /*
         5 Sekunden komplett gesperrt.
      */

      setTimeout(() => {

        emergencySecondPart();

      }, 5000);

    }
  );

}


function emergencySecondPart() {

  observerSpeak(
    "Es befinden sich lediglich drei Personen in der Umgebung. Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel in einem Notfall-Ordner.",
    () => {

      emergencyRunning =
        false;


      waitingForNumber =
        false;

    }
  );

}


/* ==================================================
   KAMERA
================================================== */

async function startCamera() {

  if (
    cameraStream
  ) {

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    return;

  }


  try {

    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: "environment"
          },

          audio: false

        });


    camera.srcObject =
      cameraStream;

  }

  catch (error) {

    console.log(
      "Kamera:",
      error
    );

  }

}


/* ==================================================
   START
================================================== */

startButton.addEventListener(
  "click",
  async () => {

    if (
      observerActive
    ) {

      return;

    }


    observerActive =
      true;


    startButton.classList.add(
      "hidden"
    );


    /*
       EXAKT DIE FUNKTIONIERENDE
       TTS-INITIALISIERUNG.
    */

    loadGermanVoice();


    if (
      window.speechSynthesis
    ) {

      window.speechSynthesis.resume();

    }


    /*
       Kamera.
    */

    await startCamera();


    /*
       Recognition.
    */

    setTimeout(() => {

      startRecognition();

    }, 300);

  }
);

</script>

</body>
</html>
