<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSERVER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .eye {
      width: 180px;
      height: 110px;
      border: 4px solid white;
      border-radius: 50% / 60%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }

    .pupil {
      width: 55px;
      height: 55px;
      background: white;
      border-radius: 50%;
    }

    .title {
      margin-top: 35px;
      font-size: 22px;
      letter-spacing: 8px;
    }

    .status {
      margin-top: 15px;
      font-size: 13px;
      letter-spacing: 3px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="eye">
    <div class="pupil"></div>
  </div>

  <div class="title">OBSERVER</div>
  <div class="status">BEOBACHTUNG AKTIV</div>

</body>
</html>
