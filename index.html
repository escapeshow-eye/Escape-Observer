<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSERVER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       AUGE
    ========================= */

    .eye {
      width: 180px;
      height: 110px;

      border: 4px solid white;
      border-radius: 50% / 60%;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: height 0.12s ease-in-out;
    }

    .pupil {
      width: 55px;
      height: 55px;

      background: white;
      border-radius: 50%;

      transition: transform 0.12s ease-in-out;
    }

    .eye.blink {
      height: 6px;
    }

    .eye.blink .pupil {
      transform: scaleY(0);
    }


    /* =========================
       TITEL
    ========================= */

    .title {
      margin-top: 35px;

      font-size: 22px;
      letter-spacing: 8px;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      margin-top: 15px;

      font-size: 13px;
      letter-spacing: 3px;

      opacity: 0.7;
    }


    /* =========================
       ANTWORT
    ========================= */

    .response {
      margin-top: 25px;

      width: 80%;
      max-width: 700px;

      min-height: 25px;

      font-size: 17px;
      letter-spacing: 2px;

      text-align: center;
      line-height: 1.5;
    }


    /* =========================
       AUDIOWELLE
    ========================= */

    .wave {
      margin-top: 25px;

      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 4px;

      opacity: 0;

      transition: opacity 0.3s ease;
    }

    .wave.active {
      opacity: 1;
    }

    .bar {
      width: 4px;
      height: 8px;

      background: white;

      border-radius: 3px;

      animation: wave 0.8s ease-in-out infinite;

      animation-play-state: paused;
    }

    .wave.active .bar {
      animation-play-state: running;
    }

    .bar:nth-child(1) {
      animation-delay: 0s;
    }

    .bar:nth-child(2) {
      animation-delay: 0.1s;
    }

    .bar:nth-child(3) {
      animation-delay: 0.2s;
    }

    .bar:nth-child(4) {
      animation-delay: 0.3s;
    }

    .bar:nth-child(5) {
      animation-delay: 0.2s;
    }

    .bar:nth-child(6) {
      animation-delay: 0.1s;
    }

    .bar:nth-child(7) {
      animation-delay: 0s;
    }

    @keyframes wave {

      0%, 100% {
        height: 8px;
      }

      50% {
        height: 38px;
      }

    }

  </style>
</head>


<body>

  <!-- AUGE -->

  <div class="eye" id="eye">
    <div class="pupil"></div>
  </div>


  <!-- TITEL -->

  <div class="title">
    OBSERVER
  </div>


  <!-- STATUS -->

  <div class="status" id="status">
    BEOBACHTUNG AKTIV
  </div>


  <!-- AUDIOWELLE -->

  <div class="wave" id="wave">

    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>

  </div>


  <!-- ANTWORT -->

  <div class="response" id="response"></div>


  <script>

    /* =========================
       ELEMENTE
    ========================= */

    const eye = document.getElementById("eye");
    const response = document.getElementById("response");
    const status = document.getElementById("status");
    const wave = document.getElementById("wave");


    /* =========================
       BLINZELN
    ========================= */

    function blink() {

      eye.classList.add("blink");

      setTimeout(() => {

        eye.classList.remove("blink");

      }, 180);

    }


    // Alle 10 Sekunden

    setInterval(blink, 10000);


    /* =========================
       SPRACHERKENNUNG
    ========================= */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let recognition = null;


    if (SpeechRecognition) {

      recognition = new SpeechRecognition();

      recognition.lang = "de-DE";

      recognition.continuous = true;

      recognition.interimResults = false;


      /* =========================
         MIKROFON STARTEN
      ========================= */

      function startListening() {

        try {

          recognition.start();

        } catch (error) {

          // Läuft bereits.

        }

      }


      /* =========================
         SPRACHE ERKANNT
      ========================= */

      recognition.onresult = (event) => {

        const result =
          event.results[event.results.length - 1];


        if (!result.isFinal) {
          return;
        }


        let command =
          result[0].transcript
            .toLowerCase()
            .trim();


        /*
          Satzzeichen entfernen
        */

        command = command
          .replace(/[.,!?;:]/g, "")
          .trim();


        /* =========================
           BEFEHLE
        ========================= */


        /*
          HALLO
        */

        if (command === "hallo") {

          respond(
            "Hallo."
          );

        }


        /*
          WAS
        */

        else if (command === "was") {

          respond(
            "Was?"
          );

        }


        /*
          WER BIST DU
        */

        else if (
          command === "wer bist du"
        ) {

          respond(
            "Observer Typ 0.4"
          );

        }


        /*
          OBSERVER TYP 0.4
        */

        else if (
          command === "observer typ 0.4" ||
          command === "observer typ null 0.4"
        ) {

          respond(
            "Wo sind wir"
          );

        }


        /*
          WO SIND WIR
        */

        else if (
          command === "wo sind wir"
        ) {

          respond(
            "Ihr wurdet von zwei Männern hier reingebracht, " +
            "sie trugen einen schwarzen Hoodie und eine " +
            "schwarze Winterjacke, der eine hatte einen Zettel " +
            "darin versteckt"
          );

        }


        /*
          HILFE
        */

        else if (
          command === "hilfe"
        ) {

          respond(
            "Ich bin nicht fürs Helfen da"
          );

        }


        /*
          WASCHMASCHINE
        */

        else if (
          command === "waschmaschine"
        ) {

          respond(
            "Ich bin nicht für eine Wäsche gemacht"
          );

        }


        /*
          WIE KOMMEN WIR RAUS
        */

        else if (
          command === "wie kommen wir raus"
        ) {

          respond(
            "Probiert es mal mit der Tür, sonst sind alle weg im Betriebssystem blockiert"
          );

        }


        /*
          WASSER IN DIE FLASCHE
        */

        else if (
          command ===
          "sollen wir das wasser in die flasche füllen"
        ) {

          respond(
            "Vorsichtsmaßnahme erkannt, stellt sicher das ich kein Wasser abbekomme und sonst zurück zu euer Frage, Ja!"
          );

        }


        /*
          ALLES ANDERE:

          KEINE REAKTION.
        */

      };


      /* =========================
         OBSERVER SPRICHT
      ========================= */

      function respond(text) {

        response.textContent = text;

        status.textContent =
          "OBSERVER SPRICHT";

        wave.classList.add("active");


        if ("speechSynthesis" in window) {

          window.speechSynthesis.cancel();


          const utterance =
            new SpeechSynthesisUtterance(text);


          utterance.lang = "de-DE";

          utterance.rate = 0.85;

          utterance.pitch = 0.8;

          utterance.volume = 1;


          utterance.onend = () => {

            wave.classList.remove("active");

            response.textContent = "";

            status.textContent =
              "BEOBACHTUNG AKTIV";

          };


          window.speechSynthesis.speak(
            utterance
          );

        }

        else {

          setTimeout(() => {

            wave.classList.remove("active");

            response.textContent = "";

            status.textContent =
              "BEOBACHTUNG AKTIV";

          }, 2500);

        }

      }


      /* =========================
         SPRACHERKENNUNG ENDET
      ========================= */

      recognition.onend = () => {

        setTimeout(() => {

          startListening();

        }, 300);

      };


      /* =========================
         FEHLER
      ========================= */

      recognition.onerror = (event) => {

        console.log(
          "Spracherkennung:",
          event.error
        );


        if (
          event.error !== "not-allowed" &&
          event.error !== "service-not-allowed"
        ) {

          setTimeout(() => {

            startListening();

          }, 1000);

        }

      };


      /* =========================
         AUTOMATISCHER START
      ========================= */

      startListening();

    }


    else {

      status.textContent =
        "SPRACHERKENNUNG NICHT VERFÜGBAR";

    }

  </script>

</body>
</html>
