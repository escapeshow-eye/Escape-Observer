<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSERVER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .eye {
      width: 180px;
      height: 110px;
      border: 4px solid white;
      border-radius: 50% / 60%;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        height 0.15s ease,
        transform 0.3s ease;
    }

    .pupil {
      width: 55px;
      height: 55px;
      background: white;
      border-radius: 50%;

      transition: transform 0.15s ease;
    }

    /* BLINZELN */
    .eye.blink {
      height: 6px;
    }

    .eye.blink .pupil {
      transform: scaleY(0);
    }

    .title {
      margin-top: 35px;
      font-size: 22px;
      letter-spacing: 8px;
    }

    .status {
      margin-top: 15px;
      font-size: 13px;
      letter-spacing: 3px;
      opacity: 0.7;
    }

    /* MIKROFON */
    .mic-button {
      margin-top: 30px;

      width: 65px;
      height: 65px;

      border: 2px solid white;
      border-radius: 50%;

      background: black;
      color: white;

      font-size: 28px;

      cursor: pointer;

      transition: 0.2s;
    }

    .mic-button:hover {
      transform: scale(1.08);
    }

    .mic-button.listening {
      box-shadow: 0 0 25px white;
    }

    .speech {
      margin-top: 20px;

      width: 80%;
      max-width: 500px;

      min-height: 25px;

      text-align: center;

      font-size: 15px;
      letter-spacing: 1px;

      opacity: 0.8;
    }

    .response {
      margin-top: 15px;

      min-height: 25px;

      font-size: 16px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="eye" id="eye">
    <div class="pupil"></div>
  </div>

  <div class="title">
    OBSERVER
  </div>

  <div class="status" id="status">
    BEOBACHTUNG AKTIV
  </div>

  <button class="mic-button" id="micButton">
    🎙️
  </button>

  <div class="speech" id="speech">
    Mikrofon bereit
  </div>

  <div class="response" id="response"></div>


  <script>

    /* =========================
       AUGE BLINZELN
    ========================= */

    const eye = document.getElementById("eye");

    function blink() {

      eye.classList.add("blink");

      setTimeout(() => {
        eye.classList.remove("blink");
      }, 180);

    }

    // Alle 20 Sekunden blinzeln
    setInterval(blink, 20000);


    /* =========================
       SPRACHERKENNUNG
    ========================= */

    const micButton = document.getElementById("micButton");
    const speech = document.getElementById("speech");
    const response = document.getElementById("response");
    const status = document.getElementById("status");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition;

    if (SpeechRecognition) {

      recognition = new SpeechRecognition();

      recognition.lang = "de-DE";

      recognition.continuous = false;

      recognition.interimResults = false;


      /* Wenn Mikrofon gestartet wird */

      micButton.addEventListener("click", () => {

        try {

          recognition.start();

          micButton.classList.add("listening");

          status.textContent = "ICH HÖRE ZU...";
          speech.textContent = "Sprich jetzt...";

        } catch (error) {

          console.log(error);

        }

      });


      /* Wenn Sprache erkannt wurde */

      recognition.onresult = (event) => {

        const text =
          event.results[0][0].transcript
            .toLowerCase()
            .trim();

        speech.textContent = '"' + text + '"';

        micButton.classList.remove("listening");

        status.textContent = "BEOBACHTUNG AKTIV";


        /* =========================
           OBSERVER SÄTZE
        ========================= */

        if (
          text.includes("observer") ||
          text.includes("bist du da")
        ) {

          response.textContent =
            "ICH BIN DA.";

          blink();

        }

        else if (
          text.includes("wer bist du")
        ) {

          response.textContent =
            "ICH BIN DER OBSERVER.";

        }

        else if (
          text.includes("öffne dich") ||
          text.includes("öffne")
        ) {

          response.textContent =
            "ZUGRIFF VERWEIGERT.";

        }

        else if (
          text.includes("hilfe")
        ) {

          response.textContent =
            "BEOBACHTE DEINE UMGEBUNG.";

        }

        else if (
          text.includes("hallo")
        ) {

          response.textContent =
            "ICH HABE EUCH BEREITS ERKANNT.";

        }

        else {

          response.textContent =
            "BEFEHL NICHT ERKANNT.";

        }

      };


      /* Wenn die Aufnahme endet */

      recognition.onend = () => {

        micButton.classList.remove("listening");

        status.textContent =
          "BEOBACHTUNG AKTIV";

      };


      /* Fehler */

      recognition.onerror = (event) => {

        micButton.classList.remove("listening");

        status.textContent =
          "MIKROFONFEHLER";

        response.textContent =
          "SPRACHE NICHT ERKANNT.";

        console.log(event.error);

      };

    }

    else {

      micButton.disabled = true;

      status.textContent =
        "SPRACHERKENNUNG NICHT VERFÜGBAR";

      speech.textContent =
        "Bitte einen kompatiblen Browser verwenden.";

    }

  </script>

</body>
</html>
