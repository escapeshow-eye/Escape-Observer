<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no,
           viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black"
>

<title>OBSERVER</title>


<style>

/* =========================================
   GRUNDLAYOUT
========================================= */

* {
    box-sizing: border-box;

    -webkit-user-select: none;
    user-select: none;

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {

    display: flex;

    flex-direction: column;

    align-items: center;

    overflow: hidden;

}


/* =========================================
   OBSERVER AUGE
========================================= */

#observerArea {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding-top: 20px;

    flex-shrink: 0;

}


#eye {

    width: 150px;

    height: 90px;

    border:
        4px solid white;

    border-radius:
        50% / 60%;

    display: flex;

    justify-content: center;

    align-items: center;

    transition:
        height 0.12s ease;

}


#pupil {

    width: 46px;

    height: 46px;

    background: white;

    border-radius: 50%;

    transition:
        transform 0.12s ease;

}


#eye.blink {

    height: 6px;

}


#eye.blink #pupil {

    transform:
        scaleY(0);

}


/* =========================================
   TITEL
========================================= */

#title {

    margin-top: 12px;

    font-size: 14px;

    letter-spacing: 5px;

    opacity: 0.75;

}


/* =========================================
   CHAT
========================================= */

#chat {

    width: 100%;

    flex: 1;

    overflow-y: auto;

    padding:
        20px
        15px
        15px;

    -webkit-overflow-scrolling: touch;

}


.message {

    width: 100%;

    margin-bottom: 16px;

}


.messageLabel {

    font-size: 10px;

    letter-spacing: 2px;

    opacity: 0.45;

    margin-bottom: 5px;

}


.messageText {

    font-size: 16px;

    line-height: 1.45;

    word-wrap: break-word;

}


/* =========================================
   EINGABE
========================================= */

#inputArea {

    width: 100%;

    padding:
        10px
        12px
        max(
            12px,
            env(safe-area-inset-bottom)
        );

    display: flex;

    align-items: center;

    gap: 8px;

    border-top:
        1px solid rgba(255,255,255,0.15);

    background: #000;

    flex-shrink: 0;

}


/* Eingabefeld */

#input {

    flex: 1;

    min-width: 0;

    height: 48px;

    padding:
        0 14px;

    border:
        1px solid rgba(255,255,255,0.35);

    border-radius: 24px;

    background: #111;

    color: #fff;

    outline: none;

    font-size: 16px;

    -webkit-user-select: text;

    user-select: text;

}


#input::placeholder {

    color:
        rgba(255,255,255,0.4);

}


/* Buttons */

.iconButton {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,0.4);

    background: #000;

    color: #fff;

    font-size: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

    touch-action: manipulation;

}


.iconButton.active {

    background: #fff;

    color: #000;

}


/* =========================================
   MIKROFON-HINWEIS
========================================= */

#micStatus {

    position: fixed;

    left: 50%;

    bottom: 80px;

    transform:
        translateX(-50%);

    font-size: 11px;

    letter-spacing: 1px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.2s ease;

}


#micStatus.visible {

    opacity: 0.7;

}

</style>

</head>


<body>


<!-- =========================================
     OBSERVER
========================================= -->

<div id="observerArea">

    <div id="eye">

        <div id="pupil"></div>

    </div>

    <div id="title">
        OBSERVER
    </div>

</div>


<!-- =========================================
     CHAT
========================================= -->

<div id="chat"></div>


<!-- =========================================
     EINGABE
========================================= -->

<div id="inputArea">

    <button
        class="iconButton"
        id="micButton"
        aria-label="Mikrofon"
    >
        🎤
    </button>


    <input
        id="input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="sentences"
        placeholder="Nachricht..."
    >


    <button
        class="iconButton"
        id="sendButton"
        aria-label="Senden"
    >
        ➤
    </button>

</div>


<div id="micStatus">
    ICH HÖRE ZU ...
</div>


<script>

/* =========================================
   ELEMENTE
========================================= */

const eye =
    document.getElementById("eye");

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const micButton =
    document.getElementById("micButton");

const sendButton =
    document.getElementById("sendButton");

const micStatus =
    document.getElementById("micStatus");


/* =========================================
   ZUSTAND
========================================= */

let recognition = null;

let listening = false;

let answering = false;

let emergencyStep = false;

let lastCommand = "";

let lastCommandTime = 0;


/* =========================================
   AUGE
========================================= */

function blink() {

    eye.classList.add("blink");

    setTimeout(() => {

        eye.classList.remove("blink");

    }, 170);

}


function scheduleBlink() {

    const delay =
        4500 +
        Math.random() * 8500;


    setTimeout(() => {

        if (!answering) {

            blink();

        }

        scheduleBlink();

    }, delay);

}


scheduleBlink();


/* =========================================
   CHAT-NACHRICHT
========================================= */

function addMessage(
    sender,
    message
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message";


    const label =
        document.createElement("div");

    label.className =
        "messageLabel";

    label.textContent =
        sender;


    const text =
        document.createElement("div");

    text.className =
        "messageText";

    text.textContent =
        message;


    wrapper.appendChild(label);

    wrapper.appendChild(text);

    chat.appendChild(wrapper);


    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });

}


/* =========================================
   EINGABE LEEREN
========================================= */

function clearInput() {

    input.value = "";

}


/* =========================================
   TEXT NORMALISIEREN
========================================= */

function normalize(
    value
) {

    return value
        .toLowerCase()
        .trim()
        .replace(
            /[.,!?;:]/g,
            ""
        )
        .replace(
            /\s+/g,
            " "
        );

}


/* =========================================
   DOPPELTE NACHRICHTEN
========================================= */

function isDuplicate(
    command
) {

    const now =
        Date.now();


    if (
        command === lastCommand &&
        now - lastCommandTime < 2500
    ) {

        return true;

    }


    lastCommand =
        command;

    lastCommandTime =
        now;


    return false;

}


/* =========================================
   OBSERVER-ANTWORTEN
========================================= */

function observerAnswer(
    command
) {

    command =
        normalize(command);


    /* -------------------------------
       NOTFALLNUMMERN
    -------------------------------- */

    if (
        command.includes(
            "notfallnummern"
        )
    ) {

        emergencyStep =
            true;

        return (
            "Nennen Sie jetzt die Notfallnummer."
        );

    }


    /* -------------------------------
       NOTFALL 03 / 3
    -------------------------------- */

    if (
        emergencyStep
    ) {

        if (
            command === "3" ||
            command === "03" ||
            command === "drei" ||
            command === "null drei" ||
            command.includes(
                "nummer drei"
            )
        ) {

            emergencyStep =
                false;

            return (
                "Notfall erkannt, Maßnahmen werden eingeleitet."
                +
                "\n\n"
                +
                "Es befinden sich lediglich drei Personen in der Umgebung. Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel in einem Notfall-Ordner."
            );

        }

    }


    /* -------------------------------
       HALLO
    -------------------------------- */

    if (
        command === "hallo" ||
        command.startsWith("hallo ")
    ) {

        return "Hallo.";

    }


    /* -------------------------------
       WER BIST DU
    -------------------------------- */

    if (
        command.includes(
            "wer bist du"
        ) ||
        (
            command.includes("wer") &&
            command.includes("bist") &&
            command.includes("du")
        )
    ) {

        return "Observer Typ 0.4.";

    }


    /* -------------------------------
       WAS BIST DU
    -------------------------------- */

    if (
        command.includes(
            "was bist du"
        )
    ) {

        return "Ich bin Observer Typ 0.4.";

    }


    /* -------------------------------
       WO SIND WIR
    -------------------------------- */

    if (
        command.includes(
            "wo sind wir"
        ) ||
        (
            command.includes("wo") &&
            command.includes("sind") &&
            command.includes("wir")
        )
    ) {

        return (
            "Ihr wurdet von zwei Männern hier reingebracht, sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, der eine hatte einen Zettel darin versteckt."
        );

    }


    /* -------------------------------
       HILFE
    -------------------------------- */

    if (
        command.includes(
            "hilfe"
        )
    ) {

        return (
            "Ich bin nicht fürs Helfen da."
        );

    }


    /* -------------------------------
       WASCHMASCHINE
    -------------------------------- */

    if (
        command.includes(
            "waschmaschine"
        )
    ) {

        return (
            "Ich bin nicht für eine Wäsche gemacht."
        );

    }


    /* -------------------------------
       RAUS
    -------------------------------- */

    const hasWie =
        command.includes("wie");

    const hasKommen =
        command.includes("kommen");

    const hasRaus =
        command.includes("raus") ||
        command.includes("heraus");


    if (
        (
            hasWie &&
            hasKommen &&
            hasRaus
        )
        ||
        command.includes(
            "wie kommen wir hier raus"
        )
        ||
        command.includes(
            "wie kommen wir hier heraus"
        )
    ) {

        return (
            "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
        );

    }


    /* -------------------------------
       FALLBACK
    -------------------------------- */

    return (
        "Ich habe das nicht verstanden. Wiederholen Sie das bitte."
    );

}


/* =========================================
   NACHRICHT SENDEN
========================================= */

function sendMessage() {

    if (answering) {
        return;
    }


    const raw =
        input.value.trim();


    if (!raw) {
        return;
    }


    const command =
        normalize(raw);


    if (
        isDuplicate(command)
    ) {

        clearInput();

        return;

    }


    /*
       Benutzer-Nachricht.
    */

    addMessage(
        "DU",
        raw
    );


    clearInput();


    /*
       Observer beschäftigt.
    */

    answering =
        true;


    /*
       Kleine technische Pause,
       damit es wie eine echte
       Verarbeitung wirkt.
    */

    const delay =
        250 +
        Math.random() * 350;


    setTimeout(() => {

        const answer =
            observerAnswer(
                command
            );


        addMessage(
            "OBSERVER",
            answer
        );


        answering =
            false;


    }, delay);

}


/* =========================================
   SENDEN
========================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* Enter senden */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   SPRACHERKENNUNG
========================================= */

const RecognitionAPI =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (RecognitionAPI) {

    recognition =
        new RecognitionAPI();


    recognition.lang =
        "de-DE";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        3;


    recognition.onstart =
        () => {

            listening =
                true;

            micButton.classList.add(
                "active"
            );

            micStatus.classList.add(
                "visible"
            );

            micStatus.textContent =
                "ICH HÖRE ZU ...";

        };


    recognition.onresult =
        event => {

            let transcript =
                "";


            for (
                let i = 0;
                i < event.results.length;
                i++
            ) {

                transcript +=
                    event.results[i][0]
                        .transcript;

            }


            /*
               Erkannten Text direkt
               ins Eingabefeld schreiben.
            */

            input.value =
                transcript;


            /*
               Nur finales Ergebnis
               automatisch übernehmen.
            */

            const last =
                event.results[
                    event.results.length - 1
                ];


            if (
                last.isFinal
            ) {

                micStatus.textContent =
                    "SPRACHE ERKANNT";

            }

        };


    recognition.onerror =
        event => {

            listening =
                false;


            micButton.classList.remove(
                "active"
            );


            micStatus.classList.remove(
                "visible"
            );


            console.log(
                "Mikrofon:",
                event.error
            );

        };


    recognition.onend =
        () => {

            listening =
                false;


            micButton.classList.remove(
                "active"
            );


            micStatus.classList.remove(
                "visible"
            );

        };

}


/* =========================================
   MIKROFON BUTTON
========================================= */

micButton.addEventListener(
    "click",
    () => {

        /*
           Während Observer antwortet
           kein neues Zuhören.
        */

        if (answering) {
            return;
        }


        if (!recognition) {

            micStatus.textContent =
                "SPRACHERKENNUNG NICHT VERFÜGBAR";

            micStatus.classList.add(
                "visible"
            );

            setTimeout(() => {

                micStatus.classList.remove(
                    "visible"
                );

            }, 2500);

            return;

        }


        /*
           Bereits aktiv:
           wieder stoppen.
        */

        if (listening) {

            try {

                recognition.stop();

            } catch (e) {}

            return;

        }


        /*
           Einmalige Sprachsession.
        */

        try {

            recognition.start();

        }

        catch (error) {

            console.log(
                "Recognition start:",
                error
            );

        }

    }
);

</script>

</body>
</html>
