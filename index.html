<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>OBSERVER</title>

<style>

/* =========================================
   GRUNDLAYOUT
========================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  background: #000;
  color: #fff;

  font-family: Arial, Helvetica, sans-serif;

  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}


/* =========================================
   OBSERVER-BEREICH
========================================= */

#observerArea {
  width: 100%;
  height: 150px;

  flex-shrink: 0;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: flex-start;

  padding-top: 18px;
}


/* =========================================
   AUGE
========================================= */

#eye {
  position: relative;

  width: 150px;
  height: 90px;

  flex-shrink: 0;

  border: 4px solid white;

  border-radius: 50% / 60%;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

#pupil {
  width: 46px;
  height: 46px;

  background: white;

  border-radius: 50%;
}


/* =========================================
   BLINZELN
========================================= */

#eye.normalBlink #pupil {
  opacity: 0;
}

#eye.normalBlink::before,
#eye.normalBlink::after {

  content: "";

  position: absolute;

  left: -5px;

  width: calc(100% + 10px);

  height: 51%;

  background: #000;

  z-index: 2;
}

#eye.normalBlink::before {
  top: -5px;
}

#eye.normalBlink::after {
  bottom: -5px;
}


/* =========================================
   TITEL
========================================= */

#title {
  margin-top: 8px;

  font-size: 13px;

  letter-spacing: 5px;

  opacity: 0.7;
}


/* =========================================
   CHAT
========================================= */

#chat {

  width: 100%;

  flex: 1;

  overflow-y: auto;

  padding:
    18px
    14px
    20px;

  -webkit-overflow-scrolling: touch;
}


/* =========================================
   CHAT-NACHRICHT
========================================= */

.message {
  width: 100%;
  margin-bottom: 17px;
}

.messageLabel {
  margin-bottom: 5px;

  font-size: 10px;

  letter-spacing: 2px;

  opacity: 0.45;
}

.messageText {

  font-size: 16px;

  line-height: 1.5;

  word-break: break-word;

  white-space: pre-wrap;
}


/* =========================================
   EINGABE
========================================= */

#inputArea {

  width: 100%;

  display: flex;

  align-items: center;

  gap: 8px;

  padding:
    9px
    12px
    max(
      10px,
      env(safe-area-inset-bottom)
    );

  border-top:
    1px solid
    rgba(255,255,255,0.15);

  background: #000;

  flex-shrink: 0;
}


/* =========================================
   TEXTFELD
========================================= */

#input {

  flex: 1;

  min-width: 0;

  height: 48px;

  padding:
    0 15px;

  border:
    1px solid
    rgba(255,255,255,0.35);

  border-radius: 24px;

  background: #111;

  color: #fff;

  outline: none;

  font-size: 16px;

  -webkit-user-select: text;
  user-select: text;
}

#input::placeholder {
  color:
    rgba(255,255,255,0.4);
}


/* =========================================
   BUTTONS
========================================= */

.iconButton {

  width: 48px;
  height: 48px;

  padding: 0;

  border:
    1px solid
    rgba(255,255,255,0.4);

  border-radius: 50%;

  background: #000;

  color: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 20px;

  flex-shrink: 0;

  touch-action: manipulation;

  cursor: pointer;
}

.iconButton:active {
  transform: scale(0.94);
}


/* =========================================
   MIKROFON
========================================= */

#micButton.active {

  background: #fff;

  color: #000;

  border-color: #fff;
}

.iconButton:disabled {

  opacity: 0.3;

  cursor: default;
}


/* =========================================
   MIKROFONSTATUS
========================================= */

#micStatus {

  position: fixed;

  left: 50%;

  bottom: 80px;

  transform:
    translateX(-50%);

  padding:
    5px 10px;

  font-size: 10px;

  letter-spacing: 2px;

  opacity: 0;

  pointer-events: none;
}

#micStatus.visible {
  opacity: 0.65;
}


/* =========================================
   KAMERA-BUTTON
========================================= */

#cameraButton {
  font-size: 21px;
}


/* =========================================
   KAMERA-FENSTER
========================================= */

#cameraOverlay {

  position: fixed;

  inset: 0;

  z-index: 1000;

  background: #000;

  display: none;

  flex-direction: column;
}

#cameraOverlay.open {
  display: flex;
}


/* =========================================
   KAMERA HEADER
========================================= */

#cameraHeader {

  width: 100%;

  min-height: 62px;

  padding:
    10px
    14px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  background: #050505;

  border-bottom:
    1px solid
    rgba(255,255,255,0.15);

  flex-shrink: 0;
}

#cameraTitle {

  font-size: 13px;

  letter-spacing: 3px;

  opacity: 0.8;
}


/* =========================================
   KAMERA SCHLIESSEN
========================================= */

#closeCameraButton {

  width: 42px;
  height: 42px;

  border: 1px solid
    rgba(255,255,255,0.35);

  border-radius: 50%;

  background: #000;

  color: #fff;

  font-size: 22px;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;
}


/* =========================================
   VIDEO-BEREICH
========================================= */

#cameraViewArea {

  position: relative;

  width: 100%;

  flex: 1;

  min-height: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #000;

  overflow: hidden;
}

#scannerVideo {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

  background: #000;
}


/* =========================================
   SCAN-RAHMEN
========================================= */

#scanFrame {

  position: absolute;

  width: min(72vw, 360px);

  height: min(42vw, 210px);

  border:
    2px solid
    rgba(255,255,255,0.8);

  border-radius: 12px;

  pointer-events: none;

  box-shadow:
    0 0 0 9999px
    rgba(0,0,0,0.25);
}

#scanFrame::before {

  content: "";

  position: absolute;

  left: 10%;

  right: 10%;

  top: 50%;

  height: 2px;

  background: rgba(255,255,255,0.75);

  transform: translateY(-50%);
}


/* =========================================
   KAMERA STATUS
========================================= */

#cameraStatus {

  position: absolute;

  left: 50%;

  bottom: 18px;

  transform:
    translateX(-50%);

  width: max-content;

  max-width: 90%;

  padding:
    8px 14px;

  border-radius: 20px;

  background:
    rgba(0,0,0,0.72);

  font-size: 11px;

  letter-spacing: 1px;

  text-align: center;
}


/* =========================================
   KAMERA STEUERUNG
========================================= */

#cameraControls {

  width: 100%;

  padding:
    12px
    12px
    max(
      12px,
      env(safe-area-inset-bottom)
    );

  display: flex;

  gap: 8px;

  background: #050505;

  border-top:
    1px solid
    rgba(255,255,255,0.15);

  flex-shrink: 0;
}

.cameraControlButton {

  flex: 1;

  min-height: 46px;

  border:
    1px solid
    rgba(255,255,255,0.3);

  border-radius: 23px;

  background: #111;

  color: #fff;

  font-size: 13px;

  cursor: pointer;

  touch-action: manipulation;
}

.cameraControlButton.active {

  background: #fff;

  color: #000;

  border-color: #fff;
}


/* =========================================
   KAMERA INFO
========================================= */

#cameraInfo {

  position: absolute;

  top: 74px;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 3;

  padding:
    6px 10px;

  background:
    rgba(0,0,0,0.65);

  border-radius: 14px;

  font-size: 9px;

  letter-spacing: 1px;

  opacity: 0.75;

  pointer-events: none;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

  #cameraTitle {
    font-size: 11px;
    letter-spacing: 2px;
  }

  #scanFrame {
    width: 78vw;
    height: 43vw;
  }

}

</style>


<!-- =========================================
     ZXING
========================================= -->

<script
  src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js">
</script>

</head>


<body>


<!-- =========================================
     OBSERVER
========================================= -->

<div id="observerArea">

  <div id="eye">
    <div id="pupil"></div>
  </div>

  <div id="title">
    OBSERVER
  </div>

</div>


<!-- =========================================
     CHAT
========================================= -->

<div id="chat"></div>


<!-- =========================================
     EINGABE
========================================= -->

<div id="inputArea">

  <button
    id="micButton"
    class="iconButton"
    type="button"
    aria-label="Mikrofon"
  >
    🎤
  </button>


  <input
    id="input"
    type="text"
    placeholder="Nachricht..."
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
  >


  <button
    id="sendButton"
    class="iconButton"
    type="button"
    aria-label="Senden"
  >
    ➤
  </button>


  <button
    id="cameraButton"
    class="iconButton"
    type="button"
    aria-label="Kamera öffnen"
  >
    📷
  </button>

</div>


<div id="micStatus">
  ICH HÖRE ZU
</div>


<!-- =========================================
     KAMERA-OVERLAY
========================================= -->

<div id="cameraOverlay">


  <div id="cameraHeader">

    <div id="cameraTitle">
      OBSERVER · KAMERA
    </div>

    <button
      id="closeCameraButton"
      type="button"
      aria-label="Kamera schließen"
    >
      ×
    </button>

  </div>


  <div id="cameraViewArea">

    <video
      id="scannerVideo"
      autoplay
      playsinline
      muted
    ></video>


    <div id="cameraInfo">
      KAMERABILD · OBSERVER
    </div>


    <div id="scanFrame"></div>


    <div id="cameraStatus">
      KAMERA WIRD GESTARTET …
    </div>

  </div>


  <div id="cameraControls">

    <button
      id="backCameraButton"
      class="cameraControlButton active"
      type="button"
    >
      🔄 Rückkamera
    </button>

    <button
      id="frontCameraButton"
      class="cameraControlButton"
      type="button"
    >
      🤳 Frontkamera
    </button>

  </div>

</div>


<script>

/* =================================================
   ELEMENTE
================================================= */

const eye =
  document.getElementById("eye");

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const micButton =
  document.getElementById("micButton");

const sendButton =
  document.getElementById("sendButton");

const cameraButton =
  document.getElementById("cameraButton");

const micStatus =
  document.getElementById("micStatus");

const cameraOverlay =
  document.getElementById("cameraOverlay");

const closeCameraButton =
  document.getElementById("closeCameraButton");

const scannerVideo =
  document.getElementById("scannerVideo");

const cameraStatus =
  document.getElementById("cameraStatus");

const backCameraButton =
  document.getElementById("backCameraButton");

const frontCameraButton =
  document.getElementById("frontCameraButton");


/* =================================================
   CHAT
================================================= */

function addMessage(
  sender,
  message
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message";


  const label =
    document.createElement("div");

  label.className =
    "messageLabel";

  label.textContent =
    sender;


  const text =
    document.createElement("div");

  text.className =
    "messageText";

  text.textContent =
    message;


  wrapper.appendChild(label);

  wrapper.appendChild(text);

  chat.appendChild(wrapper);


  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* =================================================
   AUGE
================================================= */

function blink() {

  eye.classList.add(
    "normalBlink"
  );


  setTimeout(() => {

    eye.classList.remove(
      "normalBlink"
    );

  }, 170);

}


function scheduleBlink() {

  const delay =
    5000 +
    Math.random() * 8500;


  setTimeout(() => {

    blink();

    scheduleBlink();

  }, delay);

}


scheduleBlink();


/* =================================================
   SPRACHEINGABE
================================================= */

let recognition = null;

let listening = false;

let sending = false;

let emergencyStep = false;

let lastSentCommand = "";

let lastSentTime = 0;


/* =================================================
   NORMALISIEREN
================================================= */

function normalize(
  value
) {

  return value
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[.,!?;:()[\]{}"'„“]/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    );

}


/* =================================================
   BELEIDIGUNGEN
================================================= */

const insults = [

  "arsch",
  "arschloch",
  "idiot",
  "idiotin",
  "dummkopf",
  "depp",
  "trottel",
  "blödmann",
  "blodmann",
  "vollidiot",
  "hurensohn",
  "mistkerl",
  "miststück",
  "miststueck",
  "schlampe",
  "wichser",
  "penner",
  "spasti",
  "opfer"

];


function containsInsult(
  text
) {

  const words =
    text.split(" ");


  return insults.some(
    word =>
      words.includes(word)
  );

}


/* =================================================
   RELEVANTE THEMEN
================================================= */

const relevantWords = [

  "observer",
  "escape",
  "raum",
  "tür",
  "tur",
  "raus",
  "heraus",
  "hilfe",
  "waschmaschine",
  "notfall",
  "nummer",
  "drei",
  "03",
  "mann",
  "männer",
  "maenner",
  "hoodie",
  "jacke",
  "zettel",
  "betriebssystem",
  "überwachung",
  "ueberwachung",
  "beobachtung",
  "ordner",
  "show",
  "signal",
  "licht",
  "symbol",
  "barcode",
  "karton",
  "scan",
  "scannen"

];


function isRelevant(
  command
) {

  if (
    command === "hallo" ||
    command === "hi" ||
    command === "hey" ||
    command === "was"
  ) {

    return true;

  }


  for (
    const word of relevantWords
  ) {

    if (
      command.includes(word)
    ) {

      return true;

    }

  }


  return (
    command.includes("wer bist")
    ||
    command.includes("was bist")
    ||
    command.includes("wie heisst")
    ||
    command.includes("wie heißt")
    ||
    command.includes("was passiert")
    ||
    command.includes("was sollen wir")
  );

}


/* =================================================
   DOPPELTE SENDUNGEN
================================================= */

function isDuplicateSend(
  command
) {

  const now =
    Date.now();


  if (
    command === lastSentCommand &&
    now - lastSentTime < 2500
  ) {

    return true;

  }


  lastSentCommand =
    command;

  lastSentTime =
    now;


  return false;

}


/* =================================================
   NOTFALLNUMMERN
================================================= */

function getEmergencyNumber(
  command
) {

  if (
    command === "1" ||
    command === "01" ||
    command === "eins" ||
    command === "null eins" ||
    command.includes("nummer eins")
  ) {
    return "01";
  }


  if (
    command === "2" ||
    command === "02" ||
    command === "zwei" ||
    command === "null zwei" ||
    command.includes("nummer zwei")
  ) {
    return "02";
  }


  if (
    command === "3" ||
    command === "03" ||
    command === "drei" ||
    command === "null drei" ||
    command.includes("nummer drei")
  ) {
    return "03";
  }


  if (
    command === "4" ||
    command === "04" ||
    command === "vier" ||
    command === "null vier" ||
    command.includes("nummer vier")
  ) {
    return "04";
  }


  if (
    command === "5" ||
    command === "05" ||
    command === "fuenf" ||
    command === "fünf" ||
    command === "null fünf" ||
    command.includes("nummer fünf")
  ) {
    return "05";
  }


  if (
    command === "6" ||
    command === "06" ||
    command === "sechs" ||
    command === "null sechs"
  ) {
    return "06";
  }


  if (
    command === "7" ||
    command === "07" ||
    command === "sieben" ||
    command === "null sieben"
  ) {
    return "07";
  }


  if (
    command === "8" ||
    command === "08" ||
    command === "acht" ||
    command === "null acht"
  ) {
    return "08";
  }


  if (
    command === "9" ||
    command === "09" ||
    command === "neun" ||
    command === "null neun"
  ) {
    return "09";
  }


  return null;

}


/* =================================================
   FALSCHE NOTFALLNUMMERN
================================================= */

function emergencyNumberResponse(
  number
) {

  switch (number) {

    case "01":
      return "Notfallkanal 01. Akustische Auffälligkeit registriert. Kein weiterer Vorgang erforderlich.";

    case "02":
      return "Notfallkanal 02. Möglicher Fehlalarm. Überprüfen Sie die Umgebung.";

    case "04":
      return "Notfallkanal 04. Keine eindeutige Gefahrenlage festgestellt.";

    case "05":
      return "Notfallkanal 05. Dieser Kanal ist für den aktuellen Vorgang nicht verfügbar.";

    case "06":
      return "Notfallkanal 06. Falscher Notfallkanal.";

    case "07":
      return "Notfallkanal 07. Keine gültige Notfallmeldung vorhanden.";

    case "08":
      return "Notfallkanal 08. Dieser Kanal ist für den aktuellen Vorfall nicht vorgesehen.";

    case "09":
      return "Notfallkanal 09. Notfallcode nicht bestätigt.";

    default:
      return "Ungültiger Notfallkanal.";

  }

}


/* =================================================
   OBSERVER-ANTWORT
================================================= */

function getObserverAnswer(
  command
) {

  command =
    normalize(command);


  if (
    containsInsult(command)
  ) {

    return "Bitte unterlasse das, wir sind im öffentlich Rechtlichen Fernsehen zu sehen!";

  }


  if (
    command.includes("notfallnummern")
  ) {

    emergencyStep =
      true;


    return "Nennen Sie jetzt die Notfallnummer.";

  }


  if (
    emergencyStep
  ) {

    const number =
      getEmergencyNumber(command);


    if (
      number
    ) {

      emergencyStep =
        false;


      if (
        number === "03"
      ) {

        return (
          "Notfall erkannt, Maßnahmen werden eingeleitet.\n\n" +
          "Es befinden sich lediglich drei Personen in der Umgebung. " +
          "Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. " +
          "Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel " +
          "in einem Notfall-Ordner."
        );

      }


      return emergencyNumberResponse(
        number
      );

    }

  }


  if (
    command === "hallo" ||
    command.startsWith("hallo ") ||
    command === "hi" ||
    command === "hey"
  ) {

    return "Hallo.";

  }


  if (
    command === "was"
  ) {

    return "Was?";

  }


  if (
    command.includes("wer bist du") ||
    command.includes("was bist du") ||
    command.includes("wie heißt du") ||
    command.includes("wie heisst du")
  ) {

    return "Observer Typ 0.4.";

  }


  if (
    command.includes("wo sind wir") ||
    (
      command.includes("wo") &&
      command.includes("sind") &&
      command.includes("wir")
    )
  ) {

    return (
      "Ihr wurdet von zwei Männern hier reingebracht, " +
      "sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, " +
      "der eine hatte einen Zettel darin versteckt."
    );

  }


  if (
    command.includes("hilfe") ||
    command.includes("hilf uns")
  ) {

    return "Ich bin nicht fürs Helfen da.";

  }


  if (
    command.includes("waschmaschine")
  ) {

    return "Ich bin nicht für eine Wäsche gemacht.";

  }


  const hasWie =
    command.includes("wie");

  const hasKommen =
    command.includes("kommen");

  const hasRaus =
    command.includes("raus") ||
    command.includes("heraus");


  if (
    (
      hasWie &&
      hasKommen &&
      hasRaus
    )
    ||
    command.includes(
      "wie kommen wir hier raus"
    )
    ||
    command.includes(
      "wie kommen wir hier heraus"
    )
  ) {

    return (
      "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
    );

  }


  if (
    !isRelevant(command)
  ) {

    return (
      "Diese Frage gehört nicht zur Show, stelle eine andere!"
    );

  }


  return (
    "Ich habe das nicht verstanden. Stelle die Frage bitte noch einmal."
  );

}


/* =================================================
   CHAT SENDEN
================================================= */

function sendMessage() {

  if (
    sending
  ) {

    return;

  }


  const raw =
    input.value.trim();


  if (
    !raw
  ) {

    return;

  }


  const command =
    normalize(raw);


  if (
    isDuplicateSend(command)
  ) {

    input.value = "";

    return;

  }


  sending =
    true;


  sendButton.disabled =
    true;


  micButton.disabled =
    true;


  stopListening();


  addMessage(
    "DU",
    raw
  );


  input.value =
    "";


  setTimeout(() => {

    const answer =
      getObserverAnswer(
        command
      );


    addMessage(
      "OBSERVER",
      answer
    );


    sending =
      false;


    sendButton.disabled =
      false;


    micButton.disabled =
      false;

  }, 180);

}


sendButton.addEventListener(
  "click",
  sendMessage
);


/* =================================================
   ENTER
================================================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =================================================
   SPRACHERKENNUNG
================================================= */

const RecognitionAPI =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (
  RecognitionAPI
) {

  recognition =
    new RecognitionAPI();


  recognition.lang =
    "de-DE";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    3;


  recognition.onstart =
    () => {

      listening =
        true;


      micButton.classList.add(
        "active"
      );


      micStatus.classList.add(
        "visible"
      );


      micStatus.textContent =
        "ICH HÖRE ZU";

    };


  recognition.onresult =
    event => {

      let transcript =
        "";


      for (
        let i = 0;
        i < event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0]
            .transcript;

      }


      input.value =
        transcript.trim();


      const last =
        event.results[
          event.results.length - 1
        ];


      if (
        last.isFinal
      ) {

        micStatus.textContent =
          "SPRACHE ERKANNT";

      }

    };


  recognition.onerror =
    event => {

      listening =
        false;


      micButton.classList.remove(
        "active"
      );


      micStatus.classList.remove(
        "visible"
      );


      console.log(
        "SpeechRecognition:",
        event.error
      );

    };


  recognition.onend =
    () => {

      listening =
        false;


      micButton.classList.remove(
        "active"
      );


      micStatus.classList.remove(
        "visible"
      );

    };

}


/* =================================================
   MIKROFON
================================================= */

function startListening() {

  if (
    !recognition ||
    listening ||
    sending
  ) {

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    console.log(
      "Mikrofonstart:",
      error
    );

  }

}


function stopListening() {

  if (
    !recognition
  ) {

    return;

  }


  try {

    recognition.stop();

  }

  catch (error) {}


  listening =
    false;


  micButton.classList.remove(
    "active"
  );


  micStatus.classList.remove(
    "visible"
  );

}


micButton.addEventListener(
  "click",
  () => {

    if (
      sending
    ) {

      return;

    }


    if (
      listening
    ) {

      stopListening();

      return;

    }


    startListening();

  }
);


/* =================================================
   BARCODE-SCANNER
================================================= */

let barcodeReader = null;

let barcodeControls = null;

let currentStream = null;

let currentCameraMode = "back";

let scannerStarted = false;

let lastDetectedValue = "";

let lastDetectedTime = 0;


/* =================================================
   ZIEL-BARCODE
================================================= */

const TARGET_BARCODE =
  "000000";


/* =================================================
   BARCODE-NACHRICHT
================================================= */

const BARCODE_MESSAGE =
  "Ich habe den Inhalt in diesem Karton gescannt:\n\n" +
  "WARNUNG, es befinden sich zerbrechliche Gegenstände in diesem Karton. " +
  "Laut Scan enthält es eine Flüssigkeit.";


/* =================================================
   BARCODE AUSLÖSEN
================================================= */

function handleBarcode(
  value
) {

  if (!value) {
    return;
  }


  const cleanValue =
    String(value)
      .trim();


  /*
     Nur der Barcode 000000
     darf reagieren.
  */

  if (
    cleanValue !== TARGET_BARCODE
  ) {

    return;

  }


  const now =
    Date.now();


  if (
    cleanValue === lastDetectedValue &&
    now - lastDetectedTime < 5000
  ) {

    return;

  }


  lastDetectedValue =
    cleanValue;


  lastDetectedTime =
    now;


  addMessage(
    "OBSERVER",
    BARCODE_MESSAGE
  );


  /*
     Nach erfolgreichem Scan
     kann das Kamerafenster offen bleiben.
     So können die Spieler sehen,
     dass der Scan funktioniert hat.
  */

  cameraStatus.textContent =
    "BARCODE ERKANNT";

}


/* =================================================
   KAMERA-GERÄTE
================================================= */

async function getCameraDevices() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.enumerateDevices
  ) {

    return [];

  }


  try {

    const devices =
      await navigator.mediaDevices.enumerateDevices();


    return devices.filter(
      device =>
        device.kind === "videoinput"
    );

  }

  catch (error) {

    console.log(
      "Kamera-Geräte:",
      error
    );


    return [];

  }

}


/* =================================================
   RÜCKKAMERA SUCHEN
================================================= */

function findBackCamera(
  devices
) {

  return devices.find(
    device =>
      /back|rear|environment|rück|hinten/i
        .test(
          device.label || ""
        )
  );

}


/* =================================================
   FRONTKAMERA SUCHEN
================================================= */

function findFrontCamera(
  devices
) {

  return devices.find(
    device =>
      /front|user|face|vorn/i
        .test(
          device.label || ""
        )
  );

}


/* =================================================
   KAMERA STOPPEN
================================================= */

function stopCamera() {

  scannerStarted =
    false;


  if (
    barcodeControls
  ) {

    try {

      barcodeControls.stop();

    }

    catch (error) {}

    barcodeControls =
      null;

  }


  if (
    barcodeReader
  ) {

    try {

      barcodeReader.reset();

    }

    catch (error) {}

    barcodeReader =
      null;

  }


  if (
    currentStream
  ) {

    currentStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    currentStream =
      null;

  }


  scannerVideo.srcObject =
    null;

}


/* =================================================
   KAMERA STARTEN
================================================= */

async function startCamera(
  mode = "back"
) {

  stopCamera();


  currentCameraMode =
    mode;


  cameraStatus.textContent =
    "KAMERA WIRD GESTARTET …";


  try {

    /*
       Erst versuchen wir die
       gewünschte Kamera direkt
       über facingMode zu bekommen.
    */

    const constraints = {

      video: {

        facingMode:
          mode === "back"
            ? { ideal: "environment" }
            : { ideal: "user" },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      },

      audio: false

    };


    currentStream =
      await navigator.mediaDevices
        .getUserMedia(
          constraints
        );


    scannerVideo.srcObject =
      currentStream;


    await scannerVideo.play();


    scannerStarted =
      true;


    updateCameraButtons();


    cameraStatus.textContent =
      mode === "back"
        ? "RÜCKKAMERA · BARCODE BEREIT"
        : "FRONTKAMERA · BARCODE BEREIT";


    /*
       Barcode-Erkennung starten.
    */

    await startBarcodeReader();


  }

  catch (error) {

    console.log(
      "Kamera:",
      error
    );


    cameraStatus.textContent =
      "KAMERA KONNTE NICHT GESTARTET WERDEN";


    scannerStarted =
      false;

  }

}


/* =================================================
   BARCODE READER STARTEN
================================================= */

async function startBarcodeReader() {

  if (
    !window.ZXingBrowser
  ) {

    cameraStatus.textContent =
      "BARCODE-SCANNER NICHT GELADEN";

    return;

  }


  try {

    barcodeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    barcodeControls =
      await barcodeReader
        .decodeFromVideoElement(
          scannerVideo,
          (
            result,
            error
          ) => {

            if (
              !result
            ) {

              return;

            }


            const value =
              result.getText();


            handleBarcode(
              value
            );

          }
        );

  }

  catch (error) {

    console.log(
      "Barcode Reader:",
      error
    );

  }

}


/* =================================================
   KAMERA BUTTONS AKTUALISIEREN
================================================= */

function updateCameraButtons() {

  backCameraButton.classList.toggle(
    "active",
    currentCameraMode === "back"
  );


  frontCameraButton.classList.toggle(
    "active",
    currentCameraMode === "front"
  );

}


/* =================================================
   KAMERA ÖFFNEN
================================================= */

cameraButton.addEventListener(
  "click",
  async () => {

    cameraOverlay.classList.add(
      "open"
    );


    cameraStatus.textContent =
      "KAMERA WIRD GESTARTET …";


    /*
       Standardmäßig Rückkamera.
    */

    currentCameraMode =
      "back";


    updateCameraButtons();


    await startCamera(
      "back"
    );

  }
);


/* =================================================
   KAMERA SCHLIESSEN
================================================= */

closeCameraButton.addEventListener(
  "click",
  () => {

    stopCamera();


    cameraOverlay.classList.remove(
      "open"
    );

  }
);


/* =================================================
   RÜCKKAMERA
================================================= */

backCameraButton.addEventListener(
  "click",
  async () => {

    if (
      currentCameraMode === "back" &&
      scannerStarted
    ) {

      return;

    }


    await startCamera(
      "back"
    );

  }
);


/* =================================================
   FRONTKAMERA
================================================= */

frontCameraButton.addEventListener(
  "click",
  async () => {

    if (
      currentCameraMode === "front" &&
      scannerStarted
    ) {

      return;

    }


    await startCamera(
      "front"
    );

  }
);


/* =================================================
   OVERLAY BEIM VERLASSEN STOPPEN
================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      if (
        cameraOverlay.classList.contains(
          "open"
        )
      ) {

        stopCamera();

      }

    }

  }
);


/* =================================================
   ESCAPE-TASTE
================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape" &&
      cameraOverlay.classList.contains(
        "open"
      )
    ) {

      stopCamera();

      cameraOverlay.classList.remove(
        "open"
      );

    }

  }
);

</script>
