<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Observer Sprachtest</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      padding: 16px 24px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 6px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <button id="test">
    SPRACHE TESTEN
  </button>

  <script>
    const button = document.getElementById("test");

    button.addEventListener("click", () => {

      if (!("speechSynthesis" in window)) {
        alert("speechSynthesis wird nicht unterstützt.");
        return;
      }

      const utterance =
        new SpeechSynthesisUtterance(
          "Hallo. Ich bin der Observer."
        );

      utterance.lang = "de-DE";
      utterance.rate = 0.9;
      utterance.pitch = 0.85;
      utterance.volume = 1;

      const voices =
        window.speechSynthesis.getVoices();

      const germanVoice =
        voices.find(
          voice => voice.lang === "de-DE"
        ) ||
        voices.find(
          voice =>
            voice.lang &&
            voice.lang.toLowerCase().startsWith("de")
        );

      if (germanVoice) {
        utterance.voice = germanVoice;
      }

      window.speechSynthesis.resume();

      window.speechSynthesis.speak(utterance);

    });
  </script>

</body>
</html>
