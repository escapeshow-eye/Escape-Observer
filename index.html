<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1.0,
  maximum-scale=1.0,
  user-scalable=no,
  viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black"
>

<title>OBSERVER</title>

<style>

* {
  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;
}

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  background: #000;
  color: #fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

body {

  display: flex;

  flex-direction: column;

  overflow: hidden;

}


/* =========================================
   OBSERVER-BEREICH
========================================= */

#observerArea {

  width: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  padding-top: 18px;

  flex-shrink: 0;

}


/* =========================================
   AUGE
========================================= */

#eye {

  width: 150px;
  height: 90px;

  border:
    4px solid white;

  border-radius:
    50% / 60%;

  display: flex;

  justify-content: center;
  align-items: center;

  transition:
    height 120ms ease;

}


#pupil {

  width: 46px;
  height: 46px;

  background: white;

  border-radius: 50%;

  transition:
    transform 120ms ease;

}


#eye.blink {

  height: 6px;

}


#eye.blink #pupil {

  transform:
    scaleY(0);

}


/* =========================================
   TITEL
========================================= */

#title {

  margin-top: 10px;

  font-size: 13px;

  letter-spacing: 5px;

  opacity: .7;

}


/* =========================================
   CHAT
========================================= */

#chat {

  flex: 1;

  width: 100%;

  overflow-y: auto;

  padding:
    18px
    14px
    20px;

  -webkit-overflow-scrolling:
    touch;

}


.message {

  margin-bottom: 16px;

}


.messageLabel {

  margin-bottom: 5px;

  font-size: 10px;

  letter-spacing: 2px;

  opacity: .45;

}


.messageText {

  font-size: 16px;

  line-height: 1.5;

  word-break: break-word;

}


/* =========================================
   EINGABE
========================================= */

#inputArea {

  width: 100%;

  display: flex;

  align-items: center;

  gap: 8px;

  padding:
    9px
    12px
    max(
      10px,
      env(safe-area-inset-bottom)
    );

  border-top:
    1px solid
    rgba(255,255,255,.15);

  background: #000;

  flex-shrink: 0;

}


/* =========================================
   EINGABEFELD
========================================= */

#input {

  flex: 1;

  min-width: 0;

  height: 48px;

  padding:
    0 15px;

  border:
    1px solid
    rgba(255,255,255,.35);

  border-radius: 24px;

  background: #111;

  color: white;

  outline: none;

  font-size: 16px;

  -webkit-user-select: text;
  user-select: text;

}


#input::placeholder {

  color:
    rgba(255,255,255,.4);

}


/* =========================================
   BUTTONS
========================================= */

.iconButton {

  width: 48px;
  height: 48px;

  padding: 0;

  border:
    1px solid
    rgba(255,255,255,.4);

  border-radius: 50%;

  background: #000;

  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 20px;

  flex-shrink: 0;

  touch-action: manipulation;

}


/* Mikrofon aktiv */

#micButton.active {

  background: white;

  color: black;

  border-color: white;

}


/* Senden */

#sendButton:disabled {

  opacity: .35;

}


/* =========================================
   MIKROFON-HINWEIS
========================================= */

#micStatus {

  position: fixed;

  left: 50%;

  bottom: 78px;

  transform:
    translateX(-50%);

  padding:
    5px 10px;

  font-size: 10px;

  letter-spacing: 2px;

  opacity: 0;

  pointer-events: none;

}


#micStatus.visible {

  opacity: .65;

}

</style>

</head>


<body>


<!-- =========================================
     OBSERVER
========================================= -->

<div id="observerArea">

  <div id="eye">

    <div id="pupil"></div>

  </div>


  <div id="title">
    OBSERVER
  </div>

</div>


<!-- =========================================
     CHAT
========================================= -->

<div id="chat"></div>


<!-- =========================================
     EINGABE
========================================= -->

<div id="inputArea">

  <button
    id="micButton"
    class="iconButton"
    type="button"
    aria-label="Mikrofon"
  >
    🎤
  </button>


  <input
    id="input"
    type="text"
    placeholder="Nachricht..."
    autocomplete="off"
    autocorrect="off"
    spellcheck="false"
  >


  <button
    id="sendButton"
    class="iconButton"
    type="button"
    aria-label="Senden"
  >
    ➤
  </button>

</div>


<div id="micStatus">
  ICH HÖRE ZU
</div>


<script>

/* =================================================
   ELEMENTE
================================================= */

const eye =
  document.getElementById(
    "eye"
  );

const chat =
  document.getElementById(
    "chat"
  );

const input =
  document.getElementById(
    "input"
  );

const micButton =
  document.getElementById(
    "micButton"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const micStatus =
  document.getElementById(
    "micStatus"
  );


/* =================================================
   ZUSTAND
================================================= */

let recognition = null;

let listening = false;

let sending = false;

let lastSentCommand = "";

let lastSentTime = 0;

let emergencyStep = false;


/* =================================================
   AUGE
================================================= */

function blink() {

  eye.classList.add(
    "blink"
  );


  setTimeout(() => {

    eye.classList.remove(
      "blink"
    );

  }, 170);

}


function scheduleBlink() {

  const delay =
    4500 +
    Math.random() * 8500;


  setTimeout(() => {

    blink();

    scheduleBlink();

  }, delay);

}


scheduleBlink();


/* =================================================
   CHAT-NACHRICHT
================================================= */

function addMessage(
  sender,
  message
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "message";


  const label =
    document.createElement(
      "div"
    );

  label.className =
    "messageLabel";

  label.textContent =
    sender;


  const text =
    document.createElement(
      "div"
    );

  text.className =
    "messageText";

  text.textContent =
    message;


  wrapper.appendChild(
    label
  );

  wrapper.appendChild(
    text
  );


  chat.appendChild(
    wrapper
  );


  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* =================================================
   TEXT NORMALISIEREN
================================================= */

function normalize(
  text
) {

  return text
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[.,!?;:()[\]{}"'„“"']/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    );

}


/* =================================================
   BELEIDIGUNGEN
================================================= */

/*
   Häufige deutsche Beleidigungen /
   Schimpfwörter.

   Die Erkennung arbeitet absichtlich
   zusätzlich mit Wortgrenzen, damit
   normale Wörter nicht versehentlich
   ausgelöst werden.

   Das kann natürlich nicht buchstäblich
   jede Beleidigung der Welt kennen.
*/

const insultWords = [

  "arsch",
  "arschloch",
  "idiot",
  "idiotin",
  "dummkopf",
  "depp",
  "trottel",
  "blödmann",
  "blodmann",
  "vollidiot",
  "hurensohn",
  "mistkerl",
  "miststueck",
  "miststuck",
  "schlampe",
  "wichser",
  "penner",
  "spasti",
  "opfer"

];


function containsInsult(
  text
) {

  const words =
    text.split(" ");


  return insultWords.some(
    insult =>
      words.includes(insult)
      ||
      text.includes(
        " " + insult + " "
      )
  );

}


/* =================================================
   ESCAPE-ROOM-THEMA
================================================= */

/*
   Begriffe, die grundsätzlich zum
   Observer / Escape Room gehören.

   Alles andere wird als
   nicht zur Show gehörend behandelt.
*/

const relevantWords = [

  "observer",
  "escape",
  "raum",
  "tür",
  "raus",
  "heraus",
  "hilfe",
  "waschmaschine",
  "notfall",
  "nummer",
  "drei",
  "03",
  "männer",
  "mann",
  "hoodie",
  "jacke",
  "zettel",
  "betriebssystem",
  "überwachung",
  "beobachtung",
  "ordner"

];


/* =================================================
   RELEVANZ PRÜFEN
================================================= */

function isRelevant(
  command
) {

  /*
     Bekannte direkte Befehle
     sind immer erlaubt.
  */

  if (
    command === "hallo" ||
    command === "was"
  ) {

    return true;

  }


  /*
     Fragewörter + Escape-Room-Wörter
     werden zugelassen.
  */

  for (
    const word of relevantWords
  ) {

    if (
      command.includes(word)
    ) {

      return true;

    }

  }


  /*
     Typische Fragen über Observer.
  */

  if (
    command.includes("wer bist") ||
    command.includes("was bist") ||
    command.includes("wo sind wir") ||
    command.includes("was passiert") ||
    command.includes("was sollen wir")
  ) {

    return true;

  }


  return false;

}


/* =================================================
   DOPPELTE EINSENDUNGEN
================================================= */

function isDuplicateSend(
  command
) {

  const now =
    Date.now();


  if (
    command === lastSentCommand
    &&
    now - lastSentTime < 2500
  ) {

    return true;

  }


  lastSentCommand =
    command;

  lastSentTime =
    now;


  return false;

}


/* =================================================
   OBSERVER-ANTWORT
================================================= */

function getObserverAnswer(
  command
) {

  command =
    normalize(
      command
    );


  /* =====================================
     BELEIDIGUNG
  ===================================== */

  if (
    containsInsult(command)
  ) {

    return (
      "Bitte unterlasse das, wir sind im öffentlich-rechtlichen Fernsehen zu sehen!"
    );

  }


  /* =====================================
     NOTFALLNUMMERN
  ===================================== */

  if (
    command.includes(
      "notfallnummern"
    )
  ) {

    emergencyStep =
      true;

    return (
      "Nennen Sie jetzt die Notfallnummer."
    );

  }


  /* =====================================
     NOTFALL 03 / 3
  ===================================== */

  if (
    emergencyStep
  ) {

    if (
      command === "3" ||
      command === "03" ||
      command === "0 3" ||
      command === "drei" ||
      command === "null drei" ||
      command.includes("nummer drei")
    ) {

      emergencyStep =
        false;


      /*
         Der eigentliche Ablauf
         wird über eine Spezialantwort
         zurückgegeben.
      */

      return (
        "Notfall erkannt, Maßnahmen werden eingeleitet."
        +
        "\n\n"
        +
        "Es befinden sich lediglich drei Personen in der Umgebung. Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel in einem Notfall-Ordner."
      );

    }

  }


  /* =====================================
     HALLO
  ===================================== */

  if (
    command === "hallo" ||
    command.startsWith("hallo ")
  ) {

    return "Hallo.";

  }


  /* =====================================
     WAS
  ===================================== */

  if (
    command === "was"
  ) {

    return "Was?";

  }


  /* =====================================
     WER BIST DU
  ===================================== */

  if (
    command.includes(
      "wer bist du"
    )
    ||
    command.includes(
      "was bist du"
    )
    ||
    command.includes(
      "wie heißt du"
    )
    ||
    command.includes(
      "wie heisst du"
    )
  ) {

    return (
      "Observer Typ 0.4."
    );

  }


  /* =====================================
     WO SIND WIR
  ===================================== */

  if (
    command.includes(
      "wo sind wir"
    )
    ||
    (
      command.includes("wo")
      &&
      command.includes("sind")
      &&
      command.includes("wir")
    )
  ) {

    return (
      "Ihr wurdet von zwei Männern hier reingebracht, sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, der eine hatte einen Zettel darin versteckt."
    );

  }


  /* =====================================
     HILFE
  ===================================== */

  if (
    command.includes(
      "hilfe"
    )
    ||
    command.includes(
      "hilf uns"
    )
  ) {

    return (
      "Ich bin nicht fürs Helfen da."
    );

  }


  /* =====================================
     WASCHMASCHINE
  ===================================== */

  if (
    command.includes(
      "waschmaschine"
    )
  ) {

    return (
      "Ich bin nicht für eine Wäsche gemacht."
    );

  }


  /* =====================================
     WIE KOMMEN WIR RAUS
  ===================================== */

  const hasHow =
    command.includes(
      "wie"
    );

  const hasCome =
    command.includes(
      "kommen"
    );

  const hasOut =
    command.includes(
      "raus"
    )
    ||
    command.includes(
      "heraus"
    );


  if (
    (
      hasHow &&
      hasCome &&
      hasOut
    )
    ||
    command.includes(
      "wie kommen wir hier raus"
    )
    ||
    command.includes(
      "wie kommen wir heraus"
    )
  ) {

    return (
      "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
    );

  }


  /* =====================================
     NICHT ZUR SHOW
  ===================================== */

  if (
    !isRelevant(command)
  ) {

    return (
      "Diese Frage gehört nicht zur Show, stelle eine andere!"
    );

  }


  /*
     Etwas ist thematisch passend,
     aber noch nicht als eigener
     Befehl definiert.

     Deshalb lieber nachfragen.
  */

  return (
    "Ich habe das nicht verstanden. Stelle die Frage bitte noch einmal."
  );

}


/* =================================================
   SENDEN
================================================= */

function sendMessage() {

  if (
    sending
  ) {

    return;

  }


  const raw =
    input.value.trim();


  if (!raw) {
    return;
  }


  const command =
    normalize(raw);


  if (
    isDuplicateSend(command)
  ) {

    input.value = "";

    return;

  }


  sending =
    true;

  sendButton.disabled =
    true;

  micButton.disabled =
    true;


  /*
     Sobald abgesendet wird:
     Mikrofon sofort deaktivieren.
  */

  stopListening();


  /*
     Nutzer-Nachricht.
  */

  addMessage(
    "DU",
    raw
  );


  input.value =
    "";


  /*
     Sehr kurze Verarbeitungspause.
  */

  setTimeout(() => {

    const answer =
      getObserverAnswer(
        command
      );


    addMessage(
      "OBSERVER",
      answer
    );


    sending =
      false;

    sendButton.disabled =
      false;

    micButton.disabled =
      false;

  }, 180);

}


/* =================================================
   SENDEN BUTTON
================================================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* =================================================
   ENTER
================================================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =================================================
   SPRACHERKENNUNG
================================================= */

const RecognitionAPI =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (
  RecognitionAPI
) {

  recognition =
    new RecognitionAPI();


  recognition.lang =
    "de-DE";


  /*
     Nur eine Aufnahme pro
     Mikrofon-Klick.

     Das verhindert Dauer-Neustarts.
  */

  recognition.continuous =
    false;


  /*
     Zwischenergebnisse anzeigen,
     damit der Text beim Sprechen
     schneller entsteht.
  */

  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    3;


  recognition.onstart =
    () => {

      listening =
        true;


      micButton.classList.add(
        "active"
      );


      micStatus.classList.add(
        "visible"
      );

      micStatus.textContent =
        "ICH HÖRE ZU";

    };


  recognition.onresult =
    event => {

      let transcript =
        "";


      for (
        let i = 0;
        i < event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0]
            .transcript;

      }


      /*
         Während der Aufnahme
         direkt ins Eingabefeld.
      */

      input.value =
        transcript;


      /*
         Bei finalem Ergebnis:
         Aufnahme beenden.

         Das Mikrofon geht danach
         automatisch aus.
      */

      const lastResult =
        event.results[
          event.results.length - 1
        ];


      if (
        lastResult.isFinal
      ) {

        stopListening();

      }

    };


  recognition.onerror =
    event => {

      listening =
        false;


      micButton.classList.remove(
        "active"
      );


      micStatus.classList.remove(
        "visible"
      );


      console.log(
        "Spracherkennung:",
        event.error
      );

    };


  recognition.onend =
    () => {

      listening =
        false;


      micButton.classList.remove(
        "active"
      );


      micStatus.classList.remove(
        "visible"
      );

    };

}


/* =================================================
   MIKROFON START / STOP
================================================= */

function startListening() {

  if (
    !recognition
  ) {

    return;

  }


  if (
    listening ||
    sending
  ) {

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    console.log(
      "Mikrofon konnte nicht gestartet werden:",
      error
    );

  }

}


function stopListening() {

  if (
    !recognition
  ) {

    return;

  }


  try {

    recognition.stop();

  }

  catch (error) {}


  listening =
    false;


  micButton.classList.remove(
    "active"
  );


  micStatus.classList.remove(
    "visible"
  );

}


/* =================================================
   MIKROFON BUTTON
================================================= */

micButton.addEventListener(
  "click",
  () => {

    if (
      sending
    ) {

      return;

    }


    /*
       Wenn aktiv:
       Aufnahme sofort beenden.
    */

    if (
      listening
    ) {

      stopListening();

      return;

    }


    /*
       Neue Aufnahme starten.
    */

    startListening();

  }
);


/* =================================================
   STARTZUSTAND
================================================= */

input.value =
  "";

</script>

</body>

</html>
