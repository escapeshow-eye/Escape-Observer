<style>

html,

   AUGE

.eye {

.response {

.bar:nth-child(1) { animation-delay: 0s; }

@keyframes audioWave {

<audio
  id="mailboxAudio"
  preload="auto"
  src="audio/Stromausfall%20Escape%20Room.m4a"
></audio>


<script>

/* ==================================================
   ELEMENTE
================================================== */

const eye =
  document.getElementById("eye");

const status =
  document.getElementById("status");

const response =
  document.getElementById("response");

const wave =
  document.getElementById("wave");

const activateButton =
  document.getElementById("activate");

const timerElement =
  document.getElementById("timer");

const mailboxAudio =
  document.getElementById("mailboxAudio");

const camera =
  document.getElementById("camera");

const canvas =
  document.getElementById("cameraCanvas");

const ctx =
  canvas.getContext("2d");


/* ==================================================
   SYSTEMZUSTAND
================================================== */

let observerActivated = false;

let timerStarted = false;

let remainingSeconds = 90 * 60;

let timerInterval = null;

let emergencyMode = false;

let emergencyPause = false;

let mailboxPlaying = false;

let waitingForEmergencyNumber = false;

let recognition = null;

let recognitionAvailable = false;

let cameraReady = false;

let cameraInterval = null;

let lastCameraState = "unknown";

let cameraCooldown = false;


/* ==================================================
   90-MINUTEN-TIMER
================================================== */

/*
  NICHT beim Observer-Aktivieren starten.

  Diese Funktion wird später mit dem Öffnen
  des Duschvorhangs verbunden.
*/

function startEscapeRoom() {

  if (timerStarted) {
    return;
  }

  timerStarted = true;

  remainingSeconds = 90 * 60;

  updateTimer();

  timerInterval = setInterval(() => {

    if (remainingSeconds <= 0) {

      clearInterval(timerInterval);

      remainingSeconds = 0;

      updateTimer();

      return;
    }

    remainingSeconds--;

    updateTimer();

  }, 1000);
}


function updateTimer() {

  const minutes =
    Math.floor(remainingSeconds / 60);

  const seconds =
    remainingSeconds % 60;

  timerElement.textContent =
    String(minutes).padStart(2, "0")
    + ":"
    +
    String(seconds).padStart(2, "0");
}


/*
  BEISPIEL:

  Wenn ihr später einen echten Sensor,
  Button oder Mechanismus für den
  Duschvorhang habt, ruft dieser:

      startEscapeRoom();

  auf.
*/


/* ==================================================
   NORMALES BLINZELN
================================================== */

/*
  Alle 10 Sekunden ein normales Blinzeln.
*/

function blink() {

  eye.classList.add("blink");

  setTimeout(() => {

    eye.classList.remove("blink");

  }, 180);
}


setInterval(() => {

  if (
    observerActivated &&
    !emergencyPause
  ) {
    blink();
  }

}, 10000);


/* ==================================================
   MORSE-BLINZELN
================================================== */

/*
  Punkt = kurzer Blink
  Strich = langer Blink

  Die eigentliche geheime Nachricht
  könnt ihr später hier festlegen.
*/

function blinkMorse(symbol) {

  if (!observerActivated) {
    return;
  }

  eye.classList.add("blink");

  const duration =
    symbol === "."
      ? 180
      : 500;

  setTimeout(() => {

    eye.classList.remove("blink");

  }, duration);
}


/*
  Beispiel für eine Morsefolge:

  blinkMorse(".");
  blinkMorse(".");
  blinkMorse("-");
*/


/* ==================================================
   OBSERVER SPRICHT
================================================== */

function observerSpeak(
  text,
  finished = null
) {

  if (!observerActivated) {
    return;
  }

  response.textContent = text;

  status.textContent =
    "OBSERVER SPRICHT";

  wave.classList.add("active");


  if (!("speechSynthesis" in window)) {

    wave.classList.remove("active");

    if (finished) {
      finished();
    }

    return;
  }


  /*
    Alte Sprachausgabe beenden.
  */

  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "de-DE";

  utterance.rate = 0.85;

  utterance.pitch = 0.8;

  utterance.volume = 1;


  utterance.onend = () => {

    wave.classList.remove("active");

    response.textContent = "";

    status.textContent =
      "BEOBACHTUNG AKTIV";

    if (finished) {
      finished();
    }

  };


  utterance.onerror = () => {

    wave.classList.remove("active");

    if (finished) {
      finished();
    }

  };


  window.speechSynthesis.speak(
    utterance
  );
}


/* ==================================================
   MAILBOX
================================================== */

/*
  Befehl:

  "Spiele die Mailbox ab."

  Danach:

  Observer spricht EINMAL.

  Danach startet die M4A.

  Währenddessen werden keine Befehle
  verarbeitet.

  Nach Ende der M4A kehrt der Observer
  automatisch zurück.
*/

function playMailbox() {

  if (
    mailboxPlaying ||
    emergencyPause
  ) {
    return;
  }

  mailboxPlaying = true;

  status.textContent =
    "MAILBOX WIRD ABGESPIELT";

  response.textContent =
    "Ich spiele die Mailbox ab.";

  wave.classList.add("active");


  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

  }


  const intro =
    new SpeechSynthesisUtterance(
      "Ich spiele die Mailbox ab."
    );

  intro.lang = "de-DE";

  intro.rate = 0.85;

  intro.pitch = 0.8;

  intro.volume = 1;


  intro.onend = () => {

    response.textContent = "";

    status.textContent =
      "MAILBOX";

    mailboxAudio.currentTime = 0;


    mailboxAudio
      .play()
      .catch(error => {

        console.error(
          "Mailbox konnte nicht abgespielt werden:",
          error
        );

        finishMailbox();

      });

  };


  intro.onerror = () => {

    /*
      Falls Safari die Sprachansage
      nicht sauber beendet, trotzdem
      die Mailbox starten.
    */

    mailboxAudio.currentTime = 0;

    mailboxAudio
      .play()
      .catch(() => finishMailbox());

  };


  window.speechSynthesis.speak(
    intro
  );
}


mailboxAudio.addEventListener(
  "ended",
  finishMailbox
);


function finishMailbox() {

  mailboxPlaying = false;

  wave.classList.remove("active");

  response.textContent = "";

  status.textContent =
    "BEOBACHTUNG AKTIV";
}


/* ==================================================
   NOTFALLSEQUENZ
================================================== */

function startEmergency() {

  if (emergencyMode) {
    return;
  }

  emergencyMode = true;

  emergencyPause = true;

  waitingForEmergencyNumber = false;


  observerSpeak(
    "Notfall erkannt, Maßnahmen werden eingeleitet.",
    () => {

      /*
        Kurze Pause.
        Währenddessen werden keine
        anderen Befehle akzeptiert.
      */

      setTimeout(() => {

        emergencyAnnouncement();

      }, 5000);

    }
  );
}


function emergencyAnnouncement() {

  const text =
    "Es befinden sich lediglich drei Personen in der Umgebung. Stellen Sie sicher, dass Hilfeschreie nicht von ihnen kommen. Sollte dies nicht der Fall sein, finden Sie eine weitere Hilfetafel in einem Notfall-Ordner.";

  response.textContent = text;

  status.textContent =
    "NOTFALLPROTOKOLL";

  wave.classList.add("active");


  if (!("speechSynthesis" in window)) {

    finishEmergencyAnnouncement();

    return;
  }


  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "de-DE";

  utterance.rate = 0.82;

  utterance.pitch = 0.8;

  utterance.volume = 1;


  utterance.onend =
    finishEmergencyAnnouncement;


  utterance.onerror =
    finishEmergencyAnnouncement;


  window.speechSynthesis.speak(
    utterance
  );
}


function finishEmergencyAnnouncement() {

  wave.classList.remove("active");

  response.textContent = "";

  status.textContent =
    "BEOBACHTUNG AKTIV";

  emergencyPause = false;
}


/* ==================================================
   SPRACHERKENNUNG
================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognitionAvailable = true;

  recognition =
    new SpeechRecognition();

  recognition.lang = "de-DE";

  recognition.continuous = true;

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;


  recognition.onresult =
    handleSpeech;


  recognition.onend = () => {

    /*
      Safari beendet continuous recognition
      gelegentlich.

      Wenn der Observer noch aktiv ist,
      starten wir sie wieder.
    */

    if (
      observerActivated &&
      !mailboxPlaying
    ) {

      setTimeout(
        startRecognition,
        400
      );

    }

  };


  recognition.onerror = event => {

    console.log(
      "Spracherkennung:",
      event.error
    );

  };

}


function startRecognition() {

  if (
    !recognitionAvailable ||
    !observerActivated
  ) {
    return;
  }

  try {

    recognition.start();

  } catch (error) {

    /*
      start() kann einen Fehler geben,
      wenn die Erkennung bereits läuft.
    */

  }
}


/* ==================================================
   SPRACHBEFEHLE
================================================== */

function handleSpeech(event) {

  if (!event.results.length) {
    return;
  }


  const result =
    event.results[
      event.results.length - 1
    ];


  if (!result.isFinal) {
    return;
  }


  let command =
    result[0].transcript
      .toLowerCase()
      .trim();


  command =
    command.replace(
      /[.,!?;:]/g,
      ""
    );


  console.log(
    "Erkannt:",
    command
  );


  /*
    Während einer Mailbox:
    NICHTS tun.
  */

  if (mailboxPlaying) {
    return;
  }


  /*
    Während der Notfallsequenz:
    NICHTS tun.
  */

  if (emergencyPause) {
    return;
  }


  /* ==========================
     NOTFALLNUMMERN
  ========================== */

  if (
    command.includes("notfallnummern")
  ) {

    waitingForEmergencyNumber = true;

    observerSpeak(
      "Nennen Sie jetzt die Notfallnummer."
    );

    return;
  }


  /* ==========================
     NOTFALLNUMMER 03
  ========================== */

  if (
    waitingForEmergencyNumber
  ) {

    const is03 =
      command === "03" ||
      command === "0 3" ||
      command === "null drei" ||
      command === "null drei" ||
      command === "drei";

    if (is03) {

      startEmergency();

      return;
    }

  }


  /* ==========================
     MAILBOX
  ========================== */

  if (
    command.includes(
      "spiele die mailbox ab"
    ) ||
    command.includes(
      "spiel die mailbox ab"
    ) ||
    command.includes(
      "spiele mailbox ab"
    ) ||
    command.includes(
      "spiel mailbox ab"
    ) ||
    command.includes(
      "mailbox abspielen"
    )
  ) {

    playMailbox();

    return;
  }


  /* ==========================
     HALLO
  ========================== */

  if (
    command === "hallo"
  ) {

    observerSpeak(
      "Hallo."
    );

    return;
  }


  /* ==========================
     WAS
  ========================== */

  if (
    command === "was"
  ) {

    observerSpeak(
      "Was?"
    );

    return;
  }


  /* ==========================
     WER BIST DU
  ========================== */

  if (
    command.includes(
      "wer bist du"
    )
  ) {

    observerSpeak(
      "Observer Typ 0.4"
    );

    return;
  }


  /* ==========================
     WO SIND WIR
  ========================== */

  if (
    command.includes(
      "wo sind wir"
    )
  ) {

    observerSpeak(
      "Ihr wurdet von zwei Männern hier reingebracht, sie trugen einen schwarzen Hoodie und eine schwarze Winterjacke, der eine hatte einen Zettel darin versteckt."
    );

    return;
  }


  /* ==========================
     HILFE
  ========================== */

  if (
    command.includes("hilfe")
  ) {

    observerSpeak(
      "Ich bin nicht fürs Helfen da."
    );

    return;
  }


  /* ==========================
     WASCHMASCHINE
  ========================== */

  /*
    Wichtig:

    "Waschmaschine" funktioniert
    auch innerhalb eines ganzen Satzes.

    Beispiele:

    "Hast du eine Waschmaschine?"

    "Was ist mit der Waschmaschine?"

    "Ich war gerade bei der Waschmaschine."

    → immer gleiche Reaktion.
  */

  if (
    command.includes(
      "waschmaschine"
    )
  ) {

    observerSpeak(
      "Ich bin nicht für eine Wäsche gemacht."
    );

    return;
  }


  /* ==========================
     WIE KOMMEN WIR RAUS
  ========================== */

  if (
    command.includes(
      "wie kommen wir raus"
    ) ||
    command.includes(
      "wie kommen wir hier raus"
    ) ||
    command.includes(
      "wie kommen wir heraus"
    ) ||
    command.includes(
      "wie kommen wir hier heraus"
    ) ||
    command.includes(
      "wie kommen wir wieder raus"
    ) ||
    (
      command.includes("wie")
      &&
      command.includes("raus")
    )
  ) {

    observerSpeak(
      "Probiert es mal mit der Tür, sonst sind alle Wege im Betriebssystem blockiert."
    );

    return;
  }


  /*
    ALLES ANDERE:

    Keine Reaktion.

    Kein "Befehl nicht erkannt".

    Das Auge macht nichts Besonderes.
  */

}


/* ==================================================
   KAMERA
================================================== */

async function startCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    console.log(
      "Kamera wird vom Browser nicht unterstützt."
    );

    return;
  }


  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: "user"
          },

          audio: false

        });


    camera.srcObject = stream;

    cameraReady = true;


    if (!cameraInterval) {

      cameraInterval =
        setInterval(
          detectCameraPattern,
          1000
        );

    }

  } catch (error) {

    console.log(
      "Kamera konnte nicht gestartet werden:",
      error
    );

  }
}


/* ==================================================
   KAMERA-MUSTER
================================================== */

/*
  AKTUELLE TESTVERSION:

  Ein sehr helles Muster vor der Kamera
  wird als Muster erkannt.

  Später können wir daraus eure echten
  Dreieck/Kreis/Quadrat-Muster machen.
*/

function detectCameraPattern() {

  if (
    !observerActivated ||
    !cameraReady ||
    cameraCooldown ||
    mailboxPlaying ||
    emergencyPause
  ) {
    return;
  }


  if (
    camera.videoWidth === 0 ||
    camera.videoHeight === 0
  ) {
    return;
  }


  canvas.width = 80;
  canvas.height = 60;


  ctx.drawImage(
    camera,
    0,
    0,
    80,
    60
  );


  const image =
    ctx.getImageData(
      0,
      0,
      80,
      60
    );


  let brightness = 0;

  const pixels =
    image.data.length / 4;


  for (
    let i = 0;
    i < image.data.length;
    i += 4
  ) {

    brightness +=
      (
        image.data[i] +
        image.data[i + 1] +
        image.data[i + 2]
      ) / 3;

  }


  brightness /= pixels;


  let state;


  if (brightness > 220) {

    state = "white";

  } else if (brightness < 35) {

    state = "black";

  } else {

    state = "neutral";

  }


  if (
    state === lastCameraState
  ) {
    return;
  }


  lastCameraState = state;


  if (
    state === "white"
  ) {

    cameraCooldown = true;

    observerSpeak(
      "Muster erkannt."
    );


    setTimeout(() => {

      cameraCooldown = false;

    }, 5000);

  }

}


/* ==================================================
   OBSERVER AKTIVIEREN
================================================== */

activateButton.addEventListener(
  "click",
  async () => {

    observerActivated = true;

    activateButton.classList.add(
      "hidden"
    );

    status.textContent =
      "BEOBACHTUNG AKTIV";


    /*
      iPad/Safari Audio-Unlock.

      Diese Aktion kommt direkt vom
      Benutzer und ist deshalb wichtig
      für die spätere Sprachausgabe.
    */

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis.cancel();

      const unlock =
        new SpeechSynthesisUtterance("");

      unlock.lang = "de-DE";

      unlock.volume = 0;

      window.speechSynthesis.speak(
        unlock
      );

    }


    /*
      Mikrofon starten
    */

    startRecognition();


    /*
      Kamera starten
    */

    await startCamera();


    /*
      TIMER ABSICHTLICH NICHT STARTEN.

      Der Timer startet erst beim
      Öffnen des Duschvorhangs.
    */

  }
);


/* ==================================================
   INITIALER ZUSTAND
================================================== */

updateTimer();

</script>

</body>
</html>
