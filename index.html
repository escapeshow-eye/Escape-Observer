<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      border-radius: 8px;
    }

    #status {
      max-width: 90%;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h2>iPad Observer Test</h2>

  <button id="start">
    TEST STARTEN
  </button>

  <div id="status">
    Noch nicht gestartet
  </div>

<script>

const button =
  document.getElementById("start");

const status =
  document.getElementById("status");


let recognition = null;


/* =====================================
   TEST START
===================================== */

button.addEventListener("click", async () => {

  status.textContent =
    "Starte Test...";


  /* ================================
     1. AUDIO TEST
  ================================= */

  if ("speechSynthesis" in window) {

    const speech =
      new SpeechSynthesisUtterance(
        "Test erfolgreich. Die Stimme funktioniert."
      );

    speech.lang = "de-DE";
    speech.rate = 0.85;
    speech.volume = 1;

    window.speechSynthesis.resume();

    window.speechSynthesis.speak(
      speech
    );

  } else {

    status.textContent =
      "FEHLER: Sprachwiedergabe wird nicht unterstützt.";

    return;

  }


  /* ================================
     2. MIKROFON TEST
  ================================= */

  try {

    await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    status.textContent =
      "Mikrofon erlaubt. Sage jetzt: TEST";

  }

  catch (error) {

    status.textContent =
      "MIKROFON FEHLER: " + error.message;

    return;

  }


  /* ================================
     3. SPRACHERKENNUNG
  ================================= */

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    status.textContent =
      "FEHLER: Safari stellt SpeechRecognition nicht bereit.";

    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "de-DE";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.onstart = () => {

    status.textContent =
      "🎙️ Ich höre... Sage jetzt: TEST";

  };


  recognition.onresult = event => {

    const text =
      event.results[0][0].transcript;


    status.textContent =
      "Ich habe gehört: " + text;

  };


  recognition.onerror = event => {

    status.textContent =
      "SPRACHERKENNUNGS-FEHLER: " +
      event.error;

  };


  recognition.onend = () => {

    console.log(
      "Spracherkennung beendet."
    );

  };


  try {

    recognition.start();

  }

  catch (error) {

    status.textContent =
      "START-FEHLER: " +
      error.message;

  }

});

</script>

</body>
</html>
