<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<title>Observer Test</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#eye {
    width: 170px;
    height: 100px;
    border: 4px solid white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#pupil {
    width: 50px;
    height: 50px;
    background: white;
    border-radius: 50%;
}

#text {
    margin-top: 35px;
    width: 85%;
    text-align: center;
    font-size: 18px;
    min-height: 30px;
}

#start {
    margin-top: 25px;
    padding: 14px 24px;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    border-radius: 5px;
    font-size: 14px;
}

</style>
</head>

<body>

<div id="eye">
    <div id="pupil"></div>
</div>

<div id="text"></div>

<button id="start">
    OBSERVER STARTEN
</button>

<script>

const text =
    document.getElementById("text");

const start =
    document.getElementById("start");


let recognition = null;

let listening = false;

let speaking = false;


/* =========================================
   SPRACHERKENNUNG
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "de-DE";

    recognition.continuous =
        true;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        3;


    recognition.onstart = () => {

        listening = true;

        console.log(
            "Observer hört zu."
        );

    };


    recognition.onresult = event => {

        if (speaking) {
            return;
        }


        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const result =
                event.results[i];


            if (!result.isFinal) {
                continue;
            }


            const heard =
                result[0]
                    .transcript
                    .toLowerCase()
                    .trim();


            console.log(
                "Gehört:",
                heard
            );


            if (
                heard.includes("hallo")
            ) {

                sayHello();

                return;

            }

        }

    };


    recognition.onerror =
        event => {

            listening = false;

            console.log(
                "Erkennungsfehler:",
                event.error
            );

        };


    recognition.onend = () => {

        listening = false;


        /*
           NICHT ständig automatisch
           neu starten.

           Nur nach einer Antwort.
        */

        if (
            speaking
        ) {

            return;

        }

    };

}


/* =========================================
   HALLO
========================================= */

function sayHello() {

    if (speaking) {
        return;
    }


    speaking = true;


    /*
       Mikrofon stoppen,
       damit man den Observer
       nicht während seiner Antwort
       selbst triggert.
    */

    stopListening();


    text.textContent =
        "Hallo.";


    /*
       Alte Sprachwiedergabe löschen.
    */

    if (
        window.speechSynthesis
    ) {

        window.speechSynthesis.cancel();

        window.speechSynthesis.resume();

    }


    /*
       Sprachobjekt
    */

    const utterance =
        new SpeechSynthesisUtterance(
            "Hallo."
        );


    utterance.lang =
        "de-DE";

    utterance.rate =
        0.9;

    utterance.pitch =
        0.8;

    utterance.volume =
        1;


    /*
       Stimme möglichst auf Deutsch setzen.
    */

    const voices =
        window.speechSynthesis
            ?.getVoices();


    if (
        voices &&
        voices.length
    ) {

        const germanVoice =
            voices.find(
                voice =>
                    voice.lang === "de-DE"
            )
            ||
            voices.find(
                voice =>
                    voice.lang
                        ?.toLowerCase()
                        .startsWith("de")
            );


        if (
            germanVoice
        ) {

            utterance.voice =
                germanVoice;

        }

    }


    /*
       Falls iPadOS onend NICHT liefert,
       funktioniert der Test trotzdem.
    */

    let finished =
        false;


    function finish() {

        if (finished) {
            return;
        }

        finished = true;


        /*
           Text nach spätestens
           1,5 Sekunden entfernen.
        */

        text.textContent =
            "";


        speaking =
            false;


        /*
           Danach wieder zuhören.
        */

        setTimeout(
            startListening,
            500
        );

    }


    utterance.onend =
        finish;


    utterance.onerror =
        finish;


    /*
       Sicherheits-Timeout.
    */

    setTimeout(
        finish,
        1500
    );


    /*
       WICHTIG:
       speechSynthesis direkt aus
       dem bereits aktivierten
       Observer-Kontext verwenden.
    */

    try {

        window.speechSynthesis
            .speak(
                utterance
            );

    }

    catch (error) {

        console.log(
            "Sprachfehler:",
            error
        );

        finish();

    }

}


/* =========================================
   ZUHÖREN
========================================= */

function startListening() {

    if (
        !recognition ||
        listening ||
        speaking
    ) {

        return;

    }


    try {

        recognition.start();

    }

    catch (error) {

        console.log(
            "Startfehler:",
            error
        );

    }

}


/* =========================================
   ZUHÖREN STOPPEN
========================================= */

function stopListening() {

    if (
        !recognition
    ) {

        return;

    }


    try {

        recognition.stop();

    }

    catch (error) {}

}


/* =========================================
   STARTBUTTON
========================================= */

start.addEventListener(
    "click",
    () => {

        /*
           Sehr wichtig für iPad:
           Audio direkt innerhalb des
           Benutzer-Taps initialisieren.
        */

        if (
            window.speechSynthesis
        ) {

            window.speechSynthesis.cancel();

            window.speechSynthesis.resume();

        }


        /*
           Button entfernen.
        */

        start.style.display =
            "none";


        /*
           Mikrofon starten.
        */

        startListening();

    }
);

</script>

</body>
</html>
